\n耗时：计划90–100分；异常上限约120分\n停车：到达1号航站楼后，跟“Car Hire／Autonoleggio”（租车）标牌下到地下一层。\n预订：Goldcar订单见Goldcar订单已付€1,079.77；Ford Focus Station Wagon或同组；11:00取车\n执行：在 Goldcar 柜台旁的 Key’n Go 自助机取钥匙。核对实际车型、满油取车满油还车（Full/Full）、已购的 Super Relax 与 Mega Relax 保障、斯洛文尼亚跨境许可及燃油预授权。驶离前拍下车身四面、车顶、玻璃、轮毂、底部可见处、内饰、油表和里程。\n备选：自助机取不出钥匙就去人工柜台。12:10还没开出机场，取消贝拉岛室内参观，改去 Stresa 湖滨。"}, {"time": "11:30–12:25", "title": "米兰机场→Carciano 码头停车场", "desc": "类型：驾车｜状态：建议\n导航：45.8908, 8.5250\n耗时：约45–55分\n停车：先去 Piazzale Lido 8 的露天公共停车区，市营清单列70个小车位；满位再去 Viale Lido 的 Multipiano 多层车库，列41个小车位。点导航按钮可到相应坐标。\n执行：大箱放进后备厢并拉好遮物帘，护照、现金、电子设备和药物随身带走；不要停好车后在车旁整理全部行李。午餐吃简餐或外带。\n备选：12:25仍未停好车就改搭14:00船；若天气或船班异常，直接游Stresa。\n预约说明：两处都不用预约，现场有空位再入场、缴费；若都满了，按时间改乘下一班船或只逛 Stresa。"}, {"time": "12:25–13:15", "title": "Carciano码头附近快速午餐、买船票", "desc": "类型：餐饮｜状态：建议\n导航：Lido di Stresa, Piazzale Lido 1, Stresa\n耗时：约50分窗口，包含停车、步行、现场买船票和简餐\n停车：Piazzale Lido公共停车区；备选：Viale Lido多层停车场。坐标导航、路线与留车安排见本日停车卡片。\n预订：船票当天在Navigazione Laghi官方售票处现场买；默认Carciano⇄Isola Bella往返，目标13:20去／16:15回。若决定加岛，先问清岛际班次、回程和所需票种。\n午餐一：Lido di Stresa｜Piazzale Lido 1；码头步行约2–4分钟。优先问panini、focaccia等简餐；湖边位置方便，披萨需确认午市供应及等候时间。\n午餐二：L'Idrovolante｜Piazzale Lido 6；码头旁，步行约1–3分钟。适合简单午餐，便利优先；先问最快能出的餐，不点耗时大菜。\n午餐三：La Cascina｜Via Galileo Galilei 4, Carciano；步行约10–12分钟。以披萨为主、可外带，适合提前抵达或改搭14:00船；时间紧不绕过去。\n执行：先买船票，再选一家吃简餐，13:05前到登船口。三家步行时间均为估算，当天若排队或出餐慢，就买外带食物。\n购票提示：若当班船支持 NaviTap 刷卡乘船，先告知船员，再用非接触式 Visa／Mastercard 上船、下船各刷一次，两次使用同一张卡；建议两人各用自己的卡。这样可省去售票处买票，仍需排队登船。不支持或付款失败就去窗口买票。"}, {"time": "13:20–13:25", "title": "Carciano→Isola Bella", "desc": "类型：乘船｜状态：现场买票\n导航：Isola Bella\n耗时：单程约5分钟\n停车：Piazzale Lido公共停车区；备选：Viale Lido多层停车场。坐标导航、路线与留车安排见本日停车卡片。\n预订：船票当天现场买，默认Navigazione Laghi的Carciano⇄Isola Bella往返；公共船票与宫殿花园Admission门票分开。\n班次：非等间隔。午后Carciano发船13:20、14:00、14:20、14:40、15:10、15:30、16:10、17:00、17:25，相邻间隔20–50分钟；午间12:15之后须等13:20，间隔65分钟。\n执行：今天先去贝拉岛。若想再去母亲岛或渔人岛，先确认岛际船班和返回 Carciano 的时间，再决定是否缩短后面的湖滨散步。\n备选：错过13:20改14:00，需等40分钟；以上为适用至10/4的2026官方船表，9/24周四适用，当天留意停航或调整公告。\n现场便利选项：当班支持NaviTap时，可告知船员后刷非接触式Visa/Mastercard登船，下船再刷同一张卡；未刷下船会按全网一日票计费。省去售票处购票，不保证免登船等候；约13:00到码头准备。"}, {"time": "13:30–16:00", "title": "Isola Bella宫殿、洞穴与巴洛克花园", "desc": "类型：景点｜状态：待订\n导航：Palazzo Borromeo, Isola Bella\n耗时：约2.5小时\n停车：Piazzale Lido公共停车区；备选：Viale Lido多层停车场。坐标导航、路线与留车安排见本日停车卡片。\n预订：建议于前一天9/23在https://terreborromeo.it/en购买9/24的Admission Isola Bella，成人€24/人，夫妻共€48；含宫殿与花园，不含船票。以下单页为准，9/24 17:00最后入场。\n三岛说明：博罗梅奥群岛有三个主要游览岛。Isola Bella（贝拉岛）以宫殿、洞穴与层叠巴洛克花园最经典，本次优先；Isola Madre（母亲岛）侧重植物园与宫殿；Isola dei Pescatori（渔人岛）侧重渔村、巷道与餐饮。\n执行：先参观宫殿和装饰洞穴，再逛花园、Teatro Massimo 露台和湖景处。母亲岛、渔人岛留作当天看时间和体力再选。\n加岛条件：加岛前先确认岛际船班、回 Carciano 的时间，以及现有船票是否适用；母亲岛宫殿花园的门票另查。加岛后相应缩短或取消 Stresa 湖滨散步，仍争取17:30取车去米兰。\n备选：只游贝拉岛时，16:00往码头走，乘16:15班船回岸。若14:00才乘船上岛，参观安排约14:05–16:05。大雨时只看宫殿，提前回岸。\n购票提示：9月23日看过天气后，再买9月24日的指定日期票。把电子票存到手机，到入口出示；€24票不可改期、不可退款，不含船票。现场可能仍需排队。\n费用：9月16日官方购票页选9月24日，成人指定日期票€24，夫妻共€48；开放日期票为€27/人。指定日期票不可改退，不含船票，实际付款前再核对。", "walking_guide_ids": ["day1-bella-stresa"]}, {"time": "16:15–16:20", "title": "Isola Bella→Carciano", "desc": "类型：乘船｜状态：现场买票\n导航：Imbarcadero di Carciano, Stresa\n耗时：单程约5分钟\n预订：默认16:15回程，另有17:05备选；船票当天现场买。\n班次：非等间隔。午后Isola Bella发船14:05、14:25、14:45、15:15、15:35、16:15、17:05、18:00、19:20，相邻间隔20–80分钟；15:35→16:15隔40分钟，16:15→17:05隔50分钟。16:15到Carciano为16:20，17:05到为17:10。\n备选：如临时加Madre或Pescatori，另查岛际船表，以现场确认的班次重排返回Carciano时间，并缩短或取消Stresa湖滨段。本表适用至10/4，9/24当天仍留意调整公告。\n停车：Piazzale Lido公共停车区；备选：Viale Lido多层停车场。坐标导航、路线与留车安排见本日停车卡片。"}, {"time": "16:25–17:30", "title": "Stresa 湖滨散步，累了可随时回车", "desc": "类型：景点｜状态：建议\n导航：Stresa Lungolago\n耗时：散步约20–40分钟，16:25–17:30这段时间也可用来休息或喝咖啡。\n停车：Piazzale Lido公共停车区；备选：Viale Lido多层停车场。坐标导航、路线与留车安排见本日停车卡片。\n执行：从 Carciano 码头沿公共湖滨朝 Stresa 市中心走，看看花园和湖边酒店。走10–20分钟后原路回停车场，约17:30取车；途中可以坐下休息。\n备选：回船晚了或已有疲劳，就缩短散步，直接开往米兰。", "walking_guide_ids": ["day1-stresa-lakeside"]}, {"time": "17:30–19:10", "title": "Stresa→米兰 Casati 18，停车后入住", "desc": "类型：驾车｜状态：建议\n导航：Quick Buenos Aires Parking, Corso Buenos Aires 21, Milano\n耗时：约1小时20–40分\n停车：直接使用本日停车卡片中的具体车库；Casati 18没有自有停车场，酒店协议车库未落实。\n预订：酒店已订；14:00起入住\n执行：先把车停进 Quick Buenos Aires；满位再去 International Parking。取下全部行李，步行或叫车去酒店。进城绕开市中心收费限行区 Area C，并确认租车符合外围低排放区 Area B 的准入要求。若约18:00才离开 Stresa，把预计到店时间告诉朋友。\n备选：A8高速拥堵时告知酒店和朋友，不为赶晚餐加快车速。"}, {"time": "20:15起（弹性）", "title": "Nàpiz' Milano晚餐；目标6人会合", "desc": "类型：餐饮｜状态：已确认\n导航：Nàpiz' Milano, Viale Vittorio Veneto 30, Milano\n耗时：约60–90分\n停车：Quick Buenos Aires；备选：International Parking。预约和进出路线见当天停车卡。\n预订：已决定不订位；当天直接到店，时间完全弹性\n执行：正常返回时六人一起吃。夫妻若延误，朋友可以先吃，夫妻办完入住后在酒店附近解决。\n备选：无法安排6人桌或到店太晚：夫妻在酒店附近快速晚餐。"}], "overview": [{"time": "06:10", "do": "抵达苏黎世机场，入境后转机", "loc": "Zurich Airport", "tip": "同一票号"}, {"time": "08:55", "do": "LX1612 苏黎世→米兰MXP", "loc": "Zurich Airport", "tip": "已出票"}, {"time": "09:50–11:30", "do": "米兰机场取行李，11:00办理 Goldcar 取车", "loc": "Goldcar Rent a Car - Milan Malpensa Airport T1", "tip": "Goldcar订单见Goldcar订单已付€1,079.77；Ford Focus Station Wagon或同组；11:00取车"}, {"time": "11:30–12:25", "do": "米兰机场→Carciano 码头停车场", "loc": "45.8908, 8.5250", "tip": "停车：Piazzale Lido公共停车区，坐标45.8908, 8.5250；备选：Viale Lido多层停车场。"}, {"time": "12:25–13:15", "do": "Carciano码头附近快速午餐、买船票", "loc": "Lido di Stresa, Piazzale Lido 1, Stresa", "tip": "Lido di Stresa／L'Idrovolante／La Cascina三选一；船票现场买，13:05前到登船口。"}, {"time": "13:20–13:25", "do": "Carciano→Isola Bella", "loc": "Isola Bella", "tip": "船票建议当天办理：当班支持NaviTap则刷卡，否则窗口买票。单程5分钟；13:20默认，下一班14:00（隔40分钟）。"}, {"time": "13:30–16:00", "do": "Isola Bella宫殿、洞穴与巴洛克花园", "loc": "Palazzo Borromeo, Isola Bella", "tip": "建议9/23官网买9/24 Admission €24/人；Bella最经典优先游，Madre和Pescatori暂不安排、可临时决定。"}, {"time": "16:15–16:20", "do": "Isola Bella→Carciano", "loc": "Imbarcadero di Carciano, Stresa", "tip": "单程5分钟；16:15默认，下一班17:05（隔50分钟）；如加岛需重排回程。"}, {"time": "16:25–17:30", "do": "Stresa 湖滨散步，累了可随时回车", "loc": "Stresa Lungolago", "tip": "返船后沿Carciano湖滨向Stresa Centro走20–40分钟，可坐下或喝咖啡；不必走到老城。约17:30回车，疲劳则直接赴米兰。"}, {"time": "17:30–19:10", "do": "Stresa→米兰 Casati 18，停车后入住", "loc": "Quick Buenos Aires Parking, Corso Buenos Aires 21, Milano", "tip": "停车：Quick Buenos Aires；备选：International Parking"}, {"time": "20:15起（弹性）", "do": "Nàpiz' Milano晚餐；目标6人会合", "loc": "Nàpiz' Milano, Viale Vittorio Veneto 30, Milano", "tip": "已决定不订位；当天直接到店，时间完全弹性"}], "confirm": ["固定项：LX1612 08:55–09:50；Goldcar 11:00取车；Isola Bella 17:00停止入场", "13:20–13:25 Carciano→Isola Bella（船票现场买；14:00备选）", "建议9/23官网买9/24 Admission Isola Bella €24/人，2人€48（待订；船票另购）", "16:15–16:20 Isola Bella→Carciano（17:05备选；临时加岛则重排）"], "risks": ["12:55前到Carciano码头，目标13:20船，错过则改14:00船并压缩岛上时间", "触发备选：大雨、船班异常或驾驶疲劳：只游Stresa湖滨和老城；晚上返回米兰。"], "map": [{"label": "苏黎世机场", "kind": "transit", "lat": 47.461714199999996, "lng": 8.550859899999999}, {"label": "米兰马尔彭萨 T1", "kind": "transit", "lat": 45.6273686, "lng": 8.712440599999999}, {"label": "Carciano码头", "kind": "transit", "lat": 45.8910719, "lng": 8.5247732}, {"label": "Isola Bella", "kind": "sight", "lat": 45.895437799999996, "lng": 8.5268401}, {"label": "Stresa湖滨", "kind": "sight", "lat": 45.887018, "lng": 8.5337155}, {"label": "Casati 18（过夜）", "kind": "hotel", "lat": 45.4787207, "lng": 9.2040999}], "hotel": {"name": "WorldHotel Casati 18", "status": "已订"}, "intro": "落地取车后，夫妻先去马焦雷湖，四位朋友在米兰自行活动。从 Carciano 码头坐船到贝拉岛，慢看宫殿和花园，回岸后再沿湖散步。傍晚开到米兰入住，争取六人一起吃披萨；若出机场太晚，就改在 Stresa 湖边休息。", "walking_note": "单段攻略对应所在时段；完整路线总览列明覆盖的时段，含午餐时按顺序分段执行。替换方案会改变对应主线，不是追加活动。", "map_routes": [[0, 1, 2, 3, 2, 4, 5]], "parking_ids": ["carciano", "milan-casati"]}, {"n": 2, "id": "D2", "date": "2026-09-25", "dow": "周五", "title": "Sirmione 古城与湖岸，傍晚六人乘日落游船", "phase": "6人同行；仅酒庄时段分流，夫妻走古城与西岸", "theme": "Milan → Sirmione｜水上城堡・请接吻・12:00午餐・罗马遗址与电影取景地 → 夫妻古教堂及西岸 / 朋友酒庄 → 45分钟日落游船 → Esplanade｜强度 中偏紧凑", "oneliner": "12:00先吃午餐，饭后一起走半岛尖端；夫妻下午古城步行，傍晚随朋友乘船，20:00一星晚餐。", "warning": "午餐12:00–12:45；朋友船票已买，集合随朋友安排，20:00 Esplanade六人晚餐。", "items": [{"time": "08:15–10:00", "title": "退房，Milan→Sirmione", "audience": "all", "desc": "类型：驾车｜状态：计划\n导航：Piazzale Monte Baldo, 25019 Sirmione BS\n耗时：路程按约1小时45分规划，交通拥堵时以实时导航为准。\n停车：两车留 Parcheggio Monte Baldo；满位备选 Parcheggio Piazzale Europa。两处普通小汽车不用预约，按现场余位进入。\n执行：两辆车停在古城外。通往历史中心的桥 s小堂为路标；先看余位和限行标志，再决定是否开上圣堂。"}, {"time": "10:30–10:45", "title": "看余位提示，条件允许开到圣堂前停车", "desc": "类型：停车｜状态：建议\n导航：Santuario di Montecastello, Via Don Domenico Triboldi, 4, 25080 Tignale BS, Italy\n耗时：约15分\n停车：主选圣堂前小广场；不用预约，现场有位才停\n执行：只有现场明确有位、道路开放，且司机确认两辆车连后视镜都能安全通过时，才开上最后一段山路。游客曾反馈上方约10个车位，不能当作当天可用车位数。\n备选：满位、提示不清或司机没把握，就停 Santa Libera 山脚，按下方步行方案上山。\n道路：末段约800米、坡度25%、最大车辆宽度2.30米，另有急弯和窄拱门；按实际车辆含后视镜尺寸留余量，不能把2.30米理解为路面宽。圣堂前停车与继续往Eremo的院内车位不同。"}, {"time": "10:45–11:30", "title": "Montecastello圣堂与湖景平台", "desc": "类型：景点｜状态：建议\n导航：Santuario di Montecastello\n耗时：约45分\n停车：车留圣堂前允许停车区域\n执行：参观圣堂和湖景平台，预计10:45–11:30停留，11:30离开前往Riva。\n备选：若圣堂临时闭门，安全看外观与湖景后离开。", "walking_guide_ids": ["day3-montecastello"]}, {"time": "11:30–12:15", "title": "Montecastello下山→Riva del Garda", "desc": "类型：驾车｜状态：建议\n导航：Parcheggio Monte Oro, Via Monte Oro, Riva del Garda\n耗时：驾车约45分钟；停车换鞋另留20分钟\n停车：主选Monte Oro；备选Parcheggio ex ospedale\n执行：11:30从圣堂停车处出发，约12:15到Monte Oro。按允许道路下山并沿湖西岸前往Riva，以实时导航为准；两车各自按安全速度行驶，不在窄路等待会合。若堵车，把晚点留给下午可选骑行调整。"}, {"time": "12:15–12:35", "title": "Monte Oro停车，准备Ponale徒步", "desc": "类型：准备｜状态：临近确认\n导航：Parcheggio Monte Oro, Via Monte Oro, Riva del Garda\n耗时：约20分\n停车：车留Monte Oro；不用预约，现场停车\n执行：换鞋、带水和可随时吃的简餐；核对Ponale开放与天气，确认今天免费Pregasina接驳运行后再走单程。目标Regina Mundi站15:16返Riva，提前到站；步行到水电站旁入口。\n备选：官方关闭或持续强降雨就不进入步道，提前去Limone。"}, {"time": "12:35–13:40", "title": "Ponale去程：Riva→Belvedere Ponale Alto", "desc": "类型：徒步｜状态：建议\n导航：Belvedere Ponale Alto\n耗时：约65分，单程约3km\n停车：车留Monte Oro\n执行：从Riva水电站附近走到SS45bis汽车隧道入口前，按“Ponale／D01”指示左转进入悬崖旧路，不进汽车隧道。沿湖景段与短隧道到Belvedere午餐，之后继续向Pregasina／Regina Mundi；沿路留意自行车，不走瀑布或Ledro支线。\n距离依据：Belvedere经营方指引从Riva中心约3km、步行45–60分钟；计划步行时间包含从车库到入口及拍照余量。"}, {"time": "13:40–14:00", "title": "Belvedere湖景简午餐", "desc": "类型：餐饮｜状态：建议，未预订\n导航：Belvedere Ponale Alto\n耗时：约20分钟，快速简餐和短休\n停车：车留Monte Oro\n执行：看湖景并吃快速简餐，14:00继续往Regina Mundi。只有能及时出餐时才点餐，不安排慢慢等位的正式午餐。\n备选：闭店、排队或出餐慢就吃自带简餐；14:00仍不能出发则放弃赶15:16，改下一班并取消Limone骑行，或从Belvedere原路回Riva。"}, {"time": "14:00–15:00", "title": "Belvedere→Regina Mundi", "desc": "类型：徒步｜状态：建议\n导航：Regina Mundi, Pregasina\n耗时：预留约60分钟，持续上坡\n停车：汽车留Monte Oro\n执行：从Belvedere继续，按Pregasina方向路标走左侧支线，到Regina Mundi圣母像观景台。目标15:00左右抵达，15:05前找到Riva方向接驳站牌；这段要继续爬升，按全队速度走，不为赶班车加速。\n备选：体力或天气不适合时，在Belvedere决定原路回Riva；若只晚点，改16:16班车，取消Limone骑行。"}, {"time": "15:00–15:16", "title": "Regina Mundi观景与候车", "desc": "类型：候车｜状态：建议\n导航：Regina Mundi, Pregasina\n耗时：约10–16分钟，15:05前到站\n停车：汽车留Monte Oro\n执行：在圣母像观景台短停，然后认“Regina Mundi (Pregasina)”站牌和开往Riva方向。地图按钮定位观景台，实际候车位置以站牌为准；不用再走到Pregasina村中心或公路岔口站。提前候车，向司机确认Riva Autostazione。"}, {"time": "15:16–15:37", "title": "免费接驳：Regina Mundi→Riva Autostazione", "desc": "类型：公交｜状态：建议\n导航：Riva del Garda Autostazione, Viale Trento 5\n耗时：约21分钟；免费Pregasina接驳\n停车：汽车留Monte Oro\n执行：15:16从Regina Mundi (Pregasina)上车，15:37到RIVA DEL G. Autostaz.终点。今天9/26周六在运营日期内；认免费Riva–Pregasina接驳，不把普通B214当作同一班。时刻来自2026官方表6/27–9/27部分，并非实时到站。\n备选：错过、满员或晚到则用16:16→16:37，约17:00才取到车，取消Limone骑行；运营临时取消时按现场公告安排返城。\n时刻表：https://gardatrentino.it/Orari/Orari_Autobus/2026/2026_Riva_Pregasina.pdf"}, {"time": "15:37–16:00", "title": "步行回Monte Oro取车", "desc": "类型：步行与取车｜状态：建议\n导航：Parcheggio Monte Oro, Via Monte Oro, Riva del Garda\n耗时：预留约20–23分钟，含步行与缴费\n停车：汽车留Monte Oro\n执行：从Viale Trento的Riva Autostazione按步行导航回Monte Oro。汽车站并非徒步起点，需留这段市内步行；预计15:55–16:00到车，缴费、整理后开往Limone。\n备选：若停车时用了其他车库，回实际停车点，后续按实际取车时间调整。"}, {"time": "16:00–16:45", "title": "Riva del Garda→Limone", "desc": "类型：驾车｜状态：建议\n导航：Multipiano Lungolago, Lungolago Marconi, Limone sul Garda\n耗时：预留35–45分\n停车：主选Multipiano Lungolago；备选via Caldogno\n执行：沿 SS45bis 湖西岸公路开往 Limone，预留35–45分钟给周六车流和入库找位。导航显示的行车时间不含从步道回停车场、上车和入库。"}, {"time": "16:45–17:05", "title": "Limone停车；按需寄存或先去车行", "desc": "类型：准备｜状态：住宿已订，提前寄存待确认\n导航：Garni Gianmartin\n耗时：计划约20分钟停车并走向车行；只有衔接顺利才骑车\n停车：Multipiano Lungolago；备选via Caldogno。酒店资料称约200米外住客免费多层停车，前台核对核销。\n预订：已订；入住15:00–20:00；订单已更正为2成人/2早餐（2026-08-21确认）\n执行：约16:45到公共车库，停好后直接步行去车行。只有酒店顺路且可立即接待时才寄存，不等待房间；汽车不开进老城。若停车或步行耽搁，就取消骑行，先入住再逛老城。\n备选：跳过酒店时行李暂留锁闭后备厢、贵重物随身；公共车库不等于行李安全保证。Garni须20:00前办好入住，预留19:30前到前台。"}, {"time": "17:05–17:30", "title": "到车行租电助力自行车，调好座高", "desc": "类型：准备｜状态：当天决定，未预约\n导航：Limone Bike Rental, Via IV Novembre 20\n耗时：预留约25分钟，17:30前能起骑才执行\n停车：汽车留Multipiano Lungolago\n预订：不提前付款锁定骑行；按当天到达、天气、体力和实际人数决定。原车行仅为导航参考，余车与尺寸不保证。\n执行：现场确认车型尺寸、电量、头盔、租金，以及18:30回店、18:45前还好的要求。只有17:30前已准备好、天气体力合适且店家允许时才出发；排队、无合适车或要求更早归还就取消骑行，直接入住逛老城。"}, {"time": "17:30–18:30", "title": "可选短骑：朝Limone悬空骑行道方向", "desc": "类型：骑行｜状态：天气、余车与体力合适时执行\n导航：Limone Bike Rental, Via IV Novembre 20\n耗时：最多1小时，含拍照；不保证到达或骑完整条悬空段\n停车：汽车留原车库，不为骑行另找车位\n执行：17:30前能起骑才出发，经老城、Via Nova、Via Reamol向Capo Reamol前进；最迟18:00原路折返，18:30回店。只骑当天余量允许的一段；拥挤、推行慢或路况不佳就更早回头，不继续沿SS45bis去Riva。晚到或改搭16:16接驳时取消骑行。\n路况：著名悬空段约2km；公园骑行路线从湖滨单程4.4km、累计爬升102m，车行接驳另计，所以全程并非平路。老城与湖滨部分路段下车推行；共道限速10km/h，拥挤时推行；还车缓冲不能换成赶路。"}, {"time": "18:30–18:45", "title": "返回车行，完成还车", "desc": "类型：还车｜状态：建议\n导航：Limone Bike Rental, Via IV Novembre 20\n耗时：约15分\n停车：汽车仍留原车库\n执行：目标18:30回到车行，留15分钟验车和排队，18:45前完成还车；如车行现场要求更早归还，按较早时间执行。\n最晚：选择骑行时以18:45完成还车为上限；山脚步行圣堂或改搭16:16接驳的替换线取消骑行。"}, {"time": "18:45–19:45", "title": "Limone老城暮色；补办入住（如需要）", "desc": "类型：景点｜状态：建议\n导航：Piazza Garibaldi, Limone sul Garda\n耗时：约1小时，先入住，剩余时间逛老港和湖滨\n停车：车留原车库\n执行：还车后先回Garni办理入住，目标19:30前到前台、20:00前完成；有余力再逛老港和湖滨。已提前入住则直接散步，累了回房休息。\n光线：西侧山体可能提前遮住直射阳光，但未验证17:00–17:30的固定山影时刻。当天为满月，实际何时越过对岸山脊、能否看见均不保证。", "walking_guide_ids": ["day3-limone"]}, {"time": "20:00", "title": "Limone晚餐", "desc": "类型：餐饮｜状态：待选\n耗时：约90分\n预订：bestOne或Dal Bigaröla，待选\n停车：汽车留Multipiano Lungolago或已选公共备选。"}], "overview": [{"time": "09:00–10:30", "do": "Desenzano→Montecastello山脚入口", "loc": "Località Santa Libera, SP38（Olzano–Prabione之间、第一座 Via Crucis 小堂）, Tignale", "tip": "09:00从Palace Hotel出发，早餐和退房在出发前完成。导航至Olzano与Prabione之间、SP38旁的Santa Libera入口，以第一座Via Crucis小堂为路标；先看余位和限行标志，再决定是否开上圣堂。"}, {"time": "10:30–10:45", "do": "看余位提示，条件允许开到圣堂前停车", "loc": "Santuario di Montecastello, Via Don Domenico Triboldi, 4, 25080 Tignale BS, Italy", "tip": "只有现场明确有位、道路开放，且司机确认两辆车连后视镜都能安全通过时，才开上最后一段山路。游客曾反馈上方约10个车位，不能当作当天可用车位数。"}, {"time": "10:45–11:30", mone sul Garda", "tip": "沿 SS45bis 湖西岸公路开往 Limone，预留35–45分钟给周六车流和入库找位。导航显示的行车时间不含从步道回停车场、上车和入库。"}, {"time": "16:45–17:05", "do": "Limone停车；按需寄存或先去车行", "loc": "Garni Gianmartin", "tip": "约16:45到公共车库，停好后直接步行去车行。只有酒店顺路且可立即接待时才寄存，不等待房间；汽车不开进老城。若停车或步行耽搁，就取消骑行，先入住再逛老城。"}, {"time": "17:05–17:30", "do": "到车行租电助力自行车，调好座高", "loc": "Limone Bike Rental, Via IV Novembre 20", "tip": "现场确认车型尺寸、电量、头盔、租金，以及18:30回店、18:45前还好的要求。只有17:30前已准备好、天气体力合适且店家允许时才出发；排队、无合适车或要求更早归还就取消骑行，直接入住逛老城。"}, {"time": "17:30–18:30", "do": "可选短骑：朝Limone悬空骑行道方向", "loc": "Limone Bike Rental, Via IV Novembre 20", "tip": "17:30前能起骑才出发，经老城、Via Nova、Via Reamol向Capo Reamol前进；最迟18:00原路折返，18:30回店。只骑当天余量允许的一段；拥挤、推行慢或路况不佳就更早回头，不继续沿SS45bis去Riva。晚到或改搭16:16接驳时取消骑行。"}, {"time": "18:30–18:45", "do": "返回车行，完成还车", "loc": "Limone Bike Rental, Via IV Novembre 20", "tip": "目标18:30回到车行，留15分钟验车和排队，18:45前完成还车；如车行现场要求更早归还，按较早时间执行。"}, {"time": "18:45–19:45", "do": "Limone老城暮色；补办入住（如需要）", "loc": "Piazza Garibaldi, Limone sul Garda", "tip": "还车后先回Garni办理入住，目标19:30前到前台、20:00前完成；有余力再逛老港和湖滨。已提前入住则直接散步，累了回房休息。"}, {"time": "20:00", "do": "Limone晚餐", "loc": "餐饮｜状态：待选", "tip": "bestOne或Dal Bigaröla，待选"}], "confirm": ["Montecastello 4/1–11/1官网开放09:00–17:30；上山前看余位提示和现场标志。", "Garni 15:00–20:00入住，已确认的2成人/2早餐更正保留。", "Limone骑行当天决定，不提前付款锁定；车行当前09:00–19:00，现场确认余车、尺寸与还车截止，无车则改老城湖滨。", "20:00在 Limone 吃晚餐，餐厅仍待选择和预订。", "免费Pregasina接驳在2026/5/1–9/27的周末及节假日运行，9/26周六适用；当前表Regina Mundi→Riva为15:16→15:37，下一班16:16→16:37。"], "risks": ["上方约10位与入口余位提示来自2024/2025游客反馈，未获官方实时容量；提示缺失、满位或不适合通行时用山脚步行备选。", "15:16是目标班车，15:05前候车；14:00离开Belvedere只是步行预算，按全队速度，不靠赶路补时间。改16:16、满员或延误时取消Limone骑行，先办理入住。", "持续强降雨、强风或路线关闭时，改在镇内活动。9月26日的步道路况、营业和自行车余量，出发前及当天再查。"], "map": [{"label": "Palace Hotel", "kind": "hotel", "lat": 45.4603338, "lng": 10.5859629}, {"label": "Montecastello", "kind": "sight", "lat": 45.7419547, "lng": 10.733472599999999}, {"label": "Ponale / Riva del Garda", "kind": "sight", "lat": 45.8787649, "lng": 10.8378826}, {"label": "Belvedere Ponale Alto", "kind": "sight", " –Prabione之间、第一座 Via Crucis 小堂）, Tignale"}], "sources": [{"label": "Visit Brescia上山方式", "url": "https://www.visitbrescia.it/attivita/santuario-montecastello-tignale/"}, {"label": "Eremo末段道路", "url": "https://www.eremodimontecastello.it/contatti/"}, {"label": "Belvedere步行距离", "url": "https://www.ponalealtobelvedere.it/en/between-lake-garda-and-ledro/"}, {"label": "免费Pregasina接驳｜2026官方时刻表（用6/27–9/27部分）", "url": "https://gardatrentino.it/Orari/Orari_Autobus/2026/2026_Riva_Pregasina.pdf"}], "checked": "2026-09-26"}, {"after": "Belvedere湖景简午餐", "label": "午餐时决定；不赶班车", "title": "走不动就短线返回；晚点改16:16接驳", "summary": "天气或体力不适合继续上坡时，从Belvedere原路回Riva；只是晚点、仍想走单程，则接下一班16:16，取消Limone骑行。", "when": "在Belvedere用餐时看全队状态；14:00还不能继续上行，就不要硬赶15:16。", "details": [{"label": "短线返回", "text": "从Belvedere沿来时Ponale下山回Monte Oro，预留约1小时并按现场速度调整；这时不用公交。"}, {"label": "下一班", "text": "Regina Mundi 16:16→Riva Autostazione 16:37；约17:00回车、17:45到Limone，取消骑行，直接办理入住。已到观景台错过15:16时也按此安排。"}, {"label": "候车位置", "text": "认Regina Mundi (Pregasina)站牌和Riva方向，不用再走到Pregasina村中心或公路岔口站；现场公告与司机指引优先。"}], "sources": [{"label": "免费Pregasina接驳｜2026官方时刻表（用6/27–9/27部分）", "url": "https://gardatrentino.it/Orari/Orari_Autobus/2026/2026_Riva_Pregasina.pdf"}], "checked": "2026-09-26"}], "walking_note": "单段攻略对应所在时段；完整路线总览列明覆盖的时段，含午餐时按顺序分段执行。替换方案会改变对应主线，不是追加活动。", "walking_guide_ids": ["day3-ponale"], "parking_ids": ["D2-d3-palace-hotel-desenzano", "D3-montecastello-safe-access", "D3-riva-monte-oro-ponale", "D3-d4-limone-multipiano-garni"]}, {"n": 4, "id": "D4", "date": "2026-09-27", "dow": "周日", "title": "Montanara全景与Croz山屋徒步", "phase": "夫妻＋4位朋友", "theme": "Limone → Molveno｜夫妻＋4位朋友｜09:00离开酒店｜徒步游览约3小时45分钟，午餐另留60分钟", "oneliner": "Montanara全景与Croz山屋徒步", "warning": "只坐第一段缆车；11:35开始步行，12:20在Montanara午餐。目标16:20回Pradel，最迟17:15到站排队，公布17:45收班。", "items": [{"time": "09:00–09:20", "title": "09:00离开酒店，步行取车", "desc": "类型：准备｜状态：已按出发时间安排\n导航：Garni Gianmartin\n耗时：早餐和退房在09:00前完成；09:00离开酒店后，步行到车库、装车和出库合计预留20分钟。\n停车：按实际停放的车库取车；向Garni确认停车票核销和出场方式。\n执行：09:00从Garni Gianmartin出发，带行李步行到停车库，约09:20开车去Molveno。徒步鞋、水、外套和备用简餐单独装包。"}, {"time": "09:20–10:50", "title": "Limone→Molveno", "desc": "类型：驾车｜状态：建议\n导航：Funivie Molveno–Pradel, Via Nazionale 63, 38018 Molveno TN\n耗时：实际驾车约1小时20分钟，另留10分钟路况余量；取车、寄存、停车和缆车另计。\n停车：酒店能快速接收行李才短停；否则直接去Pradel谷站日间停车。\n执行：约09:20驶离Limone车库，目标10:50到Molveno。9/26核对实际车库至谷站的导航样本为1小时18分、62公里；出发按实时导航，注意道路绕行。堵车晚到先跳过酒店寄存，山上按攻略的时间界限缩短路线。"}, {"time": "10:50–11:05", "title": "顺路且能立即办理时，到酒店寄存行李", "desc": "类型：酒店｜状态：住宿已订，提前寄存和停车待确认\n导航：Alpenresort Belvedere\n耗时：最多10–15分钟；前台忙或无法立即接收就直接去缆车站。\n停车：Alpenresort Belvedere 室外住客停车；备选：Alpenresort Belvedere 车库入口。预约和进出路线见当天停车卡。\n预订：酒店直订已确认，Deluxe Half Board含早餐、晚餐和下午茶点。\n执行：酒店能马上接收行李才停靠，不等房间；随后开去Pradel谷站。晚到直接上山，下山后再正式入住。"}, {"time": "11:05–11:35", "title": "乘第一段缆车，从 Molveno 到 Pradel", "desc": "类型：交通｜状态：待订\n导航：Funivie Molveno–Pradel, Via Nazionale 63, 38018 Molveno TN\n耗时：谷站附近停车且无长队时，停车、购票和第一段缆车合留约30分钟；缆车本身约6分钟。停到Lido需另留接驳时间。\n停车：Parcheggio Funivie Molveno–Pradel；备选：Lido area，Molveno。预约和进出路线见当天停车卡。\n预订：现场确认天气、步道和末班后买第一段往返票；成人普通票€18，有效Guest Card票€16。\n执行：在售票处确认340bis／340B与340当天开放，问清末班下行。只乘Molveno–Pradel第一段，约11:35到Pradel后开始走向Malga Tovre、La Montanara。"}, {"time": "11:35–12:20", "title": "经Malga Tovre，步行上Montanara", "desc": "类型：徒步｜状态：主线\n导航：Rifugio La Montanara, Località Tovre Altopiano di Pradel, Molveno\n耗时：约45分钟；Pradel至Montanara官方参考约1公里、上升155米。\n停车：Parcheggio Funivie Molveno–Pradel；备选：Lido area，Molveno。预约和进出路线见当天停车卡。\n执行：从Pradel上站按“Malga Tovre／Rifugio La Montanara”步行路牌走，经草坡到Montanara观景露台；留意自行车，不进入下坡车道。Malga Tovre本季已关闭，作为经过点，午餐在Montanara。"}, {"time": "12:20–13:20", "title": "La Montanara山屋午餐与群山全景", "desc": "类型：餐饮｜状态：建议，未订位\n导航：Rifugio La Montanara, Località Tovre Altopiano di Pradel, Molveno\n耗时：共留60分钟，含就座、点餐、用餐和结账；目标13:20继续徒步。\n停车：Parcheggio Funivie Molveno–Pradel；备选：Lido area，Molveno。预约和进出路线见当天停车卡。\n执行：在Rifugio La Montanara吃午餐，看Brenta群峰全景。为六人就座、点餐、用餐和结账共留60分钟，目标13:20继续；实际等餐时间未确认。旅游局2026季末公告列营业至10/18、周二休；9/27为周日，具体厨房供应现场确认。带备用简餐应对无位或排队；13:45仍未出发则取消Croz段，经Malga Tovre返回Pradel。"}, {"time": "13:20–14:40", "title": "走340bis接340，到Croz山屋", "desc": "类型：徒步｜状态：主线，按现场开放情况\n导航：Croz of the Altissimo - Lodge, Valle delle Seghe, 38018 Molveno TN, Italy\n耗时：步行参考约1小时，另留20分钟用于等队、拍照短停和窄路让行；合计80分钟。\n停车：Parcheggio Funivie Molveno–Pradel；备选：Lido area，Molveno。预约和进出路线见当天停车卡。\n执行：从Montanara北侧小空地找“Sentiero delle Grotte／340B（也称340bis）”路牌，不跟352B往Palon di Tovre。沿340B下降，到Seghe del Mulon与340交会处向Croz山屋方向转，经过岩壁旁步道和短隧道到山屋。记住岔路，回程保持340往Pradel，不再上340B。临崖、湿滑或关闭时按攻略缩短。"}, {"time": "14:40–15:00", "title": "Croz山屋前看岩壁，短休息", "desc": "类型：休息｜状态：建议\n导航：Croz of the Altissimo - Lodge, Valle delle Seghe, 38018 Molveno TN, Italy\n耗时：约20分钟。\n停车：Parcheggio Funivie Molveno–Pradel；备选：Lido area，Molveno。预约和进出路线见当天停车卡。\n执行：在Rifugio Croz dell’Altissimo附近看巨大岩壁、喝水休息；15:00开始返回。目的地为山屋，本次不延伸到Selvata，也不登Croz山顶。"}, {"time": "15:00–16:20", "title": "沿340回Pradel，岔路不再上Montanara", "desc": "类型：徒步｜状态：主线\n导航：Pradel第一段缆车上站（往Molveno下行）\n耗时：参考同一路段约1小时，另留20分钟途中机动；合计80分钟，目标16:20回Pradel。\n停车：Parcheggio Funivie Molveno–Pradel；备选：Lido area，Molveno。预约和进出路线见当天停车卡。\n执行：从Croz沿340往Pradel返回；走到340bis岔路继续认“Pradel／340”，回到第一段缆车上站。岔路至Croz山屋这一段会重复，整条路线不是完全无折返。最迟15:15离开Croz，17:15前到上站排队。"}, {"time": "16:20–16:50", "title": "第一段缆车下山，取车去酒店", "desc": "类型：交通｜状态：建议\n导航：Funivie Molveno–Pradel, Via Nazionale 63, 38018 Molveno TN\n耗时：下山、步行到停车位和取车合计约30分钟，排队较长时顺延。\n停车：Parcheggio Funivie Molveno–Pradel；备选：Lido area，Molveno。预约和进出路线见当天停车卡。\n执行：回Pradel后直接乘第一段缆车下山，取车去Alpenresort Belvedere入住。第一段公布17:45结束，计划最迟17:15到上站排队；以当天现场末班为准。"}, {"time": "约17:00起", "title": "下山后入住，选湖滨散步或酒店休息", "desc": "类型：酒店｜状态：已确认\n导航：Alpenresort Belvedere\n预订：直订已确认；SPA与Wellness Set已含\n执行：先入住、放好装备。仍有精神时，17:30–18:40在 Molveno 北岸或 Bior 小湖附近散步，18:45回酒店；也可选择 SPA 或休息。19:30一起晚餐。\n备选：下山晚或累了，就直接回酒店休息。\n停车：Alpenresort Belvedere 室外住客停车；备选：Alpenresort Belvedere 车库入口。预约和进出路线见当天停车卡。", "walking_guide_ids": ["day4-molveno-lakeside"]}, {"time": "19:30", "title": "酒店四道式晚餐，房价已含", "desc": "类型：餐饮｜状态：已确认\n导航：Alpenresort Belvedere\n耗时：约2小时\n预订：已含；酒水另付\n执行：升级半食宿含晚餐和下午茶点，酒水另付；入住时确认晚餐具体安排。\n停车：Alpenresort Belvedere 室外住客停车；备选：Alpenresort Belvedere 车库入口。预约和进出路线见当天停车卡。"}], "overview": [{"time": "09:00–09:20", "do": "09:00离开酒店，步行取车", "loc": "Garni Gianmartin", "tip": "09:00从Garni Gianmartin出发，带行李步行到停车库，约09:20开车去Molveno。徒步鞋、水、外套和备用简餐单独装包。"}, {"time": "09:20–10:50", "do": "Limone→Molveno", "loc": "Funivie Molveno–Pradel, Via Nazionale 63, 38018 Molveno TN", "tip": "约09:20驶离Limone车库，目标10:50到Molveno。9/26核对实际车库至谷站的导航样本为1小时18分、62公里；出发按实时导航，注意道路绕行。堵车晚到先跳过酒店寄存，山上按攻略的时间界限缩短路线。"}, {"time": "10:50–11:05", "do": "顺路且能立即办理时，到酒店寄存行李", "loc": "Alpenresort Belvedere", "tip": "酒店能马上接收行李才停靠，不等房间；随后开去Pradel谷站。晚到直接上山，下山后再正式入住。"}, {"time": "11:05–11:35", "do": "乘第一段缆车，从 Molveno 到 Pradel", "loc": "Funivie Molveno–Pradel, Via Nazionale 63, 38018 Molveno TN", "tip": "在售票处确认340bis／340B与340当天开放，问清末班下行。只乘Molveno–Pradel第一段，约11:35到Pradel后开始走向Malga Tovre、La Montanara。"}, {"time": "11:35–12:20", "do": "经Malga Tovre，步行上Montanara", "loc": "Rifugio La Montanara, Località Tovre Altopiano di Pradel, Molveno", "tip": "从Pradel上站按“Malga Tovre／Rifugio La Montanara”步行路牌走，经草坡到Montanara观景露台；留意自行车，不进入下坡车道。Malga Tovre本季已关闭，作为经过点，午餐在Montanara。"}, {"time": "12:20–13:20", "do": "La Montanara山屋午餐与群山全景", "loc": "Rifugio La Montanara, Località Tovre Altopiano di Pradel, Molveno", "tip": "在Rifugio La Montanara吃午餐，看Brenta群峰全景。为六人就座、点餐、用餐和结账共留60分钟，目标13:20继续；实际等餐时间未确认。旅游局2026季末公告列营业至10/18、周二休；9/27为周日，具体厨房供应现场确认。带备用简餐应对无位或排队；13:45仍未出发则取消Croz段，经Malga Tovre返回Pradel。"}, {"time": "13:20–14:40", "do": "走340bis接340，到Croz山屋", "loc": "Croz of the Altissimo - Lodge, Valle delle Seghe, 38018 Molveno TN, Italy", "tip": "从Montanara北侧小空地找“Sentiero delle Grotte／340B（也称340bis）”路牌，不跟352B往Palon di Tovre。沿340B下降，到Seghe del Mulon与340交会处向Croz山屋方向转，经过岩壁旁步道和短隧道到山屋。记住岔路，回程保持340往Pradel，不再上340B。临崖、湿滑或关闭时按攻略缩短。"}, {"time": "14:40–15:00", "do": "Croz山屋前看岩壁，短休息", "loc": "Croz of the Altissimo - Lodge, Valle delle Seghe, 38018 Molveno TN, Italy", "tip": "在Rifugio Croz dell’Altissimo附近看巨大岩壁、喝水休息；15:00开始返回。目的地为山屋，本次不延伸到Selvata，也不登Croz山顶。"}, {"time": "15 线原路返回"}, {"label": "1号转2B岔口（往Pieralongia）", "kind": "sight", "lat": 46.5997301, "lng": 11.738276, "usage": "沿下方1号到此转2B；不去Pana垭口"}, {"label": "Malga Pieralongia Alm, Strada Mastle, 39047 Santa Cristina Valgardena BZ, Italy", "kind": "food", "lat": 46.5973971, "lng": 11.7477024, "usage": "山屋与石牙，短暂停留"}, {"label": "2B转13B岔口（往Firenze）", "kind": "sight", "lat": 46.5987448, "lng": 11.7567629, "usage": "认13B／Firenze向南下坡，再接13"}, {"label": "Regensburgerhütte, Ciaulongh, 17, 39047 Santa Cristina Valgardena BZ, Italy", "kind": "food", "lat": 46.5874418, "lng": 11.7582717, "usage": "13:30–14:15午餐，再沿4号回上站"}], "hotel": {"name": "Chalet Milé 2", "status": "已订"}, "intro": "09:00从Chalet开车去Col Raiser，停谷站并买往返缆车票。山上先爬升到Seceda看刀锋，退回较低的1号路绕开Pana关闭口；经Pieralongia、13B／13到Firenze午餐，沿4号路回同一山上站。目标15:00左右结束徒步，15:30–16:00回酒店，晚上19:00六人民宿自炊。", "deadline_label": "结束与返程", "walking_guide_ids": ["day6-seceda-loop"], "map_routes": [[0, 1], [1, 2], [2, 3, 4, 3, 5, 6, 7, 8, 2], [2, 1, 0]], "route_note": "自驾到Col Raiser谷站，往返缆车接山上环线；山顶观景支线短段原路返回。", "map_note": "本页连线表示点位顺序，非逐弯轨迹；徒步攻略附真实山径方向图，可点开保存。", "parking_ids": ["D5-d6-ortisei-chalet-mile-tubladel", "D6-col-raiser-valley-station"]}, {"n": 7, "id": "D7", "date": "2026-09-30", "dow": "周三", "title": "9点半出发，Puflatsch与Gostner小环线", "phase": "夫妻＋4位朋友", "theme": "高台全景 → 山顶午餐 → 草甸小环线与山屋短休｜夫妻＋4位朋友", "oneliner": "上午Puflatsch，下午Gostner小环线", "warning": "上高原前办好实际车牌的住客许可；正常17:30–18:00回店，目标18:00前。", "items": [{"time": "09:30–10:10", "title": "退房开车到Zorzi，凭住客许可上高原", "desc": "类型：驾车｜状态：计划\n导航：Berghotel Zorzi, Compatsch 15, 39040 Seiser Alm BZ\n执行：早餐、退房和装车在09:30前完成，从Chalet Milé（Via Cademia 2）开车出发，约10:10到Zorzi。\n耗时：按你当前导航的30多分钟，本表预留40分钟驾驶；停车寄存另列20分钟，出发时按实际导航顺延。\n通行：驶入高原前须已取得酒店签发、对应实际车牌的住客许可。住宿客到达日凭许可可全天开到酒店；本次计划09:30从Ortisei出发，约10:10抵达Zorzi。实际许可是否已领取尚待核对，朋友另一车按自己的订单办理。\n备选：尚未取得许可时，先按酒店确认的办法在Seis谷站停车、带行李乘缆车上山；接驳另算，不套用本表到店时间。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。"}, {"time": "10:10–10:30", "title": "停车、前台报到、寄存行李", "desc": "类型：酒店｜状态：计划\n导航：Berghotel Zorzi, Compatsch 15, 39040 Seiser Alm BZ\n执行：到店先停车、向前台报到并寄存行李，约20分钟；先去徒步，全天游览结束后再正式入住。\n预订：酒店已同意本订单早到停车寄存。正式入住14:00–19:00；早到是否另收费、朋友另一车车位仍按前台确认。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。"}, {"time": "10:30–11:10", "title": "步行到Puflatsch，乘缆车上高台", "desc": "类型：交通｜状态：现场购票\n导航：Puflatsch / Bullaccia 山脚缆车站\n执行：从Zorzi经Compatsch步行到Puflatsch／Bullaccia谷站，买往返票上山。40分钟为步行、购票和乘车的合计预算，按普通排队情况估算。\n票务：Puflatsch公布当季09:00–17:00运行；往返价格、住客优惠与实际末班在谷站确认，目前未购票。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。"}, {"time": "11:10–14:10", "title": "Puflatsch高台环线：全景、十字架与女巫石凳", "desc": "类型：徒步｜状态：计划\n导航：Engelrast 观景台\n执行：山上站→Engelrast全景台→Filln-Kreuz→Hexenbänke女巫石凳一带→Goller-Kreuz→Arnika地标→14号连接路回Puflatsch山上站。\n看点：沿高台从不同方向看高原、Val Gardena山谷和Schlern轮廓，边走边拍照。\n分岔：过Arnika后认14号路的Puflatsch山上站／Bergrestaurant方向，不沿去Compatsch的分支徒步下山。依现场开放路牌行走。\n耗时：保留3小时，含观景和短休；缆车上下，仅步行山上环线。Arnika周三休息，只作路标。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。", "walking_guide_ids": ["day7-puflatsch"]}, {"time": "14:10–15:10", "title": "Bergrestaurant Puflatsch山顶午餐", "desc": "类型：餐饮｜状态：未订位\n导航：Puflatsch 山上站与山顶餐厅\n执行：环线结束后在山上站旁餐厅午餐，预算60分钟；等位或出餐慢就顺延，随身带水和备用简餐。\n营业：旅游局公布当季每日09:00–17:00，热厨房11:30–15:30。六人座位未确认；Arnika与Rauch周三休息。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。"}, {"time": "15:10–15:40", "title": "缆车下山，走到Compatsch", "desc": "类型：交通｜状态：计划\n导航：Compatsch\n执行：乘Puflatsch缆车下山，再步行到Compatsch环线起点，下山与衔接共留30分钟。\n时间：目标15:10开始下山；索道公布17:00收班。下午Gostner小环线步行回Compatsch，不再依赖缆车。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。"}, {"time": "15:40–17:40", "title": "Gostner草甸小环线与山屋短休", "desc": "类型：徒步／短休｜状态：计划\n导航：Compatsch\n执行：按已选AllTrails「Alpe di Siusi - Compatsch - Malga Gostner」走小环线；去程走南侧，回程走北侧，途中到Gostner Schwaige喝东西、吃蛋糕或短休。\n规模：约4.0公里、累计爬升86米，Easy；采用本次选定路线的数据，不含酒店接驳与上午徒步。\n耗时：平台参考1–1.5小时；本表安排2小时，包含途中拍照和约20–30分钟山屋短休。约17:40回Compatsch，个人步速和等餐会影响实际用时。\n方向：Compatsch → 南侧步道向东 → Gostner Schwaige支线 → 回到分岔 → 北侧步道向西 → Compatsch。以AllTrails轨迹和现场开放路牌为准。\n重复路段：主体为环线，山屋前有短段原路进出，起终点接驳也可能重合；不是全程零重复。\n山屋：旅游局公布当季09:00–17:30、热厨房11:00–16:30；短休安排在约16:30前后，饮品蛋糕以现场供应为准。六人未订位，满座就省去久坐。\n时间控制：若15:45后才准备开始下午徒步，先省去或缩短山屋茶歇；16:00后才准备起步或已疲劳，就取消下午完整环线。目标17:00前离开山屋返回，18:00前回酒店；不要为表上的时刻赶路。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。", "walking_guide_ids": ["day7-gostner"]}, {"time": "17:40–17:55", "title": "步行回Zorzi，正式入住", "desc": "类型：酒店｜状态：已订\n导航：Berghotel Zorzi, Compatsch 15, 39040 Seiser Alm BZ\n执行：约17:40完成环线，留10–15分钟步行回Zorzi，取行李、正式入住。正常按17:30–18:00回店安排，目标18:00前，不把平台用时当作到店保证。\n入住：订单正式入住14:00–19:00。早上已停车寄存，回店后洗澡休息；晚餐仍按19:00左右、朋友确定方案安排。\n傍晚：休息后若还有兴致，只在酒店附近短逛看山；不安排必须完成的第二段徒步。\n停车：车辆全天留Zorzi；朋友另一车按自己的订单确认停车和许可。"}, {"time": "19:00左右", "title": "晚餐由朋友规划", "desc": "类型：餐饮｜状态：待定\n导航：Berghotel Zorzi / Compatsch\n预订：待定；当前酒店订单仅含早餐，不含晚餐\n执行：由朋友确定方案后再更新；如选择酒店四道式晚餐，须提前确认6人座位、价格和时间。\n备选：优先选择酒店内或步行可达餐厅；晚上不驾车下山。\n停车：Berghotel Zorzi 住客车道/室外停车；备选：Seiser Alm Aerial Cableway 谷站付费车库。预约和进出路线见当天停车卡。"}], "overview": [{"time": "09:30–10:10", "do": "退房开车到Zorzi，凭住客许可上高原", "loc": "Berghotel Zorzi, Compatsch 15, 39040 Seiser Alm BZ", "tip": "早餐、退房和装车在09:30前完成，从Chalet Milé（Via Cademia 2）开车出发，约10:10到Zorzi。"}, {"time": "10:10–10:30", "do": "停车、前台报到、寄存行李", "loc": "Berghotel Zorzi, Compatsch 15, 39040 Seiser Alm BZ", "tip": "到店先停车、向前台报到并寄存行李，约20分钟；先去徒步，全天游览结束后再正式入住。"}, {"time": "10:30–11:10", "do": "步行到Puflatsch，乘缆车上高台", "loc": "Puflatsch / Bullaccia 山脚缆车站", "tip": "从Zorzi经Compatsch步行到Puflatsch／Bullaccia谷站，买往返票上山。40分钟为步行、购票和乘车的合计预算，按普通排队情况估算。"}, {"time": "11:10–14:10", "do": "Puflatsch高台环线：全景、十字架与女巫石凳", "loc": "Engelrast 观景台", "tip": "山上站→Engelrast全景台→Filln-Kreuz→Hexenbänke女巫石凳一带→Goller-Kreuz→Arnika地标→14号连接路回Puflatsch山上站。"}, {"time": "14:10–15:10", "do": "Bergrestaurant Puflatsch山顶午餐", "loc": "Puflatsch 山上站与山顶餐厅", "tip": "环线结束后在山上站旁餐厅午餐，预算60分钟；等位或出餐慢就顺延，随身带水和备用简餐。"}, {"time": "15:10–15:40", "do": "缆车下山，走到Compatsch", "loc": "Compatsch", "tip": "乘Puflatsch缆车下山，再步行到Compatsch环线起点，下山与衔接共留30分钟。"}, {"time": "15:40–17:40", "do": "Gostner草甸小环线与山屋短休", "loc": "Compatsch", "tip": "按已选AllTrails「Alpe di Siusi - Compatsch - Malga Gostner」走小环线；去程走南侧，回程走北侧，途中到Gostner Schwaige喝东西、吃蛋糕或短休。"}, {"time": "17:40–17:55", "do": "步行回Zorzi，正式入住", "loc": "Berghotel Zorzi, Compatsch 15, 39040 Seiser bleway 谷站付费车库。预约和进出路线见当天停车卡。\n准备：今晚落实六人打包午餐、水和小食；如由酒店付费准备，争取07:45前领取并先获同意，否则前一晚自行备好。不要等未确认的餐食而拖过08:00。"}, {"time": "08:00–10:15", "title": "Zorzi直达Ru Curto湖线入口", "desc": "类型：驾车｜状态：主线\n导航：Parcheggio Ponte de Ru Curto, SP638, Cortina d'Ampezzo\n耗时：预算2小时15分；9/30当前地图2小时5分／83.5km\n停车：汽车留Ponte de Ru Curto入口附近合法标示车位。\n执行：08:00离开Zorzi，直接导航Ponte de Ru Curto，目标10:15到入口，10:30开始湖线。Giau留到两条徒步和缆车下山之后。"}, {"time": "10:15–10:30", "title": "Ru Curto停车整装，10:30开始湖线", "desc": "类型：停车＋整装｜状态：主线\n导航：Parcheggio Ponte de Ru Curto, SP638, Cortina d'Ampezzo\n耗时：预留15分钟，以入口附近有合法空位为前提\n停车：汽车留Ponte de Ru Curto步道入口附近的合法标示车位；费用及空位以现场为准。\n执行：按现场标示停车，带好午餐、水、小食和保暖层，10:30起步。午餐带到湖边吃，汽车留在同一入口等待往返回来。"}, {"time": "10:30–14:30", "title": "Federa湖：437接434完整往返，湖边简餐", "desc": "类型：徒步｜状态：主线\n导航：Parcheggio Ponte de Ru Curto, SP638, Cortina d'Ampezzo\n耗时：约9km／累计爬升约500m；共4小时，含25分钟湖边简餐与拍照\n停车：汽车留Ponte de Ru Curto步道入口附近的合法标示车位；费用及空位以现场为准。\n执行：10:30从Ru Curto沿437到Cason de Formin一带接434，约12:20到Federa湖与Croda da Lago山屋旁。12:20–12:45吃自带简餐、拍照，12:45沿434接437原路返回，目标14:30回车。\n衔接：10:30起步、12:45离湖、目标14:30回车。两条完整徒步优先完成，Giau安排在缆车下山后，按返程进度灵活调整停留。\n提醒：完整走到湖边并返回；不延伸435、Val Formin或Forcella Ambrizzola大环线。", "walking_guide_ids": ["day8-federa"]}, {"time": "14:30–14:55", "title": "Ru Curto→Lagazuoi山脚缆车站", "desc": "类型：驾车｜状态：主线\n导航：Funivia Lagazuoi, Passo Falzarego, Cortina d'Ampezzo\n耗时：预算25分钟；9/30当前地图样本21分钟／14.3km\n停车：汽车留Passo Falzarego的Lagazuoi山脚停车场。\n执行：湖线回车后沿SP638、SR48开往Falzarego的Funivia Lagazuoi山脚站，目标14:55到达，继续完成第二条山顶往返。"}, {"time": "14:55–15:25", "title": "Lagazuoi停车购票，乘缆车上山", "desc": "类型：缆车｜状态：主线\n导航：Funivia Lagazuoi, Passo Falzarego, Cortina d'Ampezzo\n耗时：预留30分钟，含停车、购票、候车与上山\n停车：汽车留Passo Falzarego的Lagazuoi山脚停车场。\n执行：买成人往返票，确认当天最后下行时间。经营方公布每15分钟一班；目标15:25到上站，为完整山顶往返及拍照留45分钟。\n票价：9/27核对2026价目：成人往返€29.50、官方刷卡价€28.03；六人未购票，现场以实际价目为准。", "walking_guide_ids": ["day8-lagazuoi"]}, {"time": "15:25–16:10", "title": "Lagazuoi山顶十字架完整往返", "desc": "类型：短徒步｜状态：主线\n导航：Rifugio Lagazuoi, Monte Lagazuoi, Cortina d'Ampezzo\n耗时：约1.55km往返／爬升约38m，安排45分钟含拍照\n停车 dow": "周六", "title": "09:15出发：Fusine、Jasna短走与Bled城堡", "phase": "夫妻（散团起点）", "theme": "Cortina → Tolmezzo/Tarvisio → Fusine → Rateče → Kranjska Gora快餐 → Jasna短走 → Bled城堡｜夫妻｜强度 中", "oneliner": "跳过Zelenci，Jasna缩至30分钟，保留城堡", "warning": "今天09:15出发，上午走经Tolmezzo的全意大利路线。目标14:40离开Fusine、16:30离开Jasna，18:05城堡先看露台；18:39计算日落。", "items": [{"time": "08:15–09:15", "title": "早餐、退房，与四位朋友分别", "desc": "类型：酒店｜状态：建议\n导航：Hotel Tofana Cortina\n耗时：约60分\n停车：Hotel Tofana Cortina underground garage；备选：酒店前台安排替代车位。预约和进出路线见当天停车卡。\n执行：当面核对两辆车里的行李，朋友的物品全部交还。夫妻带好接下来六晚的行李，09:15出发。"}, {"time": "09:15–13:15", "title": "Cortina→Tolmezzo/Tarvisio→Laghi di Fusine（全意大利路线）", "desc": "类型：驾车｜状态：待办\n导航：Tofana→Tolmezzo→Fusine（全意大利整段路线）\n耗时：驾驶按约4小时安排；10/3上午经Tolmezzo即时导航3小时59分、183公里，途中休息和额外堵车另计\n停车：Parcheggio Lago Superiore di Fusine（上湖南侧停车场）；备选：现场开放的下湖正规停车区。景观短折返从上湖起步，详见本日停车卡片。\n执行：点本项整段导航，已加入Tolmezzo途经点，再经Tarvisio到Fusine。出发前核对地图未出现Lienz、Austria或AT跨境提示；不要删除Tolmezzo后接受默认奥地利路线。当前计划全程留在意大利，未将奥地利加入租车跨境范围。\n到达：从 Tarvisio 往 Fusine Valromana，认“Laghi di Fusine”路牌转入 Via dei Laghi。经过下湖后继续开到上湖南侧、Ai Sette Nani 附近的正规停车场，按小汽车停车标志入场。本次从上湖开始走。\n参考：上述为上午即时样本，并非09:15专用预测或到达保证；约13:15到上湖停车区域。停车入位与步行准备在下一项。"}, {"time": "13:15–14:40", "title": "Fusine 双湖：从上湖走到下湖，再原路返回", "desc": "类型：景点｜状态：已确认\n导航：46.473431, 13.671540\n耗时：85分钟总窗口：停车约10分钟、步行约60分钟、拍照约10–15分钟\n停车：Parcheggio Lago Superiore di Fusine（上湖南侧停车场）；备选：现场开放的下湖正规停车区。景观短折返从上湖起步，详见本日停车卡片。\n执行：13:15–13:25停车整理，约13:25从上湖西侧近岸出发，沿林间连接步道走向下湖近岸，13:55左右原路折返，目标14:40回车离开。按实际步速确定折返点，不要求绕完两湖。\n路标：认 Lago Superiore（上湖）、Lago Inferiore（下湖）和湖岸步道标牌；不转入通往 Rifugio Zacchi、Alpe del Lago 或 Mangart 的上山支路。\n计时：共85分钟，含约10分钟停车准备及75分钟散步拍照。官方75分钟是步行参考，拍照多就缩短距离；13:30后才到停车区时，改上湖近岸短走，仍争取14:40离开。\n备选：上湖满位或关闭时只按现场指示停合法替代位，并按距离重新估时；更远车位、雨后路滑或晚到就缩短至近岸，不为赶时刻加快步行。\n路线来源：https://www.turismofvg.it/it/montagna365/cosa-fare/natura/i-sentieri-del-foliage/il-foliage-nel-tarvisiano?LangSetCMS=it\n地标参考：https://www.tarvisiano.org/topitineraritarvisiano/Giro-dei-Laghi-di-Fusine_tt_44039\n范围：这次不绕下湖整圈，也不走 Scicchizza 沿溪进入湖区的外围路段。", "walking_guide_ids": ["d10-fusine-short-loop"]}, {"time": "14:40–15:20", "title": "Fusine→Rateče过境→Kranjska Gora", "desc": "类型：驾车／过境\n状态：计划预算\n导航：Kranjska Gora\n耗时：驾驶、过境与镇区停车共留40分钟；边检长队另行顺延\n执行：从Fusine沿SS54往Rateče、Podkoren方向过境，继续去Kranjska Gora镇区，今天不在Zelenci停车。护照、租车合同及既有跨境许可随手可取；午餐不回Tarvisio。\n参考：40分钟为本次含过境和找位的规划预算，并非实时排队承诺。\n停车：镇区合法公共停车位现场选择，费用按标牌；餐厅及车位尚未预留。"}, {"time": "15:20–15:50", "title": "Kranjska Gora 镇上简午餐", "desc": "类型：餐饮\n状态：建议，未预约\n导航：Kranjska Gora\n耗时：快速午餐30分钟；选择无需久等、能及时出餐的餐食\n执行：在Kranjska Gora镇上快速吃饭，餐厅未选定或预约。避免长队和慢上菜；若等餐将明显超时，改外带或自备简餐。途中饿了可先吃随身点心，16:15后仍在镇上就跳过Jasna、直接去Bled。"}, {"time": "15:50–16:00", "title": "Kranjska Gora→Jasna，停车整装", "desc": "类型：驾车／停车\n状态：计划预算\n导航：Parkirišče Jasna, Jasna Lake, Kranjska Gora\n耗时：约10分钟含短途驾驶与停车；满位或更远停车需加时间\n执行：驶向Jasna正规停车区，停好后做近岸短走。目标16:00开始、16:30离开；满位或停车接近耗时就缩短停留，不为找第一排湖景车位反复绕行。\n停车：Parkirišče Jasna；满位时看Pišnica等合法公共备选，重新计入接近湖岸的步行时间。"}, {"time": "16:00–16:30", "title": "Jasna湖岸短走：铜羱羊与近岸倒影", "desc": "类型：景点｜状态：已确认\n导航：Parkirišče Jasna, Jasna Lake, Kranjska Gora\n耗时：近岸步行和拍照共30分钟；停车在上一时段另列\n停车：Parkirišče Jasna；备选：Parkirišče Pišnica。预约和进出路线见当天停车卡。\n执行：从停车处最近的入口去湖岸，看铜羱羊和山峰倒影，按余量走到两湖连接处后返回。今天不要求绕完两个湖面；目标16:30开车去Bled。\n备选：16:15后仍在Kranjska Gora镇上就直接去Bled；停车不顺、路滑或疲劳时缩为10–15分钟近岸停留或略过，优先城堡。", "walking_guide_ids": ["d10-jasna-lakeshore"]}, {"time": "16:30–17:25", "title": "Jasna→Hotel Astoria Bled", "desc": "类型：驾车｜状态：建议\n导航：Hotel Astoria Bled, Prešernova cesta 44, 4260 Bled\n耗时：留55分钟；Google Maps设10/3当地16:30出发，经A2预测35–50分钟、40.5公里\n停车：Hotel Astoria Bled hotel/garage parking；备选：P14 Vrtec Bled。预约和进出路线见当天停车卡。\n执行：进入收费高速前核对实际车牌的DARS电子通行票已生效；本次未代购或核销。目标17:25到Astoria，快速寄存或入住，17:40出发去城堡。若交通延误，以实际进度调整，不靠赶路守表。"}, {"time": "17:25–17:40", "title": "Astoria 停车寄存，能立即入住就办理", "desc": "类型：酒店｜状态：住宿已确认，快速寄存待现场安排\n导航：Hotel Astoria Bled\n耗时：约15分钟停车、寄存或快速入住；排队就先寄存，完整手续稍后办理\n停车：Hotel Astoria Bled hotel/garage parking；备选：P14 Vrtec Bled。预约和进出路线见当天停车卡。\n预订：见酒店订单＋见酒店订单；酒店已书面确认同一房间、无需二次入住\n执行：约17:25到Astoria，按前台指引停车。两晚同一房间的书面确认保持；可立即办理就入住，排队则先寄存、城堡后补办。目标17:40出发，快速 anjska Gora/Vršič入口", "loc": "Ruska cesta, Kranjska Gora", "tip": "驾车｜状态：建议"}, {"time": "09:10–10:30", "do": "翻越 Vršič 山口，有正规空位时短停", "loc": "Vršič Pass", "tip": "按现场限速和交通标志行驶，下坡用合适低挡控制车速。山口有正式空位时停车看景，满位则继续通过；不要在发卡弯或行车道停下拍照。"}, {"time": "10:30–11:30", "do": "在 Velika korita 看 Soča 峡谷", "loc": "Velika korita Soče parking, Lepena turnoff bridge, Bovec–Vršič regional road", "tip": "停 P07 正式停车区，沿开放的观景步道看峡谷和深潭。雨天留在有护栏处，不下湿滑河岸，也不另去需要攀爬拉索的 Soča 源头。"}, {"time": "11:30–12:15", "do": "Soča谷→Bovec", "loc": "Bovec", "tip": "驾车｜状态：建议"}, {"time": "12:15–13:15", "do": "Bovec午餐", "loc": "Bovec", "tip": "约13:15吃完午餐，给下午瀑布留出时间。"}, {"time": "13:15–13:30", "do": "可选：到 Mangart 寄存行李", "loc": "Hotel Mangart, Mala vas 107, Bovec", "tip": "酒店顺路且能立即接收行李时才停车，约10–15分钟后继续去 Kozjak。房间尚未准备好无须等；不能寄存就傍晚再入住。行李暂留上锁并遮好的后备厢，贵重物随身。"}, {"time": "13:30–14:05", "do": "Bovec→Kozjak Waterfall停车点", "loc": "Parkirišče Zaročišče, Kozjak Waterfall, Kobarid", "tip": "13:30为含短停的出发目标；不寄存则约13:15直接出发。按实际交通调整，不为赶表加速。"}, {"time": "14:05–16:40", "do": "Kozjak 瀑布往返，回来再看 Napoleon 桥", "loc": "Kozjak Waterfall parking", "tip": "停好车后跟“Kozjak”路牌走到瀑布，途中看 Soča 河景，再沿来路返回。回程若有时间，步行到 Napoleon 桥看10–15分钟，桥上不能停车。争取16:40回车，最迟17:10离开。"}, {"time": "16:40–17:20", "do": "Kobarid→Hotel Mangart，入住并休息", "loc": "Hotel Mangart, Mala vas 107, 5230 Bovec", "tip": "约17:20回酒店办理入住、休息。若下午游览稍晚，最迟17:10从 Kobarid 开车返回；酒店入住截止21:00。"}, {"time": "19:00", "do": "Bovec晚餐", "loc": "Bovec", "tip": "晚餐在Bovec，优先酒店内或步行、短途可达餐厅。"}], "confirm": ["固定项：当早查Promet.si；Vršič顶部自9/1开放指定车位，满位就连续穿越，不占道等位", "07:30–08:15 早餐、退房；查看Promet与Vršič实时路况（临近确认）", "09:10–10:30 Vršič Pass仅作穿越走廊，沿开放道路进入Soča谷（临近确认）", "14:05–16:40 Kozjak瀑布、Soča河景与Napoleon Bridge；目标16:40回车，17:10为延误上限；历史支线不默认加入", "Mangart提前寄存待确认；无法快速接收则直接去Kozjak，傍晚正式入住。"], "risks": ["15:00前不到Kozjak停车区就取消瀑布徒步", "触发备选：封路/降雪改Rateče→Tarvisio→Predel→Bovec，多1–1.5小时并删减停靠。", "下午先走 Kozjak 瀑布和 Napoleon 桥，提前结束且有余力才去意大利军人纪念堂。次日07:45离开 Bovec，今晚早点休息。"], "map": [{"label": "Bled", "kind": "hotel", "lat": 46.368326599999996, "lng": 14.1145798}, {"label": "Kranjska Gora", "kind": "sight", "lat": 46.485884, "lng": 13.7898423}, {"label": "Vrsic Pass", "kind": "sight", "lat": 46.432897, "lng": 13.7430709}, {"label": "Velika korita Soce", "kind": "sight", "lat": 46.3372098, "lng": 13.6459342}, {"label": "Bovec", "kind": "sight", "lat": 46.3376387, "lng": 13.5516829}, {"label": "Kozjak Waterfall", "kind": "sight", "lat": 46.261077, "lng": 13.5914114}, {"label": "Hotel Mangart, Bovec", "kind": "hotel", "lat": 46.3379592, "lng": 13.5606393}], "hotel": {"name": "Hotel Mangart", "status": "已订"}, "choices": [{"after": "Kozjak 瀑布往返，回来再看 Napoleon 桥", "label": "可选短停", "title": "意军纪念堂：教堂、石拱廊与河谷视野", "summary": "这里是一战阵亡意军纪念地与遗骨安置堂；建筑庄重，可看Kobarid及河谷。", "when": "只有瀑布、河景和桥提前完成，还能额外留出约45–60分钟含转场，并在17:10前离开Kobarid时才选；否则直接回酒店。", "details": [{"label": "时间与到达", "text": "现场规划20–30分钟，驶车/合法停车另计。官方说明可开车到达，或从镇内步行上山约15–20分钟；步行方案需加上下山时间，不能当成20分钟全包。"}, {"label": "取舍", "text": "不为纪念堂削掉Kozjak；无合法空位或时间不够就跳过。这里兼有建筑与风景，但属于军事墓园，请按现场规则安静参观。"}], "nav": [{"label": "意军纪念堂", "query": "Italian Ossuary, Church of Saint Anthony, Kobarid"}], "sources": [{"label": "Soča旅游局：纪念堂", "url": "https://www.soca-valley.com/en/in-search-of-adventure/culture/2021011921205708/italian-charnel-house/"}]}, {"after": "Kozjak 瀑布往返，回来再看 Napoleon 桥", "label": "Alternative · 历史步道", "title": "Tonocov 古聚落、战壕与较完整历史步道", "summary": "想深入历史时再选：古聚落看4—6世纪建筑地基与河谷俯瞰，防线看一战战壕、掩体等遗迹。", "when": "只有明确愿意增加坡路、台阶和历史参观，并提前重排D12才执行；当前时间线没有包含完整环线。", "details": [{"label": "时间代价", "text": "博物馆官方参考：完整历史步道约5km、3–5小时，较短历史路线约3km、2–3小时；路线本身包含部分自然点，不能再把整段时长叠加到现有瀑布往返。以所选路线重新核算总步行、停车和17:10离开目标。"}, {"label": "看点差别", "text": "Tonocov有谷景但建筑主要是低石墙；战壕多在林间，主要靠历史兴趣支撑。Kobarid博物馆通过实物、照片和影像讲述一战，入馆另占时间。"}, {"label": "切换前", "text": "出发前确认步道、桥梁开放及天气、体力。时间不足就只走瀑布和桥，不去纪念堂或完整历史步道；当天不加 Tolmin 峡谷。"}], "nav": [{"label": "Tonocov古聚落", "query": "Tonovcov grad, Kobarid"}], "sources": [{"label": "官方历史步道时长", "url": "https://kobariski-muzej.si/en/guided-tours/the-kobarid-historical-trail/"}, {"label": "古聚落介绍", "url": "https://www.soca-valley.com/en/in-search-of-adventure/culture/2021072915484024/tonovcov-grad-hill/"}]}], "intro": "从 Bled 翻过 Vršič 山口，沿 Soča 河谷开到 Bovec，上午看山路、峡谷和翠绿河水。午餐后去 Kozjak 瀑布，原路返回，再看看 Napoleon 桥，傍晚回 Bovec 入住。酒店若能立即寄存行李，可在午餐后顺路停一会儿；不方便就游览后再来。山口关闭时提前绕行，下午太晚则取消瀑布。", "walking_note": "单段攻略对应所在时段；完整路线总览列明覆盖的时段，含午餐时按顺序分段执行。替换方案会改变对应主线，不是追加活动。", "landmark_notes": {"ChIJ3ShdfYBbekcRItGuDoF3Rxg": "可选历史参观，不在瀑布往返主线中；须另留时间。"}, "parking_ids": ["D10-D11-hotel-astoria", "D12-vrsic-pass", "D12-velika-korita", "D12-hotel-mangart", "D12-kozjak"]}, {"n": 13, "id": "D13", "date": "2026-10-06", "dow": "周二", "title": "上午探访 Škocjan 洞穴，下午去 Piran 看海", "phase": "夫妻", "theme": "Bovec → Škocjan → Grand Hotel Bernardin → Piran｜夫妻｜驾车约3–3.5小时｜强度中高（10月EXIT 1约3公里、500–800级台阶）", "oneliner": "上午探访 Škocjan 洞穴，下午去 Piran 看海", "warning": "07:45离开Bovec；10:30前报到、目标11:00场（待订）；午餐后约13:45离开洞穴。", "items": [{"time": "07:00–07:45", "title": "酒店早餐、退房，07:45出发", "desc": "类型：酒店｜状态：弹性\n导航：Hotel Mangart, Bovec\n耗时：早餐、收拾与退房合计留45分钟\n预订：原订单含2份早餐；供应开始时间按酒店当天安排，尚未单独确认。\n执行：07:00左右开始早餐和退房，07:45离店。若酒店尚未开餐，就用事先准备的食物或酒店可提供的早餐盒。\n停车：Hotel Mangart住客停车；备选：P01公共停车。"}, {"time": "07:45–10:15", "title": "Hotel Mangart→Škocjan Caves游客中心", "desc": "类型：驾车｜状态：建议\n导航：Park Škocjanske jame Information Centre, Matavun 12, 6215 Divača\n耗时：驾驶预留2.5小时；10/5查询的10/6 08:00出发预测为2–2.5小时，07:45出发为停车报到留余量。\n停车：Park's Information Centre parking area；备选：满位时按工作人员指引，否则跳过导览。\n执行：07:45离开Bovec，驾驶预留2.5小时，目标10:15到Matavun 12游客中心停车、10:30前完成报到。11:00为待订目标，以最终票面为准。 地图查询时优先经E70及意大利段，避开H4封闭；出发时复查导航、交通和跨境等候，不靠赶路守表。"}, {"time": "10:15–11:00", "title": "游客中心停车、报到与洞穴准备", "desc": "类型：报到｜状态：待订\n导航：Park Škocjanske jame Visitor Centre\n耗时：约45分钟，含停车、报到、洗手间及候场；10:30前到信息台报到。\n停车：车留Park's Information Centre parking area。\n预订：目标11:00场，当前仍待订；官网要求至少提前30分钟到信息台，以最终票面为准。\n执行：约10:15停车，10:30前完成报到；换好防滑鞋、带薄外套和饮水，再按工作人员指引候场。"}, {"time": "11:00–13:15", "title": "Škocjan 洞穴导览，从1号出口返回", "desc": "类型：景点｜状态：待订\n导航：Škocjan Caves\n耗时：官方导览约90–120分钟；11:00–13:15为导览、EXIT 1返回游客中心及缓冲的合计预算，不另加一段返程。10月路线约3公里、500–800级台阶。\n停车：车留Park's Information Centre parking area。\n预订：目标10月6日11:00场，尚未确认余票或购票；官网十月列10:00–15:00每小时一场，实际可售以购票页为准。\n执行：跟导游参观静默洞、地下河峡谷与洞内大桥；洞内约12°C、禁止拍照，不自行脱队。十月从Velika dolina的EXIT 1按指引回游客中心，预计13:15前后回车。\n备选：11:00无票或导览取消时，先按实际场次重新核对下午衔接；无合适场次则提前去Piran，不临时加另一处溶洞。", "walking_guide_ids": ["d13-skocjan-exit1"]}, {"time": "13:15–13:45", "title": "游客中心快速简餐/随身简餐，随后离开", "desc": "类型：餐饮｜状态：建议\n导航：Škocjan\n耗时：约30分钟\n执行：约13:15结束后在游客中心用随身简餐或快速出餐，目标13:45上车离开；若提前结束即可提前午餐和去海边。\n停车：车留Park's Information Centre parking area；午餐后约13:45离开。"}, {"time": "13:45–14:45", "title": "Škocjan→Grand Hotel Bernardin", "desc": "类型：驾车｜状态：建议\n导航：Grand Hotel Bernardin, Obala 2, 6320 Portorož\n耗时：预留45–60分钟；10/5地图即时样本经A1为41分钟、49公里，不是次日交通保证。\n停车：Grand Hotel Bernardin outdoor parking；备选：PH Amfora。\n执行：13:45左右离开洞穴区域，预计14:30–14:45到Bernardin；主表按14:45到店安排，先停车卸行李，再去Piran。"}, {"time": "14:45–15:00", "title": "Bernardin停车寄存，随后去Piran", "desc": "类型：酒店｜状态：住宿已订，官网提供寄存\n导航：Grand Hotel Bernardin, Obala 2, Portorož\n停车：Grand Hotel Bernardin outdoor parking；备选：PH Amfora。\n预订：正式入住时间15:00起\n执行：约14:45到店，按前台指引停车、卸行李；能快速办理就先入住，否则寄存后约15:00去Piran，不为等房压缩海边时间。车整晚留酒店，下午未办入住则晚餐后补办。\n耗时：停车寄存计划留15分钟；前台繁忙则顺延进城。"}, {"time": "15:00–15:30", "title": "Grand Hotel Bernardin→Piran老城", "desc": "类型：步行/短途交通｜状态：建议\n导航：Tartini Square Piran\n耗时：步行约25–30分钟；出租车或公交按实际候车调整。\n停车：车留Grand Hotel Bernardin。\n执行：约15:00从酒店沿海滨去Piran，15:30前后到Tartini广场；洞穴后腿累就用短途车替代步行。"}, {"time": "15:30–18:50", "title": "Piran老城街巷、海边散步与日落", "desc": "类型：景点｜状态：建议\n导航：Tartini Square Piran\n耗时：约3小时20分钟弹性老城与海边时间，含咖啡休息及日落；不要求持续步行。\n停车：车留Grand Hotel Bernardin。\n执行：从 Tartini 广场和附近老巷开始，再到 St George 教堂周边看海。傍晚按体力选城墙或海滨等日落，18:15前到选好的位置。其间可以坐下来喝咖啡，城墙关闭就留在海边。\n备选：洞穴走累了，就省掉街巷大圈和城墙上坡，只逛广场、教堂外广场和海滨。往返酒店可改乘出租车。\n日落：10月6日 Piran 港日落参考约18:36（当地时间），能否看到取决于天气。18:15前到选好的位置，日落后稍停一会儿，19:15吃晚餐。"}, {"time": "19:15", "title": "Piran海鲜晚餐，餐后返回酒店", "desc": "类型：餐饮｜状态：待定\n导航：Piran\n耗时：约90分\n预订：Pavel 2/其他海鲜餐厅待选；朋友不同行\n执行：餐后沿海步行或短途出租车返回Bernardin，目标21:15左右到店；若尚未办理入住，23:00前完成。汽车一直留酒店。\n停车：车留Grand Hotel Bernardin；步行或短途交 :30–17:30", "title": "三桥、市场与老城，乘缆车上城堡", "desc": "类型：景点｜状态：建议\n导航：Ljubljana Castle Funicular\n耗时：约4小时弹性城市漫游，含接驳与休息\n停车：Hotel CUBO valet drop-off；备选：Kongresni trg underground car park。预约和进出路线见当天停车卡。\n预订：城堡缆车联票可线上买；非强制\n执行：从 Prešeren 广场和三桥走向中央市场、龙桥，再到 Krekov trg 广场乘城堡缆车。游览后沿市政厅广场、Stari trg 老街和鞋匠桥回酒店；具体步行顺序见下方攻略。\n备选：雨天增加城堡室内，缩短河边步行。", "walking_guide_ids": ["day14-ljubljana"]}, {"time": "17:30–17:50", "title": "返回Hotel CUBO正式入住", "desc": "类型：酒店｜状态：已确认\n导航：Hotel CUBO, Slovenska cesta 15, Ljubljana\n耗时：约20分计划预留；中午已办理则直接回房休息\n停车：Hotel CUBO valet drop-off；备选：Kongresni trg underground car park。预约和进出路线见当天停车卡。\n预订：Double room，2成人，含早餐；官网直订见酒店订单\n执行：再次确认次日08:15取车；安静、高楼层、远离电梯和主路、一张双人床等偏好已由酒店备注，但均视当天房态。"}, {"time": "19:00", "title": "Ljubljana告别晚餐", "desc": "类型：餐饮｜状态：待订\n导航：Ljubljana\n耗时：约2–2.5小时\n预订：Strelec候选：若选需提前预约；否则让酒店订步行可达餐厅\n执行：第二天长途返米兰，套餐结束时间不要晚于22:00。\n停车：Hotel CUBO valet drop-off；备选：Kongresni trg underground car park。预约和进出路线见当天停车卡。"}], "overview": [{"time": "07:30–08:30", "do": "Grand Hotel Bernardin海滨晨走", "loc": "Grand Hotel Bernardin, Obala 2, Portorož", "tip": "想早起时在酒店附近海滨慢走，10–40分钟即可；下雨、风大或想多睡就取消，不必再走去 Piran 老城。"}, {"time": "08:30–10:30", "do": "早餐、退房取车", "loc": "Grand Hotel Bernardin, Obala 2, Portorož", "tip": "11:00前退房；若订单餐食并非早餐，则在酒店或途中自行解决。"}, {"time": "10:30–12:00", "do": "Grand Hotel Bernardin→Hotel CUBO", "loc": "Hotel CUBO, Slovenska cesta 15, 1000 Ljubljana", "tip": "直接开到 Hotel CUBO 门前的代客泊车交车点，把钥匙交给工作人员。不要驶入老城步行区；酒店暂时无法接车时，按备选去 Kongresni trg 地下车库。"}, {"time": "12:00–12:20", "do": "Hotel CUBO交车、寄存行李", "loc": "Hotel CUBO, Slovenska cesta 15, 1000 Ljubljana", "tip": "把车和行李交给酒店，核对代客泊车费€22.90/晚，约好第二天08:15取车，随后去午餐。房间15:00才开放时无须等待；中午已办好入住手续，傍晚直接取房卡或回房即可。"}, {"time": "12:30–13:30", "do": "中央市场/老城午餐", "loc": "Ljubljana Central Market", "tip": "餐饮｜状态：建议"}, {"time": "13:30–17:30", "do": "三桥、市场与老城，乘缆车上城堡", "loc": "Ljubljana Castle Funicular", "tip": "从 Prešeren 广场和三桥走向中央市场、龙桥，再到 Krekov trg 广场乘城堡缆车。游览后沿市政厅广场、Stari trg 老街和鞋匠桥回酒店；具体步行顺序见下方攻略。"}, {"time": "17:30–17:50", "do": "返回Hotel CUBO正式入住", "loc": "Hotel CUBO, Slovenska cesta 15, Ljubljana", "tip": "再次确认次日08:15取车；安静、高楼层、远离电梯和主路、一张双人床等偏好已由酒店备注，但均视当天房态。"}, {"time": "19:00", "do": "Ljubljana告别晚餐", "loc": "Ljubljana", "tip": "第二天长途返米兰，套餐结束时间不要晚于22:00。"}], "confirm": ["固定项：Hotel CUBO车库代客泊车€22.90/晚", "08:30–10:30 早餐、退房取车（待确认）", "19:00 Ljubljana告别晚餐（待订）"], "risks": ["10:30从Grand Hotel Bernardin出发，保证下午完整游城", "触发备选：下雨以中央市场、教堂、城堡和河畔室内餐饮为主。"], "map": [{"label": "Grand Hotel Bernardin", "kind": "hotel", "lat": 45.5169439, "lng": 13.569768499999999}, {"label": "Ljubljana", "kind": "sight", "lat": 46.056946499999995, "lng": 14.505751499999999}, {"label": "Hotel CUBO", "kind": "hotel", "lat": 46.049138, "lng": 14.501985}], "hotel": {"name": "Hotel CUBO", "status": "已确认"}, "intro": "早餐后退房，10:30从海边开往 Ljubljana。中午把车和行李交给 CUBO，随后吃午餐、步行逛老城，看广场、三桥、中央市场和河景，再乘缆车上城堡。傍晚回酒店，晚上在市内吃告别晚餐。", "walking_note": "单段攻略对应所在时段；完整路线总览列明覆盖的时段，含午餐时按顺序分段执行。替换方案会改变对应主线，不是追加活动。", "parking_ids": ["d13-d14-grand-hotel-bernardin", "d14-d15-hotel-cubo-valet"]}, {"n": 15, "id": "D15", "date": "2026-10-08", "dow": "周四", "title": "08:30出发，经维罗纳游览后到贝加莫", "phase": "夫妻", "theme": "Ljubljana → Verona → Bergamo｜夫妻｜长途驾驶＋两城短线步行", "oneliner": "维罗纳短环，贝加莫教堂与城墙", "warning": "14:00前离开维罗纳；晚到先缩维罗纳，保留贝加莫下午与翌日上午。", "items": [{"time": "07:30–08:30", "title": "Hotel CUBO早餐、退房、取车", "desc": "类型：酒店｜状态：已确认\n导航：Hotel CUBO, Slovenska cesta 15, Ljubljana\n耗时：早餐、退房、取车合计60分钟\n停车：Hotel CUBO valet drop-off；备选：Kongresni trg underground car park。预约和进出路线见当天停车卡。\n预订：早餐已含；最晚退房12:00\n执行：07:30早餐，08:15前请前台把车送到门口，08:30离开。出发前确认A1／E70／A4实时路线、油量与边境情况。\n注意：准备水和简餐；中途安排一次15–20分钟服务区休息，午餐用随身或快速外带食物。"}, {"time": "08:30–12:15", "title": "Ljubljana→维罗纳Cittadella停车场（含途中休息）", "desc": "类型：驾车｜状态：建议\n导航：Parking Piazza Cittadella, Piazza Cittadella 5/A, 37122 Verona VR, Italy\n耗时：主表预算3小时45分，含15–20分钟休息；10/7地图设10/8 08:30出发，约350公里，纯驾驶预测3小时20分–4小时50分，12:15到达不是保证。\n停车：首选Cittadella地下停车场；满位改Parcheggio Centro，增加步行后缩短游览。\n执行：08:30出发，经当时导航选择的A1／E70与意大利A4方向行驶。约10:15–10:30在正规高速服务区休息15–20分钟，上洗手间、买简餐；累了随时加休息。\n备选：12:30仍未停好车，缩为Piazza Bra＋Arena；13:00才到，只看Arena外观和Bra广场30–45分钟。13:15仍未抵达维罗纳，或导航显示继续停留将明显晚于16:15到贝加莫，就取消进城游览、服务区休息后直去贝加莫。14:00是最晚离城时间；下午路况变差时更早走。"}, {"time": "12:15–12:35", "title": "维罗纳停车、简午餐，步行到Piazza Bra", "desc": "类型：停车／午餐｜状态：建议\n导航：Parking Piazza Cittadella, Piazza Cittadella 5/A, 37122 Verona VR, Italy\n耗时：约20分钟，含停车、快速简餐与到Bra广场的步行；随身简餐最省时。\n停车：Piazza Cittadella 5/A；24小时，限高2.15米。官方2小时€7.50、3小时€11.50，以入口计费为准。\n执行：停好锁车，行李留后备厢且不露在外；经Corso Porta Nuova步行至Piazza Bra，先看Arena外圈与广场。吃准备好的简餐，不等需要久坐排队的午餐。"}, {"time": "12:35–13:05", "title": "Arena竞技场快速参观", "desc": "类型：景点｜状态：待现场决定\n导航：Arena di Verona, Piazza Bra 1, Verona\n耗时：约30分钟看重点；排队及安检会占用这段预算。\n预订：10月8日官方列09:00–15:00，最后入场14:30；演出搭台期部分区域受限。尚未核实实时余票、未购票；从官方景点页进入售票。\n执行：看罗马椭圆看台、场地与残存外圈高墙；13:05前离开，接Via Mazzini步行街。\n备选：入场队伍明显超过10分钟、开放受限影响参观或不想赶，就看外观，把时间给后面的两座广场。"}, {"time": "13:05–14:00", "title": "Via Mazzini→百草广场→领主广场→回车离城", "desc": "类型：步行｜状态：建议\n导航：d15-verona-out\n耗时：55分钟；整条停车场往返环线地图约2.6公里、纯步行35分钟，不含竞技场内部。\n路线：13:05沿Via Mazzini到Piazza delle Erbe；13:20经Arco della Costa到Piazza dei Signori；13:35开始经Via Cappello、Via Leoni／Leoncino回车，13:55付费准备、14:00前离开。\n执行：百草广场看Mazzanti彩绘立面、Maffei宫与Lamberti塔外观；领主广场看Dante像和相邻宫殿。朱丽叶故居不列入内，塔楼也不上，保持环线完整。\n备选：12:30仍未停好车，缩为Piazza Bra＋Arena；13:00才到，只看Arena外观和Bra广场30–45分钟。13:15仍未抵达维罗纳，或导航显示继续停留将明显晚于16:15到贝加莫，就取消进城游览、服务区休息后直去贝加莫。14:00是最晚离城时间；下午路况变差时更早走。"}, {"time": "14:00–16:00", "title": "维罗纳→贝加莫上城", "desc": "类型：驾车｜状态：建议\n导航：Garage San Pancrazio, Via San Pancrazio 9, 24129 Bergamo BG, Italy\n耗时：主表预算2小时；10/7地图设10/8 14:00出发，A4约118公里，预测1小时20分–2小时10分。\n停车：Garage San Pancrazio，酒店已确认预留；备选Parcheggio Città Alta。入住时把车牌交前台登记，细节见当天停车卡。\n执行：14:00是最晚离开维罗纳的时间，若提前结束就提前走。目标约16:00到贝加莫；临近上城切到酒店确认的卸行李路线，遵循现场标志，不把地图捷径当通行许可。\n备选：预测晚于16:15抵达时，在维罗纳就提前收尾；途中仍有明显延误则到店后直去教堂，办理中能寄存先寄存。"}, {"time": "16:00–16:30", "title": "Hotel Piazza Vecchia卸行李、车牌登记与入住", "desc": "类型：酒店｜状态：已确认\n导航：Hotel Piazza Vecchia, Via Bartolomeo Colleoni 3, Bergamo\n耗时：卸行李、入库与入住约30分钟；交通或前台繁忙会顺延\n停车：Garage San Pancrazio，酒店已确认预留；备选Parcheggio Città Alta。入住时把车牌交前台登记，细节见当天停车卡。\n预订：去哪儿订单见酒店订单；经典双人床房；已付RMB 977.08；城市税金额到店核对\n执行：按酒店官网到店路线及现场标志抵达，先卸行李、向前台交车牌，再去约200米外的San Pancrazio车库，入口报住客姓名。办妥后步行回店，16:30前后去教堂广场。\n注意：车牌登记尚待入住时实际办理。城市税：10月4日平台确认函列€8，7月29日酒店回信列2人共€10，到店核对；原住宿与早餐订单保留。"}, {"time": "16:30–17:30", "title": "Santa Maria Maggiore圣母大殿＋Colleoni礼拜堂", "desc": "类型：景点｜状态：建议\n导航：Piazza Duomo, Bergamo\n耗时：约60分钟；两处紧邻，先圣母大殿约35分钟，再礼拜堂约20分钟。\n停车：Garage San Pancrazio，酒店已确认预留；备选Parcheggio Città Alta。入住时把车牌交前台登记，细节见当天停车卡。\n预订：10月官方：圣母大殿周一至六09:00–18:00，成人€5；Colleoni礼拜堂09:00–12:30及14:00–18:00，免费／自愿捐赠，禁止拍照。以现场礼拜与临时安排为准。\n执行：从酒店经Piazza Vecchia穿过Palazzo della Ragione下方到Piazza Duomo。先看圣母大殿的室内装饰与木作，再看Colleoni的彩色大理石外立面及陵墓；17:30前完成核心两处。\n备选：若到店明显晚于17:00，先寄存直去教堂，能进哪处先看哪处；未完成部分翌日09:00补看，替换Rocca第一段。"}, {"time": "17:30–17:45", "title": "贝加莫主教座堂与教堂广场", "desc": "类型：景点｜状态：建议\n导航：Cattedrale di Sant’Alessandro, Piazza Duomo, Bergamo\n耗时：约15分钟，衔接相邻建筑\n执行：在同一广场看主教座堂；周四官方下午开放15:00–18:30，若有礼拜就看外观。随后向Via Gombito走。"}, {"time": "17:45–19:15", "title": "Porta San Giacomo→南城墙→Piazza Vecchia", "desc": "类型：城市步行｜状态：建议\n导航：Porta San Giacomo, Bergamo\n耗时：约90分钟，含拍照、观景和回到广场；不绕完整城墙。\n停车：Garage San Pancrazio，酒店已确认预留；备选Parcheggio Città Alta。入住时把车牌交前台登记，细节见当天停车卡。\n执行：Piazza Vecchia→Via Gombito→Piazza Mercato delle Scarpe→Via San Giacomo→白色城门；在南侧城墙观景步道短走，再沿已照明老街回Piazza Vecchia看夜景。19:15回酒店稍作整理。\n备选：下雨时保留白色城门及最近观景段，路滑或雷雨就回广场和室内，不以日落晴空为承诺。"}, {"time": "19:30", "title": "La Tana品尝菜单晚餐（建议，未订）", "desc": "类型：餐饮｜状态：待订\n导航：La Tana, Via San Lorenzo 25, 24129 Bergamo BG, Italy\n耗时：约90–120分\n停车：Garage San Pancrazio，酒店已确认预留；备选Parcheggio Città Alta。入住时把车牌交前台登记，细节见当天停车卡。\n预订：La Tana建议19:30、2人，尚未订位。官网两套品尝菜单€50/人、至少2人，含水和咖啡，葡萄酒另计；建议创意海鲜线Tentacolare，以当日菜单为准。\n执行：从酒店步行约5分钟／350米到Via San Lorenzo 25，回程上坡。晚餐后回酒店整理行李；若改选La Cucina del Relais San Vigilio，另留20–30分钟缆车加步行，需先确认座位。"}], "overview": [{"time": "07:30–08:30", "do": "Hotel CUBO早餐、退房、取车", "loc": "Hotel CUBO, Slovenska cesta 15, Ljubljana", "tip": ""}, {"time": "08:30–12:15", "do": "Ljubljana→维罗纳Cittadella停车场（含途中休息）", "loc": "Par egina Mundi"}, {"time": "15:00–15:16", "title": "Regina Mundi观景与候车"}, {"time": "15:16–15:37", "title": "免费接驳：Regina Mundi→Riva Autostazione"}, {"time": "15:37–16:00", "title": "步行回Monte Oro取车"}]}}, {"id": "day3-limone", "day": "D3", "title": "Limone：入住、港口和老巷", "category": "城市步行", "verdict": "可选短骑结束后先办理入住，再在港口和老街散步。当天若晚到或取消骑行，直接入住后逛老城；短骑不保证到达或骑完整条悬空道，不再追加远距离步行。", "fit": "当天已经徒步和骑行，散步留30–60分钟，累了可以缩至15–20分钟。酒店入住手续须在20:00前办好，建议19:30前到前台。", "route": ["车行还车／Lungolago", "Piazza Garibaldi", "Porto Vecchio", "Via Nova", "Chiesa di San Rocco外观", "沿老巷回Piazza Garibaldi与酒店"], "stats": [{"label": "距离", "value": "约1–1.5公里，依还车地点和折返点估算。"}, {"label": "路面", "value": "港边平路为主，San Rocco 教堂前有短坡和石阶。"}, {"label": "预计用时", "value": "含拍照30–60分钟；累了只在港边走15–20分钟。"}], "access": "骑行时先在18:30–18:45还车，再回Garni；不骑则抵达后先入住。19:30前到前台，汽车全晚留原公共车库。", "steps": [{"title": "港边", "text": "从湖滨进入Piazza Garibaldi与Porto Vecchio，沿岸看彩色立面和船只，选择不妨碍通行的位置停留。"}, {"title": "上老巷", "text": "沿Via Nova按San Rocco标识上行看小教堂外观和湖景；累了直接在港边折返。"}, {"title": "回程", "text": "走已照明老巷回广场；不为追日落再向悬空骑行道走。"}], "highlights": ["Porto Vecchio倒影", "San Rocco外观与小台阶", "傍晚湖滨立面"], "turn_back": "需要补办入住时19:30前到前台，20:00前完成；San Rocco为最远点，天暗直接回酒店。", "hazards": ["老巷阶梯窄、湿石板滑", "不要把自行车归还时间压缩给摄影"], "alternatives": [{"title": "腿累或下雨", "text": "只走Garibaldi—Porto Vecchio往返，找开放咖啡馆坐下。"}], "navigation": [{"label": "步行起点 · Garibaldi广场", "query": "Piazza Garibaldi, 25010 Limone Sul Garda BS, Italy"}, {"label": "返程酒店 · Gianmartin", "query": "Garni Gianmartin, Piazza Giuseppe Garibaldi, 25010 Limone Sul Garda BS, Italy"}], "sources": [{"label": "Limone官方老城导览", "url": "https://www.visitlimonesulgarda.com/en/weekly-program-guided-tour-of-the-historical-centre?re-product-id=256651"}, {"label": "Limone官方城市线路图", "url": "https://www.visitlimonesulgarda.com/images/pdf/limone-guide.pdf"}], "checked": "2026-09-16", "glance": "约1–1.5km · 30–60分钟", "scope": {"kind": "segment", "items": ["Limone老城暮色；补办入住（如需要）"], "note": "", "timeline": [{"time": "18:45–19:45", "title": "Limone老城暮色；补办入住（如需要）"}]}}, {"id": "day4-pradel-croz", "day": "D4", "title": "Pradel—Montanara—Croz：步行上山，340返回", "category": "山地徒步", "verdict": "只坐第一段缆车，步行经Malga Tovre到Montanara看群山全景并午餐，再沿340bis接340到Croz山屋，最后沿340回Pradel。去回程部分不同；340bis交会处至Croz的山屋支线仍会重复。", "fit": "适合能完成约3小时山地步行、接受临崖路段的六人同行。三段行程共留205分钟，含途中机动；Croz另停20分钟，徒步游览合计约3小时45分钟。午餐另留60分钟，缆车及排队另计；提前走完就继续，不必等到表上时刻。", "route": ["Molveno谷站：第一段缆车到Pradel", "Pradel步行经Malga Tovre", "La Montanara观景、午餐", "340bis／340B（Sentiero delle Grotte）", "与340交会，朝Croz山屋方向", "Rifugio Croz dell’Altissimo山屋", "340返回同一交会处，继续340往Pradel", "Pradel第一段缆车下山"], "stats": [{"label": "步行全程", "value": "官方完整步行路线约7.5公里；起终点都是Pradel，含步行上Montanara。"}, {"label": "累计升降", "value": "官方轨迹累计上升、下降各约451米；包含途中起伏。"}, {"label": "用时口径", "value": "官方整线步行参考约3小时；行程三段共留205分钟（含途中机动），Croz另停20分钟，徒步游览约3小时45分钟。午餐60分钟和缆车另计。"}, {"label": "主线时段", "value": "11:35开始步行，12:20–13:20午餐，目标16:20回Pradel；最迟17:15到上站排队，公布17:45收班。"}], "access": "车停Molveno–Pradel谷站日间停车，买第一段往返票，乘车约6分钟。成人普通往返€18，有效Guest Card票€16；先确认步道开放和末班。Montanara由Pradel步行到达，山屋地图点仅用于定位，具体走向看SAT路牌和离线步道图。", "steps": [{"title": "11:05–11:35停车、购票并上第一段缆车", "text": "向售票处确认340bis／340B和340当天可通行，拍下末班时刻。可出示：I sentieri 340B e 340 per il Rifugio Croz dell’Altissimo sono aperti e percorribili oggi? A che ora è l’ultima discesa della cabinovia?（两条步道今天开放且可通行吗？回Molveno末班几点？）约11:35到Pradel，先认清回程站。 30分钟预算以谷站附近停车、无长队为前提；若改停Lido，接驳时间另加。"}, {"title": "11:35–12:20经Malga Tovre步行上Montanara", "text": "按Malga Tovre／La Montanara步行路牌上草坡，约45分钟到山屋全景露台；不乘第二段椅缆。Malga Tovre已停季，仅经过。"}, {"title": "12:20–13:20 Montanara午餐", "text": "在Rifugio La Montanara吃午餐，看Brenta群峰全景。为六人就座、点餐、用餐和结账共留60分钟，目标13:20继续；实际等餐时间未确认。旅游局2026季末公告列营业至10/18、周二休；9/27为周日，具体厨房供应现场确认。带备用简餐应对无位或排队；13:45仍未出发则取消Croz段，经Malga Tovre返回Pradel。"}, {"title": "13:20–14:40沿340bis接340到Croz", "text": "从Montanara北侧小空地选Sentiero delle Grotte／340B（也称340bis），不跟352B往Palon di Tovre。SAT官方说明：340B约30分钟下降到Seghe del Mulon，交会处向右沿340往Croz，参考再约30分钟；这两段步行参考合计约60分钟，另留20分钟用于等队和途中短停，合计80分钟。沿岩壁旁步道和短隧道抵达山屋，注意窄路、落石和现场路牌。"}, {"title": "14:40–15:00山屋前短休", "text": "欣赏巨大岩壁，喝水、吃零食后返程；到Croz即止，不继续Selvata。"}, {"title": "15:00–16:20沿340回Pradel", "text": "先返回同一340bis岔路，再继续340往Pradel；不要重新上Montanara。岔路到Croz这一支线往返重复，整条不是完全无折返的环线。 山屋官网列反方向Pradel至Croz约1小时；返程据此参考约1小时，另留20分钟途中机动，合计80分钟，并非官网实测返程时长。"}, {"title": "16:20–16:50缆车下山并取车", "text": "目标16:20回上站，最迟17:15到站排队；公布17:45收班，以现场为准。约17:00入住酒店，19:30半食宿晚餐。"}], "highlights": ["Pradel到Montanara草坡上逐渐展开的群山视野", "Montanara露台正对Brenta群峰", "340bis林间与岩壁边步道、340短隧道", "Croz山屋前的巨大岩壁与山谷景观"], "turn_back": "13:45仍未从Montanara出发时取消Croz段，经Malga Tovre返回Pradel。14:45仍未接近Croz山屋且已到340主路时，沿340往Pradel回；到Croz后最迟15:15返程。17:15前回上站排队。封路、冰雪、雷雨或无法适应临崖段时停止进入并按现场指引缩短。", "hazards": ["340bis与340都有临崖、湿岩、碎石和落石风险，部分保护设施不覆盖整段。", "穿抓地力好的徒步鞋，带防雨保暖层、水、备用简餐；六人保持照应，窄路让行。", "返程认Pradel／340；通向Selvata、Pedrotti、山顶或谷底的岔路不属于本次主线。", "官方路线资料不能代替当天通行确认；上山前核对路牌、售票处或山屋的当前说明。"], "alternatives": [{"title": "怕高、路滑、晚到或340bis关闭", "text": "在Pradel—Malga Tovre—Montanara之间短走后按来路返回，午餐按实际供应；步行往返约1–1.5小时为预算，取消Croz段。天气恶劣留湖边或酒店。"}, {"title": "仅340bis关闭，340确认开放且全员能接受临崖路", "text": "可在上山前改为Pradel沿340往返Croz，纯走约2–3小时；午餐改Pradel上站附近Del Brenta或自带简餐。不把这条也有临崖段的路线作为怕高备选。"}, {"title": "本次不延伸Selvata或步行下Molveno", "text": "Selvata方向有近期断桥、涉水的实走报告，尚未核实恢复通行；按到Croz即返安排。回Pradel坐缆车下山，保留下午酒店休息。"}], "navigation": [{"label": "第一段缆车谷站", "query": "Funivie Molveno–Pradel, Via Nazionale 63, 38018 Molveno TN"}, {"label": "步行目的地与午餐 · Montanara", "query": "Rifugio La Montanara, Località Tovre Altopiano di Pradel, Molveno"}, {"label": "步行折返点 · Croz山屋", "query": "Croz of the Altissimo - Lodge, Valle delle Seghe, 38018 Molveno TN, Italy"}, {"label": "第一段缆车上站 · 往Molveno下行", "query": "Pradel第一段缆车上站（往Molveno下行）"}], "sources": [{"label": "旅游局：完整步行路线7.5km、3h、升降451m", "url": "https://www.outdooractive.com/en/route/mountain-hike/altopiano-della-paganella/trekking-in-pradel-malga-tovre-rifugio-la-montanara-and-rifugio-croz/17453367/"}, {"label": "旅游局：Pradel步行上Montanara约45分钟", "url": "https://www.outdooractive.com/en/route/hiking-trail/altopiano-della-paganella/pradel-rifugio-la-montanara/ /lago-federa-via-pian-del-pantan"}, {"label": "Cortina旅游局：437接434步行入口", "url": "https://cortina.dolomiti.org/it/arrampicata-sportiva/croda-da-lago/"}, {"label": "Croda da Lago山屋：Ru Curto入口", "url": "https://www.crodadalago.it/en/faq/"}, {"label": "山屋官网：Ru Curto走437接434", "url": "https://www.crodadalago.it/en/how-to-get-to-croda-da-lago/"}], "checked": "2026-09-30", "glance": "完整往返约9km／爬升500m · 4小时含25分钟简餐", "scope": {"kind": "segment", "items": ["Federa湖：437接434完整往返，湖边简餐"], "timeline": [{"time": "10:30–14:30", "title": "Federa湖：437接434完整往返，湖边简餐"}], "note": "10:30–14:30覆盖完整湖线、25分钟午餐及拍照；之后转场Lagazuoi，Giau放在两条徒步之后。"}}, {"id": "day9-trecime", "day": "D9", "title": "三峰双湖环线：101到Locatelli与Piani双湖，105经Langalm返回", "category": "徒步", "verdict": "完成Cadini后短休，目标10:00从Auronzo开始三峰双湖版。101经Lavaredo山口到Locatelli，午餐后去Piani双湖短往返，回到Locatelli再走105经Langalm返回；10:00–16:00共留6小时，含拍照、休息、45分钟双湖与30分钟自带午餐。", "fit": "虽然官方标为容易，但全程是海拔2,169–2,451米的高山碎石路，有持续起伏。适合愿意连续走几个小时、能稳稳走过碎石路的同行者。", "route": ["Auronzo → CAI 101 → Lavaredo山屋 → Forcella Lavaredo → Locatelli山屋", "Locatelli后方 → CAI 101往Pian di Cengia方向 → Laghi dei Piani双湖观景与安全湖岸短走 → 原路回Locatelli", "Locatelli → CAI 105 → Langalm及其小湖 → Forcella Col di Mezzo → Auronzo"], "stats": [{"label": "官方环线参考", "value": "原101/105基础环线官方参考8.8公里、4小时、升降各550米；本次另含Locatelli与Piani双湖短往返。"}, {"label": "本次预计", "value": "双湖版规划估计约10–12公里，取决于湖岸步行范围；合计留6小时含约45分钟双湖、30分钟午餐和六人拍照休息。"}, {"label": "当天时间", "value": "10:00–16:00双湖环线；12:00–12:30午餐，12:30–13:15双湖短往返，13:15回Locatelli接105。16:15目标开车，最迟16:30返程。"}], "access": "06:30离开Tofana，07:30起按预约过收费闸门，早到在允许处等候；过闸后约6公里上山，目标08:00停好车并起步。10/1导航样本到Auronzo全段约45–60分钟，已包含上山公路；本计划另留等闸、停车和整装，不重复加算山路。晚到可入场，票仍至19:29，离场不可重入。 本段在上午Cadini回到Auronzo并短休后开始。", "steps": [{"title": "10:00从Auronzo沿101号步道出发", "text": "完成Cadini后补水短休，沿“CAI 101／Rifugio Lavaredo”标牌出发。先看三峰南壁，经过Lavaredo山屋后继续上坡。"}, {"title": "在 Forcella Lavaredo 山口看北壁", "text": "约1小时到海拔2,454米的山口，这里第一次能清楚看到三峰北壁。停留拍照10–15分钟；风大或浓雾进入山口时提前离开。"}, {"title": "到Locatelli看北壁，约12:00–12:30自带午餐", "text": "沿Monte Paterno一侧到Locatelli，在安全宽阔处吃自带午餐，不依赖山屋开门。吃完从山屋后方接101往Pian di Cengia方向的短支线去双湖。"}, {"title": "12:30–13:15：Piani双湖短往返，回Locatelli", "text": "沿山屋后方101向东短走，下到Piani双湖附近，在安全可达的湖岸和上方步道看两湖。留约45分钟含来回与拍照，原路爬回Locatelli再接105。不要沿102下到Val Fiscalina，也不继续去第三湖、Pian di Cengia山屋或Monte Paterno装备线；这是双湖短往返，不要求绕两湖完整一圈。"}, {"title": "沿105号步道，经 Langalm 回 Auronzo", "text": "回Locatelli后按“105／Langalm／Rifugio Auronzo”路牌继续，经过低谷、上坡和Langalm草甸，再绕三峰西侧回Auronzo。Langalm旁的小湖与刚看过的Piani双湖是两处。目标16:00结束，收整后16:15开车。"}], "highlights": ["101看南壁，Lavaredo山口与Locatelli看北壁；双湖作为本次主线中的短往返。", "Piani双湖在Locatelli旁，105回程另有Langalm草甸与小湖；按标示步道连接。"], "turn_back": "目标13:15结束双湖短往返回Locatelli，沿105返回通常仍需约2–2.5小时。若到Locatelli已明显晚于13:00，先核算双湖、105回程及收整余量，缩短湖岸和拍照停留；约13:45从Locatelli开始返程是本次计划界限。目标16:00回Auronzo、16:15开车，最迟16:30返程，18:00前回店。不因时刻赶路；天气或体力转差时选现场可行的较短返回。", "hazards": ["环线以土路、碎石和岩石山径为主。雾、冰、横风或突然降温时会更难走，不能只按平时的步速估计。", "带登山鞋、保暖层、防水外层、手杖、离线地图、头灯、充足水和午餐；不依赖沿线山屋开放。", "不要从主环线转入 Monte Paterno ferrata 或其他带装备路线。"], "alternatives": [{"title": "只走到 Lavaredo 山口", "text": "从 Auronzo 沿101号步道走约1小时到山口，看南壁和北壁后原路返回。天气转差或脚程较慢时可选。"}, {"title": "三峰前重新评估体力", "text": "Cadini结束后若有人不愿继续全环，可以改101到Lavaredo山口往返；主计划仍为101/105完整环线。"}, {"title": "双湖段现场不适合", "text": "若湖岸湿滑、结冰或时间明显不足，可在Locatelli后方安全步道观双湖再返回；正常主线保留双湖短往返。"}], "navigation": [{"label": "高位停车 · Auronzo", "query": "Parcheggio Auronzo, Tre Cime di Lavaredo, 32041 Auronzo di Cadore BL, Italy"}, {"label": "出发与返回 · Auronzo山屋", "query": "Auronzo Refuge, Localita' Forcella Longeres, 32041 Auronzo di Cadore BL, Italy"}, {"label": "双湖 · 仅步行地点定位", "query": "Laghi dei Piani（双湖，步行）"}], "sources": [{"label": "Drei Zinnen 官方：完整环线数据、101/105/102/Locatelli/Langalm路线", "url": "https://www.dreizinnen.com/it/activity/circuito-estivo-tre-cime-di-lavaredo_569"}, {"label": "Auronzo 官方：环线概要、摄影点与高山装备建议", "url": "https://auronzo.info/en/tre-cime-di-lavaredo-dolomites/"}, {"label": "Auronzo 官方：徒步与停车需临近确认山屋开放", "url": "https://auronzo.info/en/summer/hiking/"}, {"label": "Tre Cime 官方停车规则与道路状态", "url": "https://auronzo.info/en/parking-tre-cime-di-lavaredo/"}, {"label": "CAI Ferrara：101从Locatelli经过Piani湖区的路线连接（历史路线说明，非实时开放证明）", "url": "https://www.caiferrara.it/wp/escursionismo-estivo-2016/"}, {"label": "Sexten旅游局：Bödenseen与Locatelli的地理关系", "url": "https://www.sexten.it/de/dolomites/drei-zinnen.html"}, {"label": "Earth Trekkers实走：Locatelli后101湖区支线及105回环（补充证据）", "url": "https://www.earthtrekkers.com/hiking-tre-cime-di-lavaredo-loop/"}, {"label": "CAI Veneto：Locatelli山屋官方路线资料，101与105步行时间（非实时开放证明）", "url": "https://www.caiveneto.it/res/files/scheda%20rifugio%20Locatelli-Innerkofler%20BZ.pdf"}], "checked": "2026-09-16；双湖路线连接与Locatelli步行时间于2026-10-01补核", "glance": "101＋Piani双湖短往返＋105 · 规划约10–12公里 · 含午餐留6小时", "scope": {"kind": "segment", "items": ["三峰双湖环线：Locatelli＋Laghi dei Piani（含午餐）"], "note": "完整环线含Piani双湖短往返与途中30分钟自带午餐，按顺序执行。", "timeline": [{"time": "10:00–16:00", "title": "三峰双湖环线：Locatelli＋Laghi dei Piani（含午餐）"}]}, "planning_updated": "2026-10-01"}, {"id": "day9-cadini", "day": "D9", "title": "魔戒之路：Cadini 尖峰观景，117号步道前段往返", "category": "徒步", "verdict": "当天第一条徒步：06:30离店、07:30起过闸，约08:00从Auronzo出发，争取09:45返回。先完成Cadini尖峰观景，再短休并于10:00开始三峰双湖环线；若Cadini用足2小时，则后续顺延15分钟。路干、风小、没有冰雪，参加者愿意走临崖路段时执行。", "fit": "距离不长，但部分路段窄、旁边是陡坡或悬崖。需要抓地力好的登山鞋和稳定步伐；怕高、疲劳或不愿与同伴分开的人可留在宽阔观景处，或一起取消。", "route": ["Rifugio Auronzo／停车区附近观景露台 → 朝 Rifugio Col de Varda 指示的 CAI 117 前段 → 先短下坡、再爬上对侧草坡／山脊 → 到能看见 Cadini 尖峰的第一个开阔观察点", "只在干燥、风小、本人愿意时，沿已踩踏短支线接近热门狭窄岩脊；不必走到岩脊尖端。原路退回 117 → Auronzo。", "不继续沿117深入 Cadini／Rifugio Fonda Savio／Alberto Bonacossa 装备地形；那是另一种难度和装备要求。"], "stats": [{"label": "距离与爬升", "value": "短观景路线往返约3–3.2公里、累计爬升约162–210米，为非官方实走参考。"}, {"label": "预计用时", "value": "08:00–09:45为目标，通常步行及短停需90–120分钟；10:00返回时后续顺延15分钟。遇排队压缩尖端拍照，不以排队挤压双湖环线。"}, {"label": "全天步行量", "value": "随后三峰双湖版规划约10–12公里；两条合计约13–15公里，属高强度。双湖环线另留6小时，含45分钟双湖、30分钟午餐和拍照休息。"}], "access": "与三峰徒步共用 Auronzo 山屋附近停车场，无须另买停车票。这次只走117号步道前段的观景往返，不进入需要铁道攀登装备的后段。出发前仍要确认道路开放、车牌登记及现场天气。", "steps": [{"title": "08:00起步前看天气和路面", "text": "穿好保暖层与防风外层，确认路面无冰、无明显湿滑，风和能见度适合；所有参加者愿意走临崖路段才出发。模型08:00约2°C；实际体感与山脊风可能不同。"}, {"title": "找到117号步道起点", "text": "从 Auronzo 山屋附近露台，找“CAI 117／Rifugio Col de Varda”标牌，朝离开三峰环线的方向走。先短暂下坡，再爬上对面的草坡和山脊，不沿草地上的零散脚印抄近路。"}, {"title": "先在宽阔处看尖峰", "text": "到第一个能完整看见 Cadini 尖峰的开阔位置，先停下来拍照。这里就可以作为终点，无须走到热门岩脊尖端。"}, {"title": "只有愿意且条件合适时才靠近岩脊", "text": "热门拍照点的路窄，有树根和松石，旁边是陡坡。若拥挤、有人害怕、风变大或地面潮湿，就返回。不要在尖端换位抢拍，也不走向400米外的第二观景点。"}, {"title": "争取09:45回Auronzo，短休后转三峰双湖", "text": "宽阔处短停拍照后原路回Auronzo，不为尖端长时间排队。争取09:45返回，补水吃小食后10:00开始三峰双湖；若用足2小时，10:00回Auronzo、10:15转三峰，最迟16:30开车返程。"}], "highlights": ["Cadini 是密集的锯齿状尖峰，与三峰厚重的塔状岩壁很不一样。", "上坡途中回头能看三峰背面和 Auronzo 山屋，向前看 Cadini 山群。", "宽阔步道也可看尖峰；先走Cadini便于清晨体力充足时处理窄路，但不能保证无排队或阳光直照。"], "turn_back": "目标09:45回Auronzo，10:00返回时后续顺延15分钟；按实际去程用时留足回程，不为尖端排队。湿滑、冰雪、强风、浓雾或有人不适时缩短或取消。之后再评估三峰双湖体力；停车票至19:29不改变18:00前回店目标。", "hazards": ["观景短线有窄岩脊、树根、松石和陡坡，热门位置可能排队。", "雨后、冰雪、浓雾和强风会明显增加风险；不进入117号步道后段的 Alberto Bonacossa 铁道攀登路线。", "按最不适应的同伴安排，在宽阔处停下或一起返回都可以。"], "alternatives": [{"title": "只到宽阔观景处", "text": "沿117号步道走到第一个宽阔、远离崖边的全景处，拍完 Cadini 山群后原路返回。"}, {"title": "Cadini后缩短三峰", "text": "若完成Cadini后不适合再走完整环线，改101至Lavaredo山口往返，不去Locatelli、105和Langalm。"}, {"title": "Cadini现场不适合", "text": "窄路湿滑、结冰、风大或有人怕高时，在宽阔处结束或取消；三峰是否继续也按独立的路况和体力判断。"}], "navigation": [{"label": "出发与返回 · Auronzo", "query": "Auronzo Refuge, Localita' Forcella Longeres, 32041 Auronzo di Cadore BL, Italy"}, {"label": "观景方向 · Cadini", "query": "Punto Panoramico Dolomiti, 32041 Auronzo di Cadore BL, Italy"}], "sources": [{"label": "Auronzo 官方：Cadini 群与 Alberto Bonacossa 装备步道的区别背景", "url": "https://auronzo.info/en/dolomites/"}, {"label": "Roads & Rivers 2026 实走：117短观景版距离、上升、分叉与暴露警示（补充证据）", "url": "https://roads-and-rivers.com/en/cadini-di-misurina-hike/"}, {"label": "Earth Trekkers 2026 实走：短线时间、岩脊根系、湿风冰风险与排队不确定性（补充证据）", "url": "https://www.earthtrekkers.com/cadini-di-misurina-viewpoint-hike/"}, {"label": "Tre Cime 官方停车与道路规则", "url": "https://auronzo.info/en/parking-tre-cime-di-lavaredo/"}], "checked": "2026-09-16", "glance": "117号步道前段约3公里往返 · 有悬崖旁窄路", "scope": {"kind": "segment", "items": ["魔戒之路：Cadini 观景点往返"], "note": "当天第一条主线；现场条件不合适时缩短或取消。", "timeline": [{"time": "08:00–09:45", "title": "魔戒之路：Cadini 观景点往返"}]}, "planning_updated": "2026-10-01"}, {"id": "day9-lakes", "day": "D9", "title": "天气不好时：Misurina 环湖，体力允许再去 Antorno", "category": "天气替换", "verdict": "三峰道路关闭，或山上低云、风雨、冰雪时，可改到湖边。Misurina 环湖较平缓，能看湖水、树林和秋色；云散时还能远眺群山。湖边也要确认没有冰雪和强风。", "fit": "适合想少走一些的六人同行。先走 Misurina 湖岸，再根据天气和体力决定是否去 Antorno。", "route": ["Misurina正式停车处", "沿开放湖岸环走约2公里", "回Misurina原停车处"], "stats": [{"label": "Misurina 湖环线", "value": "官方参考约2公里，路面较平缓。"}, {"label": "可继续去 Antorno", "value": "官方参考单程30–40分钟，穿过林地和草甸；返回还要走同样一段路。"}, {"label": "按天气决定", "value": "只绕 Misurina 也可以；雨风增强、山体被云遮住或有人累了，就不继续去 Antorno。"}], "access": "Cortina 经 Passo Tre Croci 或其他当日开放道路抵 Misurina；这是 Auronzo 预约道路关闭时的低风险观景方案。停车、道路和天气按当天现场标志执行。", "steps": [{"title": "先绕 Misurina 湖", "text": "沿完整湖岸平路走一圈，选择能看见 Tre Cime、Cadini、Sorapiss 或 Cristallo 的方向拍摄；低云时把重点改为倒影、林色和湖岸氛围。"}, {"title": "可选支线：Antorno，不是环湖必经", "text": "若雨风可控、路面无冰且全员仍愿走，向 Lago d’Antorno 走30–40分钟；带水、防水层和保暖层，按同路返回。"}, {"title": "不为远景硬撑", "text": "云遮住山体、雨势增强或能见度下降时，绕完 Misurina 就返回 Cortina；出现道路警示时及时改道，不继续上山。"}], "highlights": ["天气好时看湖面与群山倒影，低云时看看树林、湖水和秋色。", "Antorno 更靠近三峰，可以作为额外的湖景停留。"], "turn_back": "雨势增强、初雪／结冰、能见度恶化、全员寒冷或有人鞋底抓地不足时，在最近安全湖岸折返；不进入未确认开放的上山道路。", "hazards": ["湖边的湿木桥、落叶和结冰处容易滑，低温时及时添衣。", "远处山峰可能被云遮住，雨风变强时提前回车。"], "alternatives": [{"title": "湖区内可选：Antorno", "text": "只有天气、路况和体力允许，才从 Misurina 另走去 Antorno，单程30–40分钟，原路返回需同样时间。"}, {"title": "风雨、冰雪也影响湖区", "text": "取消湖边活动，回Cortina休息。湖区替换方案取消三峰与Cadini，不在走完湖区后临时追加两条高山线。"}], "navigation": [{"label": "主选湖岸 · Misurina", "query": "32041 Misurina, Province of Belluno, Italy"}, {"label": "可选停车 · Antorno 湖", "query": "PARKING LAGO ANTORNO, 32041 Misurina BL, Italy"}], "sources": [{"label": "Auronzo 官方：Misurina 湖环和至 Antorno 的简单步行", "url": "https://auronzo.info/en/misurina-dolomites/"}, {"label": "Auronzo 官方：湖泊与 Antorno 的 Tre Cime 景观", "url": "https://auronzo.info/en/lakes/"}, {"label": "Tre Cime 官方停车、道路关闭与公共交通 function pendingPackChanges(){

function savePendingPackChanges(changes){

}

function decodePackCloudbaseHandoff(raw){

  let s=String(raw).replace(/-/g,'+').replace(/_/g,'/');

  const json=decodeURIComponent(Array.prototype.map.call(bytes,ch=>'%'+('00'+ch.charCodeAt(0).toString(16)).slice(-2)).join(''));

}

async function ensurePackBridge(){

    let done=false;

    const hasPopup=!!(PACK_SYNC.bridgeWindow && !PACK_SYNC.bridgeWindow.closed);
    const cleanup=()=>{
      if(timer) clearTimeout(timer);

    };
    const onMessage=(event)=>{
      if(event.origin!==PACK_BRIDGE_ORIGIN || event.source!==packBridgeTarget()) return;
      const msg=event.data||{};
      if(msg.type!=='pack-cloud-bridge-ready') return;

async function packBridgeCall(op, extra){

  const id='pack-'+(++PACK_SYNC.bridgeSeq)+'-'+Date.now().toString(36);
  return new Promise((resolve,reject)=>{
    let timer=null;
    const cleanup=()=>{
      if(timer) clearTimeout(timer);
      window.removeEventListener('message', onMessage);
    };
    const onMessage=(event)=>{
      if(event.origin!==PACK_BRIDGE_ORIGIN || event.source!==target) return;
      const msg=event.data||{};
      if(msg.type!=='pack-cloud-response' || msg.id!==id) return;
      cleanup();
      if(msg.ok) resolve(msg.data||{});
      else reject(new Error((msg.error&&msg.error.message)||'云同步桥接失败'));
    };
    window.addEventListener('message', onMessage);
    timer=setTimeout(()=>{
      cleanup();
      reject(new Error('云同步桥接超时，请先打开云同步授权页点“确定访问”'));
    },15000);

  });

async function fetchCloudPackState(){

function normalizeCloudPackState(raw){
  let data=raw;
  if(data&&typeof data==='object'&&typeof data.value==='string'&&!data.items) data=data.value;
  if(typeof data==='string'){
    try{ data=JSON.parse(data); }catch(e){ data={}; }
  }
  if(!data||typeof data!=='object'||Array.isArray(data)) data={};
  const items={};
  const meta={};
  const fallbackTs=String(data.updatedAt||'');
  const fallbackBy=String(data.updatedBy||'');
  Object.entries(data.items||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)&&v!=null) items[k]=String(v);
  });
  Object.entries(data.meta||{}).forEach(([k,v])=>{
    if(!isPackingStorageKey(k)||!v||typeof v!=='object'||Array.isArray(v)) return;
    meta[k]={ts:String(v.ts||fallbackTs),by:String(v.by||fallbackBy),deleted:!!v.deleted};
  });
  Object.keys(items).forEach(k=>{
    if(!meta[k]) meta[k]={ts:fallbackTs,by:fallbackBy,deleted:false};
    else meta[k].deleted=false;
  });
  Object.entries(meta).forEach(([k,v])=>{
    if(v.deleted) delete items[k];
  });
  return {version:2,items,meta,updatedAt:fallbackTs,updatedBy:fallbackBy};
}
function packCloudHasAny(cloud){
  const data=normalizeCloudPackState(cloud);
  return !!(Object.keys(data.items).length||Object.keys(data.meta).length);
}
function makeCloudPackState(items,meta,updatedBy){
  const cleanItems={};
  const cleanMeta={};
  const now=packIsoNow();
  Object.entries(items||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)&&v!=null) cleanItems[k]=String(v);
  });
  const keys=new Set([...Object.keys(cleanItems),...Object.keys(meta||{})]);
  keys.forEach(k=>{
    if(!isPackingStorageKey(k)) return;
    const m=(meta&&meta[k])||{};
    const exists=Object.prototype.hasOwnProperty.call(cleanItems,k);
    cleanMeta[k]={ts:String(m.ts||now),by:String(m.by||updatedBy||packDeviceId()),deleted:exists?false:!!m.deleted};
  });
  return {version:2,items:cleanItems,meta:cleanMeta,updatedAt:now,updatedBy:updatedBy||packDeviceId()};
}
function makeCloudPackStateFromLocalItems(items,ts,by){
  const meta={};

  Object.entries(items||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)&&v!=null) meta[k]={ts:stamp,by:device,deleted:false};
  });

}
function mergePackPendingIntoCloud(cloud,pending){
  const base=normalizeCloudPackState(cloud);
  const normalized=normalizePackPendingObject(pending).changes;
  const items={...(base.items||{})};
  const meta={...(base.meta||{})};
  const applied={};
  const skipped={};
  Object.entries(normalized).forEach(([k,entry])=>{
    if(!isPackingStorageKey(k)) return;
    const current=meta[k]||{};
    const incomingMs=packTimestampMs(entry.ts);
    const currentMs=packTimestampMs(current.ts);
    if(!current.ts||incomingMs>=currentMs){
      if(entry.value==null){
        delete items[k];
        meta[k]={ts:entry.ts,by:entry.by,deleted:true};
      }else{
        items[k]=String(entry.value);
        meta[k]={ts:entry.ts,by:entry.by,deleted:false};
      }
      applied[k]=entry;
    }else{
      skipped[k]=entry;
    }
  });

}
function splitPackPendingByCloud(cloud,pending){
  const latest=normalizeCloudPackState(cloud);
  const normalized=normalizePackPendingObject(pending).changes;
  const verified={};
  const retry={};
  Object.entries(normalized).forEach(([k,entry])=>{
    const current=latest.meta[k];
    if(!current){
      retry[k]=entry;
      return;
    }
    const currentMs=packTimestampMs(current.ts);
    const entryMs=packTimestampMs(entry.ts);
    if(currentMs>entryMs){
      verified[k]=entry;
      return;
    }
    if(currentMs<entryMs){
      retry[k]=entry;
      return;
    }
    if(entry.value==null){
      if(current.deleted||!Object.prototype.hasOwnProperty.call(latest.items,k)) verified[k]=entry;
      else retry[k]=entry;
    }else if(!current.deleted&&latest.items[k]===String(entry.value)){
      verified[k]=entry;
    }else{
      retry[k]=entry;
    }
  });
  return {verified,retry,latest};
}

async function handlePackCloudbaseHandoff(){
  if(packCanUseBridge()) return false;
  const params=new URLSearchParams(location.search||'');
  const raw=params.get('handoff');
  if(!raw) return false;
  try{
    const cleanUrl=location.pathname+(params.has('v')?'?v='+encodeURIComponent(params.get('v')):'');
    history.replaceState(null,'',cleanUrl);
  }catch(e){}
  try{
    const payload=decodePackCloudbaseHandoff(raw);
    if(!payload) return false;
    if(payload.mode==='replace'){
      setPackSyncStatus('正在用本机清单更新云端…','pending');
      const items={};
      Object.entries(payload.items||{}).forEach(([k,v])=>{
        if(isPackingStorageKey(k)&&v!=null) items[k]=String(v);
      });
      if(Object.keys(items).length){
        const data=await saveCloudPackState(makeCloudPackStateFromLocalItems(items,payload.createdAt,payload.updatedBy));
        applyCloudPackState(data.items||{},true);
        savePendingPackChanges({});
        setPackSyncStatus(`已用本机清单更新云端 ${packNowLabel()}`,'ok');
      }else{
        setPackSyncStatus('本机没有可上传的行李改动','err');
      }
      return true;
    }
    if(payload.mode==='push'){
      setPackSyncStatus('正在保存手机清单到云端…','pending');
      const pending=normalizePackPendingObject(payload.pending||{},payload.createdAt).changes;
      let pushed=false;
      if(Object.keys(pending).length){
        savePendingPackChanges({...pendingPackChanges(),...pending});
        pushed=await flushPackCloudPending();
      }else{
        const cloud=await fetchCloudPackState();
        const localItems={};
        Object.entries(payload.items||{}).forEach(([k,v])=>{
          if(isPackingStorageKey(k)&&v!=null) localItems[k]=String(v);
        });
        if(!packCloudHasAny(cloud)&&Object.keys(localItems).length){
          const bootstrap={};
          Object.entries(localItems).forEach(([k,v])=>{ bootstrap[k]=packChangeEntry(v,payload.createdAt,payload.updatedBy); });
          savePendingPackChanges(bootstrap);
          pushed=await flushPackCloudPending();
        }else{
          applyCloudPackState(cloud.items||{},true);
        }
      }
      if(pushed) setPackSyncStatus(`已上传到云端 ${packNowLabel()}`,'ok');
      else if(!Object.keys(pendingPackChanges()).length) setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
      return true;
    }
    setPackSyncStatus('正在从云端读取…','pending');
    const data=await fetchCloudPackState();
    applyCloudPackState(data.items||{},true);
    setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
    return true;
  }catch(e){
    console.warn('[pack-sync] handoff failed', e);
    setPackSyncStatus('云同步接力失败，请再点一次','err');
    return true;
  }
}
function applyCloudPackState(items,prune){
  const keep=new Set(Object.keys(items||{}).filter(isPackingStorageKey));
  PACK_SYNC.applying=true;
  try{
    Object.entries(items||{}).forEach(([k,v])=>{
      if(!isPackingStorageKey(k)) return;
      localStorage.setItem(k,String(v));
    });
    if(prune){
      packStorageKeys().forEach(k=>{
        if(!keep.has(k)) localStorage.removeItem(k);
      });
    }
  }catch(e){
    console.warn('[pack-sync] apply failed', e);
  }finally{
    PACK_SYNC.applying=false;
  }
  const active=document.activeElement;
  if(!(active&&active.classList&&active.classList.contains('pack-text'))) renderTodos();
}
function queuePackCloudPatch(changes){
  if(PACK_SYNC.applying) return;
  const filtered={};
  const ts=packIsoNow();
  Object.entries(changes||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)) filtered[k]=packChangeEntry(v,ts,packDeviceId());
  });
  if(!Object.keys(filtered).length) return;
  const pending={...pendingPackChanges(),...filtered};
  savePendingPackChanges(pending);
  setPackSyncStatus('待同步到另一台手机','pending');

async function flushPackCloudPending(){
  if(PACK_SYNC.flushing) return false;
  const changes=pendingPackChanges();
  if(!Object.keys(changes).length) return true;
  PACK_SYNC.flushing=true;
  setPackSyncStatus('正在同步…','pending');
  try{
    const cloud=await fetchCloudPackState();
    const merged=mergePackPendingIntoCloud(cloud,changes);
    await saveCloudPackState(merged.state);
    await packSleep(300);
    let split=splitPackPendingByCloud(await fetchCloudPackState(),changes);
    if(Object.keys(split.retry).length){
      const retryMerged=mergePackPendingIntoCloud(split.latest,split.retry);
      await saveCloudPackState(retryMerged.state);
      await packSleep(450);
      split=splitPackPendingByCloud(await fetchCloudPackState(),changes);
    }
    const remaining=clearFlushedPackChanges(split.verified);
    if(Object.keys(remaining).length){
      setPackSyncStatus('还有新改动待同步','pending');
      if(PACK_SYNC.timer) clearTimeout(PACK_SYNC.timer);
      PACK_SYNC.timer=setTimeout(()=>{ flushPackCloudPending().catch(()=>{}); },350);
      return false;
    }
    applyCloudPackState(split.latest.items||{},true);
    setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
    return true;
  }catch(e){
    console.warn('[pack-sync] flush failed', e);
    setPackSyncStatus(packSyncErrorText(e,'云同步暂不可用，本机已保存'),'err');
    return false;
  }finally{
    PACK_SYNC.flushing=false;
  }
}
