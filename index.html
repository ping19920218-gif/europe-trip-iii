async function syncPackCloudNow(manual){
  if(!STATE.packing||!STATE.packing.length) return;
  if(packCanUseBridge()&&!manual&&!PACK_SYNC.bridgeReady){
    setPackSyncStatus('点“家庭同步”，在弹窗中点“确定访问”（首次一次）','pending');
    return;
  }
  if(manual) setPackSyncStatus('正在同步…','pending');
  try{
    if(packCanUseBridge()){
      if(manual) preparePackBridgeInteractive();
      PACK_SYNC.bridgePreferred=true;
      await ensurePackBridge();
    }else{
      await ensurePackCloud();
    }
    const flushed=await flushPackCloudPending();
    if(!flushed) return;
    const data=await fetchCloudPackState();
    const cloudItems=data.items||{};
    const localItems=readLocalPackState();
    if(!packCloudHasAny(data) && Object.keys(localItems).length){
      queuePackCloudPatch(localItems);
      await flushPackCloudPending();
    }else{
      applyCloudPackState(cloudItems,true);
      setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
    }
  }catch(e){
    console.warn('[pack-sync] sync failed', e);
    setPackSyncStatus(packSyncErrorText(e,'云同步暂不可用，本机可继续改'),'err');
  }
}
function startPackCloudSync(){
  if(!STATE.packing||!STATE.packing.length) return;
  setPackSyncStatus('正在连接云同步…','pending');
  syncPackCloudNow(false);
  window.addEventListener('online',()=>syncPackCloudNow(false));
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncPackCloudNow(false); });
  setInterval(()=>{ if(document.visibilityState==='visible') syncPackCloudNow(false); },12000);
}

function renderDayMap(d){
  if(window.LMAP){try{window.LMAP.remove();}catch(e){} window.LMAP=null;}
  const pts=(d.map||[]).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)); if(!pts.length || !window.L || !document.getElementById('daymap')) return;
  const map=L.map('daymap',{zoomControl:true,attributionControl:true,scrollWheelZoom:false});
  window.LMAP=map;
  if(d.map_zoom_control_position)map.zoomControl.setPosition(d.map_zoom_control_position);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,crossOrigin:true,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  const kc={hotel:'#145a4a',sight:'#287568',food:'#b85c38',transit:'#2d6f8e'};
  const ll=[];
  pts.forEach((p,i)=>{
    const c=kc[p.kind]||'#555';
    const ic=L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],html:
      `<div style="background:${c};color:#fff;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)"><span style="transform:rotate(45deg);font-size:12px;font-weight:700">${i+1}</span></div>`});
    const marker=L.marker([p.lat,p.lng],{icon:ic,title:p.label}).addTo(map).bindPopup(`${i+1}. ${esc(p.label)}${p.usage?`<p>${esc(p.usage)}</p>`:''}${mapsInfo(p.label)}${mapsLink(p.label)}`);
    if(p.short_label) marker.bindTooltip(escRaw(p.short_label),{permanent:true,direction:p.tooltip_direction||'right',offset:[p.tooltip_direction==='left'?-12:12,0]});
    ll.push([p.lat,p.lng]);
  });
  const routes=d.map_routes||[d.map.map((_,i)=>i)];
  routes.forEach((route,i)=>{
    const line=route.map(index=>d.map[index]).filter(p=>p&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)).map(p=>[p.lat,p.lng]);
    if(line.length>1) L.polyline(line,{color:i===0?'#145a4a':'#b85c38',weight:3,opacity:.55,dashArray:'7,7'}).addTo(map);
  });
  let activeView=0;
  const views=d.map_views||[];
  const fit=()=>{
    try{
      const view=views[activeView], selected=view?view.indices.map(i=>d.map[i]).filter(Boolean).map(p=>[p.lat,p.lng]):ll;
      if(selected.length>1) map.fitBounds(L.latLngBounds(selected),{paddingTopLeft:[34,34],paddingBottomRight:[view?100:34,34],maxZoom:view?.maxZoom||13});
      else map.setView(selected[0]||ll[0],view?.zoom||12);
    }catch(e){map.setView(ll[0]||[46,12],7);}
  };
  const controls=document.getElementById('daymap-views');
  if(controls)controls.querySelectorAll('button').forEach((button,i)=>{
    button.setAttribute('aria-pressed',i===activeView?'true':'false');
    button.onclick=()=>{activeView=i;controls.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j?'true':'false'));fit();};
  });
  fit();
  // 容器尺寸/瓦片稳定后再 invalidateSize+重新 fit, 防止首帧高度未定导致 marker 被切到框外
  setTimeout(()=>{ try{ map.invalidateSize(); fit(); }catch(e){} },200);
  setTimeout(()=>{ try{ map.invalidateSize(); fit(); }catch(e){} },550);
}

function findFlightSchedule(dayDate,title){

function bindSegmented(rootId,stateGetter,stateSetter){
  const root=$(rootId);if(!root)return;
  root.querySelectorAll('[data-segment]').forEach(btn=>{btn.setAttribute('role','tab');btn.setAttribute('aria-selected',btn.classList.contains('on')?'true':'false');btn.onclick=()=>{
    stateSetter(btn.dataset.segment);
    root.querySelectorAll('[data-segment]').forEach(b=>{const on=b===btn;b.classList.toggle('on',on);b.setAttribute('aria-selected',on?'true':'false');});
    root.querySelectorAll('.segment-panel').forEach(panel=>panel.hidden=panel.dataset.panel!==stateGetter());
  };});
}

function weatherFreshness(timestamp,now=Date.now()){
  const queried=Date.parse(timestamp);
  if(!Number.isFinite(queried)||!Number.isFinite(now)||queried>now+3600000)return {stale:true,text:'无法确认快照时效，请查看官方最新预报。'};
  if(now-queried>24*3600000)return {stale:true,text:'这份快照已超过24小时，请联网查看下方官方最新预报；原数值的预报提前量不会随日期自动缩短。'};
  return {stale:false,text:'本次查询快照，可离线查看；最新预报与开放情况请从下方官方入口核对。'};
}
function weatherCondition(code){
  const labels={0:'晴',1:'大致晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'较强毛毛雨',56:'冻毛毛雨',57:'冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'阵雨',81:'阵雨',82:'强阵雨',85:'阵雪',86:'强阵雪',95:'雷雨',96:'雷雨冰雹',99:'雷雨冰雹'};
  return Number.isInteger(code)?(labels[code]||'天气类型未识别'):'天气类型未提供';
}
function weatherNumber(value,unit,digits=0){
  return Number.isFinite(value)?`${Number(value.toFixed(digits))}${unit}`:'未提供';
}

      const metrics=[['气温 · 日低～日高',temp],['降水概率 · 日最高',weatherNumber(f.precipitation_probability_max,'%')],['降水量 · 全天',weatherNumber(f.precipitation_sum,' mm',1)],['阵风 · 日最大',weatherNumber(f.wind_gusts_10m_max,' km/h')]];

  $('v-weather').innerHTML=h;

function todoStorageKey(t){return t.storage_key||packKey('predeparture',`${t.priority}|${t.deadline}|${t.label}`);}
function todoGroupPlan(){
  const groups=STATE.todo_plan?.groups;
  return Array.isArray(groups)&&groups.length?groups:['近期','临行','途中'].map(id=>({id,label:id}));
}
function orderedTodos(){
  return (STATE.predeparture_todo||[]).map((todo,index)=>({todo,index})).sort((a,b)=>
    (Number.isFinite(a.todo.sort_order)?a.todo.sort_order:a.index)-(Number.isFinite(b.todo.sort_order)?b.todo.sort_order:b.index)||a.index-b.index
  ).map(entry=>entry.todo);
}
function todoStage(t){
  const groups=todoGroupPlan().map(group=>group.id);
  if(groups.includes(t.stage))return t.stage;
  const text=String(t.deadline||'');
  const inferred=/入住|取车|还车|到店|现场|途中|抵达|当天|10\/|9\/2[3-9]|9\/30/.test(text)?'途中':/尽快|逾期|开售|近期|公开部署前/.test(text)?'近期':'临行';
  return groups.includes(inferred)?inferred:groups[0];
}

function renderPackRow(key,catIndex,text,original,isCustom){

function restoreDeletedPacking(){
  (STATE.packing||[]).forEach(c=>{
    (c.items||[]).forEach(it=>{
      const key=packingStorageKey(c,it);
      saveDeleted(key,false);
    });

function syncPackCounts(cat){
  const cards = cat==null ? document.querySelectorAll('.pack-card') : document.querySelectorAll(`.pack-card[data-pack-cat="${cat}"]`);
  cards.forEach(card=>{
    const inputs=[...card.querySelectorAll('input[type="checkbox"]')];
    inputs.forEach(input=>input.closest('.packi').classList.toggle('done', input.checked));
    const done=inputs.filter(x=>x.checked).length;
    const total=inputs.length;
    const el=$(`pack-count-${card.dataset.packCat}`);
    if(el) el.textContent = total ? `${done}/${total}` : '';
  });
}

function bindPackingChecks(){
  document.querySelectorAll('.packi input').forEach(input=>{
    input.checked = loadChecked(input.dataset.packKey);
    input.onchange=()=>{
      saveChecked(input.dataset.packKey, input.checked);
      syncPackCounts(input.dataset.packCat);
    };
  });
  document.querySelectorAll('.pack-text').forEach(el=>{
    const persist=()=>{
      const saved=savePackText(el.dataset.packKey, el.textContent, el.dataset.packOriginal||'');
      if(cleanPackText(el.textContent)!==saved) el.textContent=saved;
    };
    el.oninput=()=>{ savePackText(el.dataset.packKey, el.textContent, el.dataset.packOriginal||''); };
    el.onblur=persist;
    el.onkeydown=(ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); } };
    el.onpaste=(ev)=>{
      ev.preventDefault();
      const text=(ev.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, cleanPackText(text));
    };
  });
  document.querySelectorAll('.pack-del').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      const row=btn.closest('.packi');
      const isCustom=row&&row.dataset.packCustom==='1';
      if(isCustom) removeCustomItem(btn.dataset.packCat, btn.dataset.packKey);
      else saveDeleted(btn.dataset.packKey,true);
      const card=btn.closest('.pack-card');
      if(row) row.remove();
      syncPackCounts(btn.dataset.packCat);
      syncPackDeletedTools();
    };
  });
  document.querySelectorAll('.pack-add').forEach(btn=>{
    btn.onclick=()=>{
      const catIndex=btn.dataset.packCat;
      const added=addCustomItem(catIndex,'新增行李项');
      const key=added.key;
      const text=added.item.text;
      const row=renderPackRow(key,catIndex,text,text,true);
      const list=btn.closest('.pack-card').querySelector('.pack-list');
      list.appendChild(row);
      bindPackingChecks();
      const editor=row.querySelector('.pack-text');
      if(editor){
        editor.focus();
        const range=document.createRange();
        range.selectNodeContents(editor);
        const sel=window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      syncPackCounts(catIndex);
    };
  });
  const restore=$('pack-restore');
  if(restore) restore.onclick=restoreDeletedPacking;
  const syncNow=$('pack-sync-now');
  if(syncNow) syncNow.onclick=()=>syncPackCloudNow(true);
  const pushLocal=$('pack-push-local');
  if(pushLocal) pushLocal.onclick=()=>replacePackCloudWithLocal(true);
  syncPackCounts();
  syncPackDeletedTools();
  paintPackSyncStatus();
}

/* Native Web Crypto only. Passwords and raw keys never enter cloud requests. */
const VaultCrypto = (() => {
  const version=1, iterations=600000, maxBytes=90*1024*1024;
  const aad=new TextEncoder().encode('EuropeTripIII/private-vault/v1');
  function encode(bytes){let s='';for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s);}
  function decode(value,max){
    if(typeof value!=='string'||value.length>Math.ceil(max/3)*4||!value.length||value.length%4||!/^[A-Za-z0-9+/]*={0,2}$/.test(value))throw new Error('加密资料格式无效。');
    const bytes=Uint8Array.from(atob(value),c=>c.charCodeAt(0));if(bytes.length>max)throw new Error('加密资料过大。');return bytes;
  }
  function validate(envelope){
    if(envelope?.format!=='europe-trip-iii-encrypted-vault'||envelope.version!==version||envelope.kdf!=='PBKDF2-SHA-256'||envelope.iterations!==iterations||envelope.cipher!=='AES-256-GCM')throw new Error('不支持此加密资料版本。');
    const salt=decode(envelope.salt,32),iv=decode(envelope.iv,12),ciphertext=decode(envelope.ciphertext,maxBytes+16);
    if(salt.length!==32||iv.length!==12||ciphertext.length<17)throw new Error('加密资料不完整。');
    return {salt,iv,ciphertext};
  }
  async function passwordKey(password){
    if(!crypto?.subtle)throw new Error('请从正式 HTTPS 页面打开凭证夹。');
    return crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);

      if(!vaultSlot(slot)||!vaultValidName(file.name)||!file.size||file.size>VAULT_LIMIT.file)throw new Error('单份文件须为 1 字节至 25 MB，文件名不能包含路径。');
      const bytes=new Uint8Array(await file.arrayBuffer()),sha256=await vaultDigest(bytes),mime=vaultMime(file.name,bytes);
      data={rows:[{id:`user:${slot}:${sha256.slice(0,24)}`,slot,name:file.name,label:file.name.slice(0,160),size:file.size,sha256,mime,blob:new Blob([bytes],{type:mime}),updated:new Date().toISOString()}]};
    }else{
      if(file.size>VAULT_LIMIT.package||!file.size)throw new Error('请选择完整资料包，文件上限为 85 MB。');
      data=await vaultValidatePackage(await file.text());
    }
    const result=await vaultSave(data.rows,data.marks);
    const stored=await vaultRead();
    if(!data.rows.every(row=>stored.files.some(f=>f.slot===row.slot&&f.sha256===row.sha256)))throw new Error('保存后的目录核验失败，请重新打开凭证夹检查。');
    let persistent=false;try{persistent=await navigator.storage?.persist?.()||false;}catch{}
    vaultMessage=`已保存 ${result.count} 份，跳过 ${result.duplicate} 份重复文件。${persistent?'浏览器已允许持久保存，仍请保留离线备份。':'请在「文件」App 保留备份，并在出发前打开核对。'}`;
  }catch(error){vaultError=vaultStorageError(error);}
  finally{vaultBusy=false;const error=vaultError;await vaultRefresh();if(error){vaultError=error;renderVault();}}
}
function vaultChooseFile(slot){
  const input=document.createElement('input');input.type='file';
  input.accept=slot?'.pdf,.png,.jpg,.jpeg,.txt,.msg,application/pdf,image/png,image/jpeg,text/plain,application/vnd.ms-outlook':'.json,application/json';
  input.style.display='none';document.body.appendChild(input);
  input.addEventListener('change',()=>{const file=input.files?.[0];input.remove();void vaultRunImport(file,slot);},{once:true});
  input.addEventListener('cancel',()=>input.remove(),{once:true});input.click();
}
async function vaultMark(slot,value){
  if(!vaultSlot(slot)||!Object.hasOwn(VAULT_MARKS,value))return;
  try{const db=await vaultDatabase();await new Promise((resolve,reject)=>{const tx=db.transaction('marks','readwrite');tx.objectStore('marks').put({slot,value});tx.oncomplete=resolve;tx.onabort=tx.onerror=()=>reject(tx.error);});await vaultRefresh();}
  catch(error){vaultError=vaultStorageError(error);renderVault();}
}
async function vaultRemove(id){
  if(vaultBusy)return;
  const row=vaultRows.find(f=>f.id===id);if(!row||!confirm(`从本机移除「${row.label}」？请先确认「文件」App 中已有备份。`))return;
  try{
    const db=await vaultDatabase();await new Promise((resolve,reject)=>{const tx=db.transaction(['files','marks'],'readwrite');tx.objectStore('files').delete(id);tx.objectStore('marks').put({slot:row.slot,value:'unreviewed'});tx.oncomplete=resolve;tx.onabort=tx.onerror=()=>reject(tx.error);});
    vaultMessage='已从本机移除这份文件。';await vaultRefresh();
  }catch(error){vaultError=vaultStorageError(error);renderVault();}
}
async function vaultExport(){
  if(vaultBusy)return;vaultBusy=true;renderVault();
  try{
    const {files,marks}=await vaultRead();if(!files.length)throw new Error('本机没有可备份的凭证。');
    const out=[];
    for(const row of files){
      const bytes=new Uint8Array(await row.blob.arrayBuffer());let binary='';
      for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));
      const {id,slot,name,label,size,mime,sha256}=row;out.push({id,slot,name,label,size,mime,sha256,data:btoa(binary)});
    }
    const blob=new Blob([JSON.stringify({format:'europe3-private-vault',version:1,trip:'europe-trip-iii-2026',created:new Date().toISOString(),files:out,marks})],{type:'application/json'});
    const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`欧洲旅行凭证_本机备份_${new Date().toISOString().slice(0,10)}.e3vault.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
    vaultMessage='已生成备份文件；请确认已保存到「文件」App。每部手机可分别导入此备份。';
  }catch(error){vaultError=vaultStorageError(error);}
  finally{vaultBusy=false;renderVault();}
}

function vaultCloseViewer(popHistory=true){
  if(!vaultViewer)return;
  const {dialog,url,focus}=vaultViewer;vaultViewer=null;dialog.close();dialog.remove();URL.revokeObjectURL(url);
  document.body.style.overflow='';if(focus?.isConnected)focus.focus();
  if(popHistory&&history.state?.vaultViewer){vaultViewerPop=true;history.back();}
}
async function vaultOpenFile(id){
  const row=vaultRows.find(f=>f.id===id);if(!row)return;
  vaultCloseViewer(false);
  const dialog=document.createElement('dialog');dialog.className='vault-dialog';dialog.setAttribute('aria-labelledby','vault-view-title');
  const url=URL.createObjectURL(row.blob),focus=document.activeElement;
  vaultViewer={dialog,url,focus};let zoom=1;
  dialog.innerHTML=`<div class="vault-view-head"><div class="vault-view-title"><h2 id="vault-view-title">${escRaw(row.label||row.name)}</h2><button type="button" class="vault-button" data-view-close>关闭</button></div><div class="vault-view-actions"><a class="vault-button" href="${url}" target="_blank" rel="noopener">打开原文件 ↗</a><a class="vault-button" href="${url}" download="${escAttr(row.name)}">存到文件</a>${row.mime.startsWith('image/')?'<button type="button" class="vault-button" data-view-zoom>放大图片</button>':''}</div><p class="vault-view-note">${row.mime==='application/pdf'?'PDF 可翻页；若手机预览不完整，请点「打开原文件」。':row.mime==='application/vnd.ms-outlook'?'MSG 原邮件需支持的邮件应用打开；酒店另附可离线阅读的正文。':'本机原件 · 图片可放大查看，文字可上下滚动。'}</p></div><div class="vault-view-body"></div>`;
  const body=dialog.querySelector('.vault-view-body');
  if(row.mime==='application/pdf'){const frame=document.createElement('iframe');frame.title='PDF 原件';frame.src=url;body.appendChild(frame);}
  else if(row.mime.startsWith('image/')){const img=document.createElement('img');img.alt=row.label||row.name;img.src=url;img.style.width='100%';body.appendChild(img);dialog.querySelector('[data-view-zoom]').onclick=event=>{zoom=zoom===1?2:zoom===2?3:1;img.style.width=`${zoom*100}%`;event.currentTarget.textContent=zoom===1?'放大图片':`${zoom} 倍 · 再点切换`;};}
  else if(row.mime==='text/plain'){const pre=document.createElement('pre');pre.textContent='正在打开…';body.appendChild(pre);row.blob.text().then(text=>{pre.textContent=text;}).catch(()=>{pre.textContent='文件读取失败，请关闭后重试。';});}
  else{const p=document.createElement('p');p.className='vault-view-placeholder';p.textContent='已保留原始邮件文件。请下载后用邮件应用查看，或关闭此页打开同项下的「确认邮件正文」。';body.appendChild(p);}
  document.body.appendChild(dialog);document.body.style.overflow='hidden';
  dialog.querySelector('[data-view-close]').onclick=()=>vaultCloseViewer();dialog.addEventListener('cancel',event=>{event.preventDefault();vaultCloseViewer();});
  history.pushState({...history.state,vaultViewer:true},'',location.href);dialog.showModal();dialog.querySelector('[data-view-close]').focus();
}
window.addEventListener('popstate',()=>{if(vaultViewer&&!history.state?.vaultViewer){vaultViewerPop=true;vaultCloseViewer(false);}});
function vaultConsumeViewerPop(route){const skip=vaultViewerPop&&route.view==='vault'&&Number(route.day)===curDay;vaultViewerPop=false;return skip;}
document.addEventListener('change',event=>{const select=event.target.closest('[data-vault-mark]');if(select)void vaultMark(select.dataset.vaultMark,select.value);});
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-vault-slot],[data-vault-day],[data-vault-scope],[data-vault-import],[data-vault-add],[data-vault-open],[data-vault-remove],[data-vault-export]');if(!button)return;
  if(button.hasAttribute('data-vault-slot'))openVault(button.dataset.vaultSlot);
  else if(button.hasAttribute('data-vault-day')){openVault(null,button.dataset.vaultDay==='current'?curDay:Number(button.dataset.vaultDay));if(button.dataset.vaultDay==='current'){vaultScope='all';renderVault();}}
  else if(button.hasAttribute('data-vault-scope')){vaultScope=button.dataset.vaultScope;renderVault();}
  else if(button.hasAttribute('data-vault-import'))vaultChooseFile();
  else if(button.hasAttribute('data-vault-add'))vaultChooseFile(button.dataset.vaultAdd);
  else if(button.hasAttribute('data-vault-open'))void vaultOpenFile(button.dataset.vaultOpen);
  else if(button.hasAttribute('data-vault-remove'))void vaultRemove(button.dataset.vaultRemove);
  else if(button.hasAttribute('data-vault-export'))void vaultExport();
});

function vaultCloudPanel(){
  if(!VAULT_CLOUD.enabled)return '<div class="vault-summary">云端资料正在准备；已有本机文件可继续使用。</div>';
  const remembered=!!vaultCloudState?.key;
  let h='<section class="vault-cloud card" aria-label="加密云端资料"><h3>云端旅行资料</h3>';
  if(!vaultCloudReady)h+='<p class="vault-meta">正在读取此设备的解锁状态…</p>';
  else if(remembered){
    h+=`<p class="vault-meta">${vaultCloudState.remembered?'此设备已记住解锁。打开 PWA 时自动检查资料更新。':'本次已解锁；下次同步云端更新需重新输入密码。'}</p><div class="vault-tools"><button type="button" class="vault-button primary" data-vault-cloud-sync ${vaultBusy?'disabled':''}>${vaultBusy?'正在下载并校验…':'立即同步'}</button><button type="button" class="vault-button" data-vault-cloud-forget ${vaultBusy?'disabled':''}>${vaultCloudState.remembered?'取消自动解锁':'结束本次解锁'}</button></div>`;
  }else{
    h+=`<p class="vault-meta">${VAULT_CLOUD.fileCount} 份文件已加密保存。请输入凭证夹专用密码；无需分别导入每个文件。</p><form id="vault-cloud-unlock"><label for="vault-cloud-password">凭证夹密码</label><input id="vault-cloud-password" name="vaultPassword" type="password" autocomplete="current-password" required placeholder="输入专用密码" ${vaultBusy?'disabled':''}><label class="vault-cloud-remember"><input name="remember" type="checkbox" checked ${vaultBusy?'disabled':''}>记住此设备，下次自动下载</label><button class="vault-button primary" type="submit" ${vaultBusy?'disabled':''}>${vaultBusy?'正在解锁并校验…':'解锁并下载全部文件'}</button></form>`;
  }
  h+=`<p class="vault-message${vaultCloudError?' error':''}" role="status" aria-live="polite">${escRaw(vaultCloudMessage||'密码只用于本机解密，不发送到云端。')}</p></section>`;
  return h;
}
async function vaultCloudRecord(record){
  const db=await vaultDatabase();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('cloud',record===undefined?'readonly':'readwrite'),store=tx.objectStore('cloud');
    const request=record===undefined?store.get('session'):record===null?store.delete('session'):store.put({...record,id:'session'});
    tx.oncomplete=()=>resolve(record===undefined?request.result:null);
    tx.onabort=tx.onerror=()=>reject(tx.error||new Error('无法保存此设备的解锁状态。'));
  });
}
async function vaultCloudStart(){
  if(!VAULT_CLOUD.enabled)return;
  try{
    vaultCloudState=await vaultCloudRecord()||null;vaultCloudReady=true;
    if(vaultCloudState?.key){
      if(vaultCloudState.revision!==VAULT_CLOUD.revision){await vaultCloudSync(vaultCloudState.key,true);return;}
      vaultCloudMessage=`已下载云端 ${vaultCloudState.fileCount} 份文件，可离线查看。`;
    }
  }catch(error){vaultCloudReady=true;vaultCloudError=true;vaultCloudMessage=vaultStorageError(error);}
  renderVault();
}
async function vaultCloudSync(key,remember){
  if(vaultBusy||!VAULT_CLOUD.enabled)return;
  vaultBusy=true;vaultCloudError=false;vaultCloudMessage='正在下载加密资料，校验通过后保存到此设备…';renderVault();
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
  try{
    const url=new URL(VAULT_CLOUD.url,location.href);
    if(url.origin!==location.origin)throw new Error('云端资料地址无效。');
    const response=await fetch(url.href,{credentials:'omit',referrerPolicy:'no-referrer',signal:controller.signal});
    if(!response.ok)throw new Error('云端资料暂时不可用，请稍后重试；已有本机文件可继续查看。');
    const length=Number(response.headers.get('Content-Length')||0);
    if(length>120*1024*1024)throw new Error('云端资料大小异常，未改动本机文件。');
    const encrypted=new Uint8Array(await response.arrayBuffer());
    if(encrypted.length>120*1024*1024||await vaultDigest(encrypted)!==VAULT_CLOUD.sha256)throw new Error('云端资料校验不通过，未改动本机文件。');
    const envelope=JSON.parse(new TextDecoder().decode(encrypted));
    const plaintext=await VaultCrypto.decrypt(envelope,key);
    const data=await vaultValidatePackage(new TextDecoder('utf-8',{fatal:true}).decode(plaintext));
    if(data.rows.length!==VAULT_CLOUD.fileCount)throw new Error('云端文件数量不符，未改动本机文件。');
    await vaultSave(data.rows,data.marks);
    const stored=await vaultRead();
    if(!data.rows.every(row=>stored.files.some(f=>f.slot===row.slot&&f.sha256===row.sha256)))throw new Error('下载后的文件目录校验失败，请重试。');
    const next={key,remembered:remember,revision:VAULT_CLOUD.revision,fileCount:data.rows.length,updated:new Date().toISOString()};
    vaultCloudState=next;
    vaultCloudMessage=`云端 ${data.rows.length} 份文件已保存并逐份校验，现在可离线查看。${remember?'此设备已记住解锁，下次自动检查更新。':'本次解锁未记住；下次云端更新需重新输入密码。'}`;
    try{if(remember)await vaultCloudRecord(next);else await vaultCloudRecord(null);}
    catch{next.remembered=false;vaultCloudMessage=`云端 ${data.rows.length} 份文件已保存并逐份校验，可离线查看。但浏览器未能保存解锁状态，下次同步需重新输入密码。`;}
    try{await navigator.storage?.persist?.();}catch{}
  }catch(error){
    vaultCloudError=true;
    vaultCloudMessage=error.name==='AbortError'?'下载超时；已有本机文件保留，请联网后重试。':!navigator.onLine?'当前离线；已下载的文件可继续查看，联网后再同步。':vaultStorageError(error);
  }finally{clearTimeout(timer);vaultBusy=false;await vaultRefresh();}
}
async function vaultCloudUnlock(form){
  if(vaultBusy)return;
  const input=form.elements.vaultPassword,remember=form.elements.remember.checked;
  let password=input.value;input.value='';
  try{const key=await VaultCrypto.passwordKey(password);password='';await vaultCloudSync(key,remember);}
  catch(error){password='';vaultCloudError=true;vaultCloudMessage=vaultStorageError(error);renderVault();}
}
async function vaultCloudForget(){
  if(vaultBusy)return;
  if(!confirm('取消此设备的自动解锁？已下载的本机文件仍然保留，可继续离线查看。'))return;
  try{await vaultCloudRecord(null);vaultCloudState=null;vaultCloudError=false;vaultCloudMessage='已取消自动解锁。已有本机文件保留；再次同步时需输入密码。';}
  catch(error){vaultCloudError=true;vaultCloudMessage=vaultStorageError(error);}
  renderVault();
}
document.addEventListener('submit',event=>{if(event.target.id==='vault-cloud-unlock'){event.preventDefault();void vaultCloudUnlock(event.target);}});
document.addEventListener('click',event=>{
  if(event.target.closest('[data-vault-cloud-sync]')&&vaultCloudState?.key)void vaultCloudSync(vaultCloudState.key,!!vaultCloudState.remembered);
  if(event.target.closest('[data-vault-cloud-forget]'))void vaultCloudForget();
});
window.addEventListener('online',()=>{if(vaultCloudState?.key&&vaultCloudState.revision!==VAULT_CLOUD.revision)void vaultCloudSync(vaultCloudState.key,!!vaultCloudState.remembered);});

init();
handlePackCloudbaseHandoff().finally(()=>startPackCloudSync());
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
}
</script>
