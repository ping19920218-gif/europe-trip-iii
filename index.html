<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--accent:#145a4a;--accent2:#2d6f8e;--terracotta:#b85c38;--gold:#d99a45;--bg:#f3f5f2;--card:#fff;--ink:#202522;--sub:#626b66;--warn:#a53c2c;--feed:#287568}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.5}
body{padding-bottom:64px}
header{position:sticky;top:0;z-index:20;background:#145a4a;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;border-bottom:3px solid #d99a45}
header h1{font-size:18px;font-weight:700}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
.daytabs{position:sticky;top:0;z-index:15;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid #eee;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.daytab{flex:0 0 auto;padding:7px 12px;border-radius:20px;background:#eef0f4;color:#555;font-size:13px;font-weight:600;white-space:nowrap;border:none}
.daytab.on{background:var(--accent);color:#fff}
.daytab small{display:block;font-size:10px;font-weight:400;opacity:.8}
.wrap{padding:14px 14px 24px;max-width:680px;margin:0 auto}
.theme{background:#e8f1ed;border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13px;color:#244e43;margin-bottom:12px}
.warn{background:#fbeae8;border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#a3271c;margin-bottom:12px}
.tl{position:relative;padding-left:8px}
.item{position:relative;display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eef0f4}
.item:last-child{border-bottom:none}
.time{flex:0 0 64px;font-size:12px;font-weight:700;color:var(--accent2);padding-top:2px}
.ic{flex:1}
.ic .t{font-weight:600;font-size:14px}
.ic .d{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.7;white-space:pre-wrap}
.feed{background:#e8f5f7;border-radius:8px;padding:10px 12px;margin-top:14px}
.feed h3{font-size:13px;color:var(--feed);margin-bottom:6px}
.feed div{font-size:12px;color:#3a6a72;padding:2px 0}
.card{background:var(--card);border-radius:8px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h3{font-size:14px;margin-bottom:4px}
.card .meta{font-size:12px;color:var(--sub);white-space:pre-wrap}
.tag{display:inline-block;background:#eef0f4;border-radius:6px;padding:1px 7px;font-size:11px;color:#666;margin:2px 4px 2px 0}
.todo{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f4;font-size:13px}
.todo .bx{flex:0 0 auto}
.pack-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pack-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.pack-sync-status{min-height:18px;margin:-3px 2px 8px;text-align:right;font-size:11.5px;color:#8b8993}
.pack-sync-status.ok{color:var(--feed)}
.pack-sync-status.err{color:#c0392b}
.pack-sync-status.pending{color:#9a6a00}
.pack-sync-btn,.pack-restore{border:1px solid #d9e1dd;background:#fff;color:var(--accent);border-radius:7px;padding:2px 7px;font-size:12px;line-height:1.6}
.pack-sync-btn.on{border-color:#cde8dc;background:#eef8f3;color:var(--feed)}
.pack-restore{display:none}
.pack-restore.on{display:inline-flex;align-items:center;gap:3px}
.pack-card h3{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pack-count{font-size:11px;font-weight:500;color:#999;white-space:nowrap}
.pack-list{margin-top:5px}
.packi{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid #f0f0f4;font-size:12.5px;color:var(--sub);line-height:1.55}
.packi:first-child{border-top:none}
.packi input{flex:0 0 auto;width:18px;height:18px;margin-top:1px;accent-color:var(--feed)}
.pack-text{flex:1;min-width:0;white-space:pre-wrap;outline:none;border-radius:6px;padding:1px 4px;margin:-1px -4px;color:var(--sub)}
.pack-text:focus{background:#fff8e8;box-shadow:inset 0 0 0 1px #bcd5ca;color:#333;text-decoration:none}
.pack-text:empty:before{content:'填写行李项';color:#bbb}
.packi.done .pack-text{text-decoration:line-through;color:#999}
.packi.done .pack-text:focus{text-decoration:none;color:#333}
.pack-del{flex:0 0 auto;width:24px;height:24px;border:none;background:transparent;color:#aaa;border-radius:6px;font-size:19px;line-height:20px;padding:0;margin-top:-2px}
.pack-del:active{background:#e9f2ee;color:var(--accent)}
.pack-add{width:100%;border:1px dashed #c7d8d0;background:#f8fbf9;color:var(--accent);border-radius:8px;padding:7px 10px;margin-top:8px;font-size:12.5px;text-align:left}
.pack-add:active{background:#e9f2ee}
.sec-title{font-size:13px;font-weight:700;color:var(--accent);margin:14px 2px 8px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#fff;border-top:1px solid #e8e8ee;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:none;padding:8px 0 6px;font-size:10px;color:#999}
nav button.on{color:var(--accent)}
nav button .e{display:block;font-size:19px;margin-bottom:1px}
.view{display:none}
.view.on{display:block}
.hide{display:none}
.mapwrap{margin-bottom:12px}
.daymap{height:215px;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08);background:#dfe6e9}
.maplegend{font-size:11.5px;color:#555;margin-top:7px;line-height:1.7}
.maplegend b{color:#333;font-weight:600}
.mapnote{font-size:11px;color:#999;margin-top:3px}
.leaflet-container{font-family:inherit;background:#dfe6e9}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 8px;vertical-align:middle}
.oneliner{background:#eef6f0;border-left:4px solid var(--feed);border-radius:8px;padding:9px 12px;font-size:13px;color:#2c5a4a;margin-bottom:12px;font-weight:600}
.ovbox{margin-bottom:12px}
.ovh{font-size:13px;font-weight:700;color:var(--accent);margin:0 2px 6px}
.ovscroll{overflow-x:auto;border-radius:8px;background:#fff}
.ovt{width:100%;border-collapse:collapse;font-size:12px}
.ovt td{padding:5px 6px;border-bottom:1px solid #eef0f4;vertical-align:top}
.ovt-t{font-weight:700;color:var(--accent2);white-space:nowrap;width:52px}
.ovt-l{display:block;color:#999;font-size:11px;margin-top:1px}
.ovt-tip{color:#a3271c;font-size:11.5px;width:36%}
.lb{color:var(--accent2);font-weight:700}
.ic .d b{color:var(--ink)}
.ic .d b.lb{color:var(--accent2)}
.chk{background:#eef6f0;border-radius:8px;padding:10px 12px;margin-top:14px}
.chkh{font-size:13px;font-weight:700;color:var(--feed);margin-bottom:6px}
.chki{font-size:12.5px;color:#33474f;padding:2px 0}
.baby{background:#e8f5f7;border-radius:8px;padding:10px 12px;margin-top:14px}
.babyh{font-size:13px;font-weight:700;color:var(--feed);margin-bottom:6px}
.babi{font-size:12.5px;color:#33474f;padding:3px 0}
.babi b{color:var(--feed)}
.babf{font-size:12px;color:#3a6a72;padding:1px 0 1px 10px}
.ft{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:5px}
.ft th{background:#d7ebee;padding:4px 5px;text-align:left;font-weight:600;color:#2c5a4a}
.ft td{padding:4px 5px;border-bottom:1px solid #d7ebee;vertical-align:top}
.status{display:inline-flex;align-items:center;border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:700;vertical-align:1px;background:#eef1ef;color:#56615b}
.status.ok{background:#e4f2eb;color:#176447}.status.wait{background:#fff2dc;color:#925600}.status.p0{background:#f9e5e1;color:#a53c2c}
.phase{display:inline-block;margin-left:6px;color:#d8ebe4;font-size:11px;font-weight:500}
.maplink{display:inline-flex;align-items:center;gap:4px;margin-top:8px;border:1px solid #cadbd4;border-radius:7px;padding:5px 8px;color:var(--accent);text-decoration:none;font-size:12px;font-weight:650;background:#f8fbf9}
.maplink:active{background:#e8f1ed}
.filters{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter{flex:0 0 auto;border:1px solid #d8dfdb;background:#fff;color:#65706a;border-radius:7px;padding:6px 10px;font-size:12px}.filter.on{background:var(--accent);border-color:var(--accent);color:#fff}
.source-link{color:var(--accent2);text-decoration:none;overflow-wrap:anywhere}
.todo-main{flex:1;min-width:0}.todo-meta{display:block;margin-top:3px;font-size:11px;color:#8a918d}.todo input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.todo.done .todo-main{text-decoration:line-through;color:#999}.todo.done .todo-meta{text-decoration:none;color:#aaa}
.split-note{background:#fff4e8;border-left:4px solid var(--terracotta);border-radius:8px;padding:9px 12px;color:#87472f;font-size:12.5px;margin-bottom:12px}
@media (min-width:760px){.wrap{max-width:760px}.daymap{height:300px}header h1{font-size:20px}}
@media (max-width:480px){
  .ovt tr{display:grid;grid-template-columns:88px minmax(0,1fr)}
  .ovt td{display:block;width:auto}
  .ovt-tip{grid-column:2;padding-top:0!important;color:var(--warn)}
  nav button{font-size:9px}
  nav button .e{font-size:18px}
}
</style>
<style id="alpine-ios">
:root{
  color-scheme:light dark;
  --accent:#0f6b57;--accent-strong:#0b4f41;--accent-soft:#e5f3ee;
  --action:#0878d1;--terracotta:#b85d3c;--gold:#d39a3c;
  --bg:#f2f2f7;--surface:#ffffff;--surface-2:#f8f8fa;--surface-3:#ececf1;
  --ink:#1c1c1e;--sub:#6e6e73;--muted:#8e8e93;--line:rgba(60,60,67,.16);
  --warn:#c9342f;--warn-bg:#fff0ef;--feed:#17725e;--fallback-bg:#fff7e7;--fallback-ink:#76510a;
  --shadow:0 10px 30px rgba(24,45,38,.08);
  --radius:20px;--radius-sm:13px;--tab-h:58px;
}
html,body{
  background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  font-size:15px;line-height:1.5;text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
html{scroll-behavior:smooth}
body{min-height:100vh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 24px)}
button,input,summary,[contenteditable="true"]{font:inherit}
button,a,summary{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,summary:focus-visible,[contenteditable="true"]:focus-visible{
  outline:3px solid color-mix(in srgb,var(--action) 42%,transparent);outline-offset:2px;
}
header{
  position:relative;z-index:20;color:#fff;
  padding:calc(env(safe-area-inset-top) + 15px) 18px 17px;
  border:0;background:
    radial-gradient(circle at 88% 12%,rgba(255,255,255,.18),transparent 28%),
    linear-gradient(145deg,#0b302a 0%,#0f5144 58%,#146955 100%);
  box-shadow:inset 0 -1px rgba(255,255,255,.12);
}
header:before{content:"EUROPE TRIP III";display:block;margin-bottom:3px;font-size:10px;line-height:1.2;font-weight:700;letter-spacing:.16em;opacity:.7}
header h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;font-size:25px;line-height:1.12;font-weight:760;letter-spacing:-.035em}
header .sub{font-size:12px;line-height:1.35;opacity:.78;margin-top:6px;font-weight:500}
.daytabs{
  position:sticky;top:0;z-index:25;display:flex;gap:8px;overflow-x:auto;
  padding:9px 12px 10px;background:rgba(248,248,250,.86);border-bottom:.5px solid var(--line);
  box-shadow:0 4px 18px rgba(24,45,38,.04);scroll-snap-type:x proximity;
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
}
.daytab{
  min-height:44px;min-width:63px;flex:0 0 auto;padding:6px 12px;border:0;border-radius:15px;
  background:var(--surface-3);color:var(--sub);font-size:13px;font-weight:700;white-space:nowrap;
  scroll-snap-align:center;transition:transform .18s ease,background .18s ease,color .18s ease,box-shadow .18s ease;
}
.daytab:active{transform:scale(.96)}
.daytab.on{background:var(--accent);color:#fff;box-shadow:0 5px 14px rgba(15,107,87,.24)}
.daytab small{font-size:10px;font-weight:540;margin-top:1px;opacity:.78}
.wrap{padding:16px 14px 32px;max-width:760px;margin:0 auto}
.view{animation:ios-in .22s cubic-bezier(.22,.8,.32,1)}
@keyframes ios-in{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.mapwrap{margin-bottom:16px}
.daymap{height:235px;border-radius:var(--radius);border:.5px solid var(--line);box-shadow:var(--shadow);background:#dce4e3}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 8px;margin:9px 2px 0;font-size:11.5px;color:var(--sub);line-height:1.55}
.maplegend span{display:inline-flex;align-items:center}
.maplegend .dot{margin-left:0}
.mapnote{margin:4px 2px 0;font-size:10.5px;color:var(--muted)}
.leaflet-control-zoom{border:0!important;box-shadow:0 3px 14px rgba(0,0,0,.16)!important}
.leaflet-control-zoom a{width:36px!important;height:36px!important;line-height:36px!important;border-color:var(--line)!important;color:#1c1c1e!important}
.theme,.oneliner,.warn,.split-note,.chk,.feed,.baby{
  border:0;border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:12px;box-shadow:none;
}
.theme{background:var(--surface);color:var(--ink);border-left:4px solid var(--accent);font-size:13px;line-height:1.6}
.phase{color:var(--feed);font-size:11px;background:var(--accent-soft);padding:2px 7px;border-radius:99px;vertical-align:1px}
.oneliner{background:var(--accent-soft);color:var(--accent-strong);font-size:13px;font-weight:700;border-left:0}
.warn{background:var(--warn-bg);color:var(--warn);font-size:12.5px;border-left:4px solid var(--warn)}
.split-note{background:#fff4e8;color:#834830;border-left:4px solid var(--terracotta)}
.chk,.feed,.baby{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.chkh,.feed h3,.babyh{font-size:13px;color:var(--feed);margin-bottom:6px}
.chki,.feed div,.babi{font-size:12.5px;color:var(--sub);padding:3px 0}
.ovbox{margin:14px 0 16px}
.ovh,.sec-title{font-size:13px;font-weight:730;letter-spacing:.01em;color:var(--sub);margin:18px 5px 8px}
.view>.sec-title:first-child{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;font-size:28px;line-height:1.1;letter-spacing:-.035em;color:var(--ink);margin:4px 3px 17px}
.ovscroll{overflow:hidden;border-radius:var(--radius);background:var(--surface);border:.5px solid var(--line);box-shadow:0 5px 18px rgba(24,45,38,.045)}
.ovt{font-size:12px}
.ovt td{padding:9px 10px;border-bottom:.5px solid var(--line)}
.ovt tr:last-child td{border-bottom:0}
.ovt-t{color:var(--action);font-variant-numeric:tabular-nums;width:72px}
.ovt-l{color:var(--muted)}
.ovt-tip{color:var(--warn)}
.tl{padding:0;background:var(--surface);border:.5px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 5px 18px rgba(24,45,38,.045)}
.item{gap:12px;padding:14px 15px;border-bottom:.5px solid var(--line);align-items:flex-start}
.time{flex:0 0 76px;font-size:12px;color:var(--action);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ic .t{font-size:15px;line-height:1.35;font-weight:690;letter-spacing:-.012em;color:var(--ink)}
.ic .d{font-size:12.5px;line-height:1.65;color:var(--sub);margin-top:7px}
.ic .d b{color:var(--ink)}.ic .d b.lb,.lb{color:var(--action)}
.ic .d.itinerary-details{display:flex;flex-direction:column;gap:0;margin-top:9px;white-space:normal}
.it-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:5px}
.it-kind{display:inline-flex;align-items:center;min-height:23px;padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--sub);font-size:10.5px;font-weight:700}
.it-field{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;border-top:.5px solid var(--line)}
.it-field.it-place{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"label nav" "value value";gap:4px 8px;align-items:center}
.it-place .it-label{grid-area:label}.it-place .it-value{grid-area:value}.it-place .it-nav{grid-area:nav}
.it-label{color:var(--muted)!important;font-size:11px;font-weight:650!important;letter-spacing:.01em}
.it-value{min-width:0;color:var(--ink);overflow-wrap:anywhere}
.it-nav{display:inline-flex;align-items:center;justify-content:center;min-width:50px;min-height:36px;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--action) 11%,var(--surface));color:var(--action);font-size:11.5px;font-weight:720;text-decoration:none}
.it-nav:active{background:color-mix(in srgb,var(--action) 19%,var(--surface));transform:scale(.97)}
.it-guidance,.it-fallback{display:block;margin-top:7px;padding:10px 11px;border-radius:12px}
.it-guidance{background:var(--accent-soft);color:var(--accent-strong)}
.it-fallback{background:var(--fallback-bg);color:var(--fallback-ink)}
.it-guidance .it-label,.it-fallback .it-label{display:block;margin-bottom:2px;color:inherit!important}
.it-guidance .it-value,.it-fallback .it-value{display:block;color:inherit}
.it-copy{display:block;padding:3px 0;color:var(--sub)}
.item.flight-item{display:block}
.flight-times{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:8px;align-items:center;margin:12px 0 4px;padding:13px 12px;border-radius:12px;background:var(--accent-soft)}
.flight-end{min-width:0;color:var(--ink)}
.flight-label{display:block;font-size:11px;color:var(--sub);font-weight:650}
.flight-clock{display:block;font-size:28px;line-height:1.25;letter-spacing:-.025em;font-weight:750;font-variant-numeric:tabular-nums;color:var(--accent-strong)}
.flight-date,.flight-airport{display:block;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.flight-date{margin-top:4px;color:var(--sub)}
.flight-airport{font-weight:650}
.flight-arrow{color:var(--accent);text-align:center;font-size:18px}
.flight-offset{display:inline-block;margin-left:5px;padding:0 5px;border-radius:5px;background:var(--surface);color:var(--accent-strong);font-size:10px;font-weight:700}
.flight-time-note{margin:5px 0 9px;color:var(--sub);font-size:11px;line-height:1.5}
.flight-overview-line{display:block;white-space:nowrap;line-height:1.65}
.flight-overview-line small{margin-right:3px;color:var(--sub);font-size:10px;font-weight:500}
.flight-overview-date{display:block;white-space:normal;font-size:10px;color:var(--sub);font-weight:500}
.parking-plan{margin:0 0 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.parking-head{padding:14px 15px;background:var(--accent-soft);color:var(--accent-strong)}
.parking-head h3{font-size:15px;margin:0 0 3px}.parking-head p{font-size:12px;margin:0;line-height:1.55}
.parking-stop{padding:14px 15px;border-top:1px solid var(--line);overflow-wrap:anywhere}

.parking-place{min-width:0;font-size:12px}.parking-place strong{font-size:13px;line-height:1.5;display:block}

.parking-more{font-size:12px;color:var(--sub);margin-top:9px}.parking-more summary{cursor:pointer;color:var(--action);padding:6px 0}

.parking-daylinks{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 15px}.parking-daylinks a{padding:7px 10px;border-radius:9px;background:var(--surface-3);color:var(--ink);font-size:12px;text-decoration:none}
.parking-plan[id]{scroll-margin-top:100px}
.card{
  background:var(--surface);border:.5px solid var(--line);border-radius:var(--radius);

}
.card h3{

  -webkit-line-clamp:unset;-webkit-box-orient:initial;
}
.card .meta{font-size:12.5px;line-height:1.68;color:var(--sub)}
.tag{background:var(--surface-3);color:var(--sub);border-radius:99px;padding:2px 8px;font-size:10.5px;margin:2px 3px 2px 0}

.maplink{

}
.maplink:active{background:color-mix(in srgb,var(--action) 18%,var(--surface));transform:scale(.98)}
.filters{gap:8px;margin:0 0 13px;padding:1px;scroll-snap-type:x proximity}
.filter{min-height:38px;border:0;background:var(--surface-3);color:var(--sub);border-radius:12px;padding:7px 13px;font-size:12px;font-weight:650;scroll-snap-align:start}
.filter.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(15,107,87,.18)}
.source-link{color:var(--action);text-underline-offset:3px}
details.card summary{min-height:28px;cursor:pointer;color:var(--ink);list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary:after{content:"";float:right;width:8px;height:8px;margin:5px 3px 0 10px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .18s ease}
details[open].card summary:after{transform:rotate(225deg);margin-top:9px}
.todo{gap:11px;padding:11px 0;border-bottom:.5px solid var(--line);font-size:13px}
.todo input,.packi input{width:21px;height:21px;accent-color:var(--accent)}
.todo-meta{color:var(--muted);line-height:1.5}
.pack-sync-btn,.pack-restore{min-height:34px;border:0;background:var(--surface-3);color:var(--action);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:650}
.pack-sync-btn.on{background:var(--accent-soft);color:var(--feed)}
.pack-sync-status{color:var(--muted)}
.packi{min-height:44px;gap:10px;padding:10px 0;border-top:.5px solid var(--line);font-size:13px;color:var(--sub)}
.pack-text{border-radius:8px}.pack-text:focus{background:#fff6dc;box-shadow:inset 0 0 0 1px #e1c46f;color:#252525}
.pack-del{width:32px;height:32px;border-radius:50%;color:var(--muted)}
.pack-del:active{background:var(--surface-3);color:var(--warn)}
.pack-add{min-height:44px;border:0;background:var(--surface-2);color:var(--action);border-radius:12px;padding:10px 12px;font-weight:650;text-align:center}
nav{

  box-shadow:0 -6px 22px rgba(24,45,38,.055);
}
nav button{min-width:0;min-height:var(--tab-h);padding:6px 2px 4px;color:var(--muted);font-size:10px;font-weight:580;transition:color .16s ease,transform .16s ease}
nav button:active{transform:scale(.93)}
nav button.on{color:var(--accent)}
nav button .e{display:block;height:27px;margin:0 auto 1px;font-size:0}
nav button .e svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.more-hero{padding:4px 3px 14px}
.more-hero h2{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;font-size:30px;letter-spacing:-.04em;line-height:1.08}

.more-tile{

  color:var(--ink);padding:15px;text-align:left;box-shadow:0 5px 18px rgba(24,45,38,.045);

}
.more-tile:active{transform:scale(.975);background:var(--surface-2)}
.more-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:18px;margin-bottom:16px}
.more-tile strong{display:block;font-size:15px;letter-spacing:-.012em}.more-tile small{display:block;color:var(--sub);font-size:11px;line-height:1.35;margin-top:3px}
.more-tile.sos .more-icon{background:var(--warn-bg);color:var(--warn)}
.hide{display:none!important}
@media (min-width:760px){

  .daymap{height:320px}.more-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.more-tile{min-height:132px}

  body{padding-bottom:92px}

}
@media (prefers-color-scheme:dark){

  .leaflet-tile-pane{filter:brightness(.72) saturate(.82) contrast(1.12)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

function decodePackCloudbaseHandoff(raw){

  while(s.length%4) s+='=';
  const bytes=atob(s);
  const json=decodeURIComponent(Array.prototype.map.call(bytes,ch=>'%'+('00'+ch.charCodeAt(0).toString(16)).slice(-2)).join(''));
  const payload=JSON.parse(json);

}

async function ensurePackCloud(){
  if(PACK_SYNC.ready) return;
  if(PACK_SYNC.starting) return PACK_SYNC.starting;
  PACK_SYNC.starting=(async()=>{
    if(!window.cloudbase) throw new Error('CloudBase SDK 未加载');
    PACK_SYNC.app=cloudbase.init({env:PACK_SYNC_CFG.env,region:PACK_SYNC_CFG.region});
    const auth=PACK_SYNC.app.auth({persistence:'local'});
    let signedIn=false;
    try{ signedIn=!!(auth.getLoginState ? await auth.getLoginState() : null); }catch(e){ signedIn=false; }
    if(!signedIn){
      const r=await auth.signInAnonymously();
      if(r&&r.error) throw new Error('CloudBase 匿名登录失败：'+(r.error.message||r.error));
    }
    PACK_SYNC.ready=true;
  })().catch(e=>{ PACK_SYNC.starting=null; throw e; });
  return PACK_SYNC.starting;
}
async function ensurePackBridge(){
  if(!packCanUseBridge()) throw new Error('当前页面不需要云同步桥接');
  if(PACK_SYNC.bridgeReady && packBridgeTarget()) return;
  if(PACK_SYNC.bridgeStarting) return PACK_SYNC.bridgeStarting;
  PACK_SYNC.bridgeStarting = new Promise((resolve,reject)=>{
    let done=false;
    let timer=null;
    const hasPopup=!!(PACK_SYNC.bridgeWindow && !PACK_SYNC.bridgeWindow.closed);
    const cleanup=()=>{
      if(timer) clearTimeout(timer);
      window.removeEventListener('message', onMessage);
    };
    const onMessage=(event)=>{
      if(event.origin!==PACK_BRIDGE_ORIGIN || event.source!==packBridgeTarget()) return;
      const msg=event.data||{};
      if(msg.type!=='pack-cloud-bridge-ready') return;
      done=true;
      cleanup();
      PACK_SYNC.bridgeReady=true;
      resolve();
    };
    window.addEventListener('message', onMessage);
    if(hasPopup){
      try{ PACK_SYNC.bridgeWindow.postMessage({type:'pack-cloud-bridge-ping'}, PACK_BRIDGE_ORIGIN); }catch(e){}
    }else{
      let frame=PACK_SYNC.bridge;
      if(!frame || !frame.contentWindow){
        frame=document.createElement('iframe');
        frame.setAttribute('aria-hidden','true');
        frame.style.cssText='position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;border:0;opacity:0;pointer-events:none;';
        document.body.appendChild(frame);
        PACK_SYNC.bridge=frame;
      }
      frame.src=PACK_BRIDGE_URL+'?v=1&ts='+Date.now();
    }
    timer=setTimeout(()=>{
      if(done) return;
      cleanup();
      PACK_SYNC.bridgeStarting=null;
      reject(new Error(hasPopup ? '云同步桥接超时，请在弹窗里点“确定访问”后回到本页' : '云同步桥接超时，请先打开云同步授权页点“确定访问”'));
    },hasPopup?45000:12000);
  }).catch(e=>{ PACK_SYNC.bridgeReady=false; throw e; });
  return PACK_SYNC.bridgeStarting;
}
async function packBridgeCall(op, extra){
  await ensurePackBridge();
  const target=packBridgeTarget();
  if(!target) throw new Error('云同步桥接未连接');
  const id='pack-'+(++PACK_SYNC.bridgeSeq)+'-'+Date.now().toString(36);
  return new Promise((resolve,reject)=>{
    let timer=null;
    const cleanup=()=>{
      if(timer) clearTimeout(timer);
      window.removeEventListener('message', onMessage);
    };
    const onMessage=(event)=>{
      if(event.origin!==PACK_BRIDGE_ORIGIN || event.source!==target) return;
      const msg=event.data||{};
      if(msg.type!=='pack-cloud-response' || msg.id!==id) return;
      cleanup();
      if(msg.ok) resolve(msg.data||{});
      else reject(new Error((msg.error&&msg.error.message)||'云同步桥接失败'));
    };
    window.addEventListener('message', onMessage);
    timer=setTimeout(()=>{
      cleanup();
      reject(new Error('云同步桥接超时，请先打开云同步授权页点“确定访问”'));
    },15000);
    target.postMessage({type:'pack-cloud-call', id, op, extra:extra||{}}, PACK_BRIDGE_ORIGIN);
  });
}
async function packCloudCall(op,extra){
  // The existing CloudBase-hosted bridge owns the family connection.
  // Public GitHub Pages assets must not carry its credentials.
  if(packCanUseBridge()) return packBridgeCall(op,extra);
  throw new Error('请从欧洲行程主页连接云同步');
}
async function fetchCloudPackState(){
  const data=await packCloudCall('getSetting',{key:PACK_SYNC_CFG.settingKey});
  return normalizeCloudPackState(data);
}
function normalizeCloudPackState(raw){
  let data=raw;
  if(data&&typeof data==='object'&&typeof data.value==='string'&&!data.items) data=data.value;
  if(typeof data==='string'){
    try{ data=JSON.parse(data); }catch(e){ data={}; }
  }
  if(!data||typeof data!=='object'||Array.isArray(data)) data={};
  const items={};
  const meta={};
  const fallbackTs=String(data.updatedAt||'');
  const fallbackBy=String(data.updatedBy||'');
  Object.entries(data.items||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)&&v!=null) items[k]=String(v);
  });
  Object.entries(data.meta||{}).forEach(([k,v])=>{
    if(!isPackingStorageKey(k)||!v||typeof v!=='object'||Array.isArray(v)) return;
    meta[k]={ts:String(v.ts||fallbackTs),by:String(v.by||fallbackBy),deleted:!!v.deleted};
  });
  Object.keys(items).forEach(k=>{
    if(!meta[k]) meta[k]={ts:fallbackTs,by:fallbackBy,deleted:false};
    else meta[k].deleted=false;
  });
  Object.entries(meta).forEach(([k,v])=>{
    if(v.deleted) delete items[k];
  });
  return {version:2,items,meta,updatedAt:fallbackTs,updatedBy:fallbackBy};
}
function packCloudHasAny(cloud){
  const data=normalizeCloudPackState(cloud);
  return !!(Object.keys(data.items).length||Object.keys(data.meta).length);
}
function makeCloudPackState(items,meta,updatedBy){
  const cleanItems={};
  const cleanMeta={};
  const now=packIsoNow();
  Object.entries(items||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)&&v!=null) cleanItems[k]=String(v);
  });
  const keys=new Set([...Object.keys(cleanItems),...Object.keys(meta||{})]);
  keys.forEach(k=>{
    if(!isPackingStorageKey(k)) return;
    const m=(meta&&meta[k])||{};
    const exists=Object.prototype.hasOwnProperty.call(cleanItems,k);
    cleanMeta[k]={ts:String(m.ts||now),by:String(m.by||updatedBy||packDeviceId()),deleted:exists?false:!!m.deleted};
  });
  return {version:2,items:cleanItems,meta:cleanMeta,updatedAt:now,updatedBy:updatedBy||packDeviceId()};
}
function makeCloudPackStateFromLocalItems(items,ts,by){
  const meta={};
  const stamp=ts||packIsoNow();
  const device=by||packDeviceId();
  Object.entries(items||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)&&v!=null) meta[k]={ts:stamp,by:device,deleted:false};
  });
  return makeCloudPackState(items,meta,device);
}
function mergePackPendingIntoCloud(cloud,pending){
  const base=normalizeCloudPackState(cloud);
  const normalized=normalizePackPendingObject(pending).changes;
  const items={...(base.items||{})};
  const meta={...(base.meta||{})};
  const applied={};
  const skipped={};
  Object.entries(normalized).forEach(([k,entry])=>{
    if(!isPackingStorageKey(k)) return;
    const current=meta[k]||{};
    const incomingMs=packTimestampMs(entry.ts);
    const currentMs=packTimestampMs(current.ts);
    if(!current.ts||incomingMs>=currentMs){
      if(entry.value==null){
        delete items[k];
        meta[k]={ts:entry.ts,by:entry.by,deleted:true};
      }else{
        items[k]=String(entry.value);
        meta[k]={ts:entry.ts,by:entry.by,deleted:false};
      }
      applied[k]=entry;
    }else{
      skipped[k]=entry;
    }
  });
  return {state:makeCloudPackState(items,meta,packDeviceId()),applied,skipped};
}
function splitPackPendingByCloud(cloud,pending){
  const latest=normalizeCloudPackState(cloud);
  const normalized=normalizePackPendingObject(pending).changes;
  const verified={};
  const retry={};
  Object.entries(normalized).forEach(([k,entry])=>{
    const current=latest.meta[k];
    if(!current){
      retry[k]=entry;
      return;
    }
    const currentMs=packTimestampMs(current.ts);
    const entryMs=packTimestampMs(entry.ts);
    if(currentMs>entryMs){
      verified[k]=entry;
      return;
    }
    if(currentMs<entryMs){
      retry[k]=entry;
      return;
    }
    if(entry.value==null){
      if(current.deleted||!Object.prototype.hasOwnProperty.call(latest.items,k)) verified[k]=entry;
      else retry[k]=entry;
    }else if(!current.deleted&&latest.items[k]===String(entry.value)){
      verified[k]=entry;
    }else{
      retry[k]=entry;
    }
  });
  return {verified,retry,latest};
}
function packSleep(ms){
  return new Promise(resolve=>setTimeout(resolve,ms));
}
async function saveCloudPackState(state){
  const normalized=normalizeCloudPackState(state);
  const value=makeCloudPackState(normalized.items,normalized.meta,packDeviceId());
  await packCloudCall('setSetting',{key:PACK_SYNC_CFG.settingKey,value:JSON.stringify(value)});

}
async function handlePackCloudbaseHandoff(){
  if(packCanUseBridge()) return false;
  const params=new URLSearchParams(location.search||'');
  const raw=params.get('handoff');
  if(!raw) return false;
  try{
    const cleanUrl=location.pathname+(params.has('v')?'?v='+encodeURIComponent(params.get('v')):'');
    history.replaceState(null,'',cleanUrl);
  }catch(e){}
  try{
    const payload=decodePackCloudbaseHandoff(raw);
    if(!payload) return false;
    if(payload.mode==='replace'){
      setPackSyncStatus('正在用本机清单更新云端…','pending');
      const items={};
      Object.entries(payload.items||{}).forEach(([k,v])=>{
        if(isPackingStorageKey(k)&&v!=null) items[k]=String(v);
      });
      if(Object.keys(items).length){
        const data=await saveCloudPackState(makeCloudPackStateFromLocalItems(items,payload.createdAt,payload.updatedBy));
        applyCloudPackState(data.items||{},true);
        savePendingPackChanges({});
        setPackSyncStatus(`已用本机清单更新云端 ${packNowLabel()}`,'ok');
      }else{
        setPackSyncStatus('本机没有可上传的行李改动','err');
      }
      return true;
    }
    if(payload.mode==='push'){
      setPackSyncStatus('正在保存手机清单到云端…','pending');
      const pending=normalizePackPendingObject(payload.pending||{},payload.createdAt).changes;
      let pushed=false;
      if(Object.keys(pending).length){
        savePendingPackChanges({...pendingPackChanges(),...pending});
        pushed=await flushPackCloudPending();
      }else{
        const cloud=await fetchCloudPackState();
        const localItems={};
        Object.entries(payload.items||{}).forEach(([k,v])=>{
          if(isPackingStorageKey(k)&&v!=null) localItems[k]=String(v);
        });
        if(!packCloudHasAny(cloud)&&Object.keys(localItems).length){
          const bootstrap={};
          Object.entries(localItems).forEach(([k,v])=>{ bootstrap[k]=packChangeEntry(v,payload.createdAt,payload.updatedBy); });
          savePendingPackChanges(bootstrap);
          pushed=await flushPackCloudPending();
        }else{
          applyCloudPackState(cloud.items||{},true);
        }
      }
      if(pushed) setPackSyncStatus(`已上传到云端 ${packNowLabel()}`,'ok');
      else if(!Object.keys(pendingPackChanges()).length) setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
      return true;
    }
    setPackSyncStatus('正在从云端读取…','pending');
    const data=await fetchCloudPackState();
    applyCloudPackState(data.items||{},true);
    setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
    return true;
  }catch(e){
    console.warn('[pack-sync] handoff failed', e);
    setPackSyncStatus('云同步接力失败，请再点一次','err');
    return true;
  }
}
function applyCloudPackState(items,prune){
  const keep=new Set(Object.keys(items||{}).filter(isPackingStorageKey));
  PACK_SYNC.applying=true;
  try{
    Object.entries(items||{}).forEach(([k,v])=>{
      if(!isPackingStorageKey(k)) return;
      localStorage.setItem(k,String(v));
    });
    if(prune){
      packStorageKeys().forEach(k=>{
        if(!keep.has(k)) localStorage.removeItem(k);
      });
    }
  }catch(e){
    console.warn('[pack-sync] apply failed', e);
  }finally{
    PACK_SYNC.applying=false;
  }
  const active=document.activeElement;
  if(!(active&&active.classList&&active.classList.contains('pack-text'))) renderTodos();
}
function queuePackCloudPatch(changes){
  if(PACK_SYNC.applying) return;
  const filtered={};
  const ts=packIsoNow();
  Object.entries(changes||{}).forEach(([k,v])=>{
    if(isPackingStorageKey(k)) filtered[k]=packChangeEntry(v,ts,packDeviceId());
  });
  if(!Object.keys(filtered).length) return;
  const pending={...pendingPackChanges(),...filtered};
  savePendingPackChanges(pending);
  setPackSyncStatus('待同步到另一台手机','pending');
  if(PACK_SYNC.timer) clearTimeout(PACK_SYNC.timer);
  PACK_SYNC.timer=setTimeout(()=>{ flushPackCloudPending().catch(()=>{}); },700);
}
async function flushPackCloudPending(){
  if(PACK_SYNC.flushing) return false;
  const changes=pendingPackChanges();
  if(!Object.keys(changes).length) return true;
  PACK_SYNC.flushing=true;
  setPackSyncStatus('正在同步…','pending');
  try{
    const cloud=await fetchCloudPackState();
    const merged=mergePackPendingIntoCloud(cloud,changes);
    await saveCloudPackState(merged.state);
    await packSleep(300);
    let split=splitPackPendingByCloud(await fetchCloudPackState(),changes);
    if(Object.keys(split.retry).length){
      const retryMerged=mergePackPendingIntoCloud(split.latest,split.retry);
      await saveCloudPackState(retryMerged.state);
      await packSleep(450);
      split=splitPackPendingByCloud(await fetchCloudPackState(),changes);
    }
    const remaining=clearFlushedPackChanges(split.verified);
    if(Object.keys(remaining).length){
      setPackSyncStatus('还有新改动待同步','pending');
      if(PACK_SYNC.timer) clearTimeout(PACK_SYNC.timer);
      PACK_SYNC.timer=setTimeout(()=>{ flushPackCloudPending().catch(()=>{}); },350);
      return false;
    }
    applyCloudPackState(split.latest.items||{},true);
    setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
    return true;
  }catch(e){
    console.warn('[pack-sync] flush failed', e);
    setPackSyncStatus(packSyncErrorText(e,'云同步暂不可用，本机已保存'),'err');
    return false;
  }finally{
    PACK_SYNC.flushing=false;
  }
}
async function replacePackCloudWithLocal(manual){
  if(!STATE.packing||!STATE.packing.length) return;
  const localItems=readLocalPackState();
  if(!Object.keys(localItems).length){
    setPackSyncStatus('本机没有可上传的行李改动','err');
    return;
  }
  if(manual&&!confirm('这会以本机行李清单覆盖云端，另一台手机下次同步会跟随。本机确定是最新版才继续。')) return;
  setPackSyncStatus('正在用本机清单更新云端…','pending');
  try{
    if(packCanUseBridge()){
      preparePackBridgeInteractive();
      PACK_SYNC.bridgePreferred=true;
      await ensurePackBridge();
    }else{
      await ensurePackCloud();
    }
    const data=await saveCloudPackState(makeCloudPackStateFromLocalItems(localItems,packIsoNow(),packDeviceId()));
    applyCloudPackState(data.items||{},true);
    savePendingPackChanges({});
    setPackSyncStatus(`已用本机清单更新云端 ${packNowLabel()}`,'ok');
  }catch(e){
    console.warn('[pack-sync] replace failed', e);
    setPackSyncStatus(packSyncErrorText(e,'云同步暂不可用，本机可继续改'),'err');
  }
}
async function syncPackCloudNow(manual){
  if(!STATE.packing||!STATE.packing.length) return;
  if(packCanUseBridge()&&!manual&&!PACK_SYNC.bridgeReady){
    setPackSyncStatus('点“家庭同步”，在弹窗中点“确定访问”（首次一次）','pending');
    return;
  }
  if(manual) setPackSyncStatus('正在同步…','pending');
  try{
    if(packCanUseBridge()){
      if(manual) preparePackBridgeInteractive();
      PACK_SYNC.bridgePreferred=true;
      await ensurePackBridge();
    }else{
      await ensurePackCloud();
    }
    const flushed=await flushPackCloudPending();
    if(!flushed) return;
    const data=await fetchCloudPackState();
    const cloudItems=data.items||{};
    const localItems=readLocalPackState();
    if(!packCloudHasAny(data) && Object.keys(localItems).length){
      queuePackCloudPatch(localItems);
      await flushPackCloudPending();
    }else{
      applyCloudPackState(cloudItems,true);
      setPackSyncStatus(`已云同步 ${packNowLabel()}`,'ok');
    }
  }catch(e){
    console.warn('[pack-sync] sync failed', e);
    setPackSyncStatus(packSyncErrorText(e,'云同步暂不可用，本机可继续改'),'err');
  }
}
function startPackCloudSync(){
  if(!STATE.packing||!STATE.packing.length) return;
  setPackSyncStatus('正在连接云同步…','pending');

  window.addEventListener('online',()=>syncPackCloudNow(false));
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') syncPackCloudNow(false); });
  setInterval(()=>{ if(document.visibilityState==='visible') syncPackCloudNow(false); },12000);
}

const COMMON_ZH_RE = new RegExp(
  Object.keys(COMMON_ZH).sort((a,b)=>b.length-a.length)
    .map(s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),
  'g'
);
function bilingualize(t){
  return (t==null?'':String(t)).replace(COMMON_ZH_RE,m=>`${m} ${COMMON_ZH[m]}`);
}
function escRaw(t){return (t==null?'':String(t)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function esc(t){return escRaw(bilingualize(t));}
function escAttr(t){return escRaw(t).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtLine(s){s=s.replace(/^(一句话|类型|状态|地点|导航|地址|怎么做|关键|营业|费用|耗时|停车|预订|执行|注意|可选|备选|路线|起点|终点|车程|距离|高速费|推荐路线|截止|固定项)(：)/,'<b class="lb">$1$2</b>');return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function fmtDesc(d){let t=esc(d);t=t.replace(/\s*(⚠|🚨|▸|💡|✅)/g,'\n$1');return t.split(/[。；;\n]+/).map(s=>s.trim()).filter(Boolean).map(fmtLine).join('<br>');}
function fmtItinText(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');}
function fmtItinLine(raw){
  const s=String(raw||'').trim(); if(!s)return '';
  let m=s.match(/^类型[：:]\s*(.+?)(?:\s*｜\s*状态[：:]\s*(.+))?$/);
  if(m){
    const state=m[2]||'';
    return `<span class="it-meta"><span class="it-kind">${fmtItinText(m[1])}</span>${state?`<span class="status ${statusClass(state)}">${fmtItinText(state)}</span>`:''}</span>`;
  }
  m=s.match(/^(一句话|状态|地点|导航|首选停车|满位备选|备选说明|预约说明|地址|怎么做|关键|营业|费用|耗时|停车|预订|执行|注意|可选|备选|路线|起点|终点|车程|距离|高速费|推荐路线|截止|固定项)[：:]\s*(.*)$/);
  if(!m)return `<span class="it-copy">${fmtItinText(s)}</span>`;
  const key=m[1],value=m[2];
  const names={导航:'地点',耗时:'预计用时',执行:'行程要点',备选:'如有变化'};
  const label=names[key]||key;
  if(['导航','首选停车','满位备选'].includes(key)){
    return `<span class="it-field it-place"><b class="it-label">${label}</b><span class="it-value">${fmtItinText(value)}</span><a class="it-nav" href="${escAttr(googleMapsUrl(value))}" target="_blank" rel="noopener" aria-label="导航到 ${escAttr(value)}">导航</a></span>`;
  }
  const cls=key==='执行'?'it-guidance':key==='备选'?'it-fallback':'it-field';
  return `<span class="${cls}"><b class="it-label">${label}</b><span class="it-value">${fmtItinText(value)}</span></span>`;
}
function fmtItinDesc(d){return String(d||'').split(/\r?\n/).map(fmtItinLine).join('');}
function statusClass(s){const v=String(s||'');if(v.includes('已确认')||v.includes('已订')||v.includes('已覆盖')||v.includes('已完成'))return 'ok';if(v.includes('等待')||v.includes('待回复')||v.includes('已联系'))return 'reply';if(v.includes('P0'))return 'p0';if(v.includes('待')||v.includes('临近')||v.includes('条件'))return 'wait';return '';}
function googleMapsUrl(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(String(q||''));}
function hashStr(s){let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0).toString(36);}
function packKey(cat,item){return 'europe3-pack:'+hashStr(`${cat}|${item}`);}
function packDeletedKey(key){return key+':deleted';}
function packTextKey(key){return key+':text';}
function packCustomKey(catIndex){return `europe3-pack-custom:${catIndex}`;}
function packCustomItemKey(catIndex,id){return `europe3-pack:custom:${catIndex}:${id}`;}
function loadChecked(key){try{return localStorage.getItem(key)==='1';}catch(e){return false;}}
function saveChecked(key,checked){try{const v=checked?'1':'0'; localStorage.setItem(key,v); queuePackCloudPatch({[key]:v});}catch(e){}}
function loadDeleted(key){try{return localStorage.getItem(packDeletedKey(key))==='1';}catch(e){return false;}}
function saveDeleted(key,deleted){try{const dk=packDeletedKey(key); if(deleted)localStorage.setItem(dk,'1');else localStorage.removeItem(dk); queuePackCloudPatch({[dk]:deleted?'1':null});}catch(e){}}
function cleanPackText(t){return String(t||'').replace(/\s+/g,' ').trim();}
function loadPackText(key,fallback){try{const v=localStorage.getItem(packTextKey(key)); return v==null ? String(fallback||'') : v;}catch(e){return String(fallback||'');}}
function savePackText(key,text,fallback){
  const orig=String(fallback||'');
  const v=cleanPackText(text);
  try{
    const tk=packTextKey(key);
    if(!v || v===orig){localStorage.removeItem(tk); queuePackCloudPatch({[tk]:null});}
    else{localStorage.setItem(tk,v); queuePackCloudPatch({[tk]:v});}
  }catch(e){}
  return v || orig;
}
function loadCustomItems(catIndex){
  try{
    const raw=localStorage.getItem(packCustomKey(catIndex));
    const arr=raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr.filter(x=>x&&x.id).map(x=>({id:String(x.id),text:String(x.text||'')})) : [];
  }catch(e){return [];}
}
function saveCustomItems(catIndex,items){try{const k=packCustomKey(catIndex); const v=JSON.stringify(items); localStorage.setItem(k,v); queuePackCloudPatch({[k]:v});}catch(e){}}
function addCustomItem(catIndex,text){
  const items=loadCustomItems(catIndex);
  const id=`${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
  const item={id,text:cleanPackText(text)||'新增行李项'};
  items.push(item);
  saveCustomItems(catIndex,items);
  return {key:packCustomItemKey(catIndex,id),item};
}
function removeCustomItem(catIndex,key){
  const prefix=`europe3-pack:custom:${catIndex}:`;
  const id=String(key||'').startsWith(prefix) ? String(key).slice(prefix.length) : '';
  if(!id) return false;
  const items=loadCustomItems(catIndex).filter(x=>x.id!==id);
  saveCustomItems(catIndex,items);
  try{localStorage.removeItem(key);localStorage.removeItem(packTextKey(key));localStorage.removeItem(packDeletedKey(key));}catch(e){}
  queuePackCloudPatch({[key]:null,[packTextKey(key)]:null,[packDeletedKey(key)]:null});
  return true;
}

function chooseInitialDay(){
  const today=new Date();
  const local=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const match=(STATE.days||[]).find(d=>d.date===local);
  return match ? match.n : 0;
}

function renderDayMap(d){
  if(window.LMAP){try{window.LMAP.remove();}catch(e){} window.LMAP=null;}
  const pts=(d.map||[]); if(!pts.length || !window.L || !document.getElementById('daymap')) return;
  const map=L.map('daymap',{zoomControl:true,attributionControl:false,scrollWheelZoom:false});
  window.LMAP=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:17,crossOrigin:true}).addTo(map);
  const kc={hotel:'#145a4a',sight:'#287568',food:'#b85c38',transit:'#2d6f8e'};
  const ll=[];
  pts.forEach((p,i)=>{
    const c=kc[p.kind]||'#555';
    const ic=L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],html:
      `<div style="background:${c};color:#fff;width:24px;height:24px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45)"><span style="transform:rotate(45deg);font-size:12px;font-weight:700">${i+1}</span></div>`});
    L.marker([p.lat,p.lng],{icon:ic}).addTo(map).bindPopup(`${i+1}. ${esc(p.label)}`);
    ll.push([p.lat,p.lng]);
  });
  if(ll.length>1) L.polyline(ll,{color:'#145a4a',weight:3,opacity:.55,dashArray:'7,7'}).addTo(map);
  const fit=()=>{ try{ if(ll.length>1) map.fitBounds(L.latLngBounds(ll),{paddingTopLeft:[34,34],paddingBottomRight:[34,34],maxZoom:13}); else map.setView(ll[0],12); }catch(e){ map.setView(ll[0]||[46,12],7); } };
  fit();
  // 容器尺寸/瓦片稳定后再 invalidateSize+重新 fit, 防止首帧高度未定导致 marker 被切到框外
  setTimeout(()=>{ try{ map.invalidateSize(); fit(); }catch(e){} },200);
  setTimeout(()=>{ try{ map.invalidateSize(); fit(); }catch(e){} },550);
}

function findFlightSchedule(dayDate,title){
  const text=String(title||'');
  const flight=(STATE.bookings_summary?.flights||[]).find(f=>{
    const schedule=f.schedule;
    return schedule && schedule.departure.date===dayDate &&
      (text===schedule.number || text.startsWith(schedule.number+' '));
  });
  return flight?.schedule || null;
}
function flightArrivalDay(schedule){
  const offset=schedule.arrivalDayOffset;

function renderFlightTimes(schedule){

function renderOverviewTime(time,schedule){

function renderBookings(filter){
  if(filter) bookingFilter=filter;
  const rows=STATE.bookings||[];
  const isDone=b=>['已确认','已订','已覆盖','已完成'].some(s=>String(b.status||'').includes(s));
  const isReply=b=>['等待','待回复','已联系'].some(s=>String(b.status||'').includes(s));
  const match=b=>bookingFilter==='all'||(bookingFilter==='done'?isDone(b):bookingFilter==='reply'?isReply(b):(!isDone(b)&&!isReply(b)));
  const counts={pending:rows.filter(b=>!isDone(b)&&!isReply(b)).length,reply:rows.filter(isReply).length,done:rows.filter(isDone).length,all:rows.length};
  let h='<div class="sec-title">门票、餐厅、道路与体验预订</div>';
  h+=`<div class="oneliner">当前：${counts.pending}项待处理 · ${counts.reply}项等待回复 · ${counts.done}项已闭环</div>`;
  h+='<div class="filters"><button class="filter '+(bookingFilter==='pending'?'on':'')+'" data-filter="pending">待处理 '+counts.pending+'</button><button class="filter '+(bookingFilter==='reply'?'on':'')+'" data-filter="reply">等回复 '+counts.reply+'</button><button class="filter '+(bookingFilter==='done'?'on':'')+'" data-filter="done">已确认 '+counts.done+'</button><button class="filter '+(bookingFilter==='all'?'on':'')+'" data-filter="all">全部 '+counts.all+'</button></div>';
  rows.filter(match).forEach(b=>{
    const p0=b.priority==='P0';
    const mail=b.contact?`mailto:${b.contact}${b.cc?`?cc=${encodeURIComponent(b.cc)}`:''}`:'';
    h+=`<div class="card"${p0?' style="border-left:4px solid var(--warn)"':''}><h3>${esc(b.name||'')} <span class="status ${p0?'p0':statusClass(b.status)}">${esc(b.priority||'')}</span> <span class="status ${statusClass(b.status)}">${esc(b.status||'')}</span></h3><div class="meta"><span class="tag">${esc(b.date||'')} ${esc(b.time||'')}</span><span class="tag">${esc(b.kind||'')}</span><span class="tag">${esc(b.party||'')}</span><br><b class="lb">期限：</b>${esc(b.deadline||'')}<br><b class="lb">动作：</b>${esc(b.action||'')}<br><b class="lb">备选：</b>${esc(b.fallback||'')}${b.reference&&b.reference!=='—'?`<br><b class="lb">凭证：</b>${esc(b.reference)}`:''}</div>${mail?`<a class="maplink" href="${escAttr(mail)}">✉ 联系 ${esc(b.contact)}</a>`:''}${/^https?:/.test(b.url||'')?`<a class="maplink" href="${escAttr(b.url)}" target="_blank" rel="noopener">↗ 官方页面</a>`:''}</div>`;

    h+=`<details class="card"><summary><b>资料来源与复核日期（${sources.length}）</b></summary><div class="meta" style="margin-top:10px">`;

function packDeletedCount(){
  let n=0;
  (STATE.packing||[]).forEach(c=>{
    (c.items||[]).forEach(it=>{
      const key=packKey(c.cat||'', it||'');
      if(loadDeleted(key)) n++;
    });
  });

}

function syncPackDeletedTools(){
  const btn=$('pack-restore'); if(!btn) return;
  const n=packDeletedCount();
  btn.classList.toggle('on', n>0);
  const cnt=$('pack-deleted-count'); if(cnt) cnt.textContent = n ? String(n) : '';
}

function renderPackRow(key,catIndex,text,original,isCustom){
  const row=document.createElement('div');
  row.className='packi';
  row.dataset.packKey=key;
  row.dataset.packCat=String(catIndex);
  if(isCustom) row.dataset.packCustom='1';
  row.innerHTML=`<input type="checkbox" data-pack-key="${key}" data-pack-cat="${catIndex}" aria-label="勾选行李项"><div class="pack-text" contenteditable="true" role="textbox" spellcheck="false" data-pack-key="${key}" data-pack-original="${escAttr(original||'')}" aria-label="编辑行李项">${esc(text)}</div><button class="pack-del" type="button" data-pack-key="${key}" data-pack-cat="${catIndex}" title="删除此项" aria-label="删除此项">×</button>`;
  return row;
}

function restoreDeletedPacking(){
  (STATE.packing||[]).forEach(c=>{
    (c.items||[]).forEach(it=>{
      const key=packKey(c.cat||'', it||'');
      saveDeleted(key,false);
    });
  });
  renderTodos();
}

function syncPackCounts(cat){
  const cards = cat==null ? document.querySelectorAll('.pack-card') : document.querySelectorAll(`.pack-card[data-pack-cat="${cat}"]`);
  cards.forEach(card=>{
    const inputs=[...card.querySelectorAll('input[type="checkbox"]')];
    inputs.forEach(input=>input.closest('.packi').classList.toggle('done', input.checked));
    const done=inputs.filter(x=>x.checked).length;
    const total=inputs.length;
    const el=$(`pack-count-${card.dataset.packCat}`);
    if(el) el.textContent = total ? `${done}/${total}` : '';
  });
}

function bindPackingChecks(){
  document.querySelectorAll('.packi input').forEach(input=>{
    input.checked = loadChecked(input.dataset.packKey);
    input.onchange=()=>{
      saveChecked(input.dataset.packKey, input.checked);
      syncPackCounts(input.dataset.packCat);
    };
  });
  document.querySelectorAll('.pack-text').forEach(el=>{
    const persist=()=>{
      const saved=savePackText(el.dataset.packKey, el.textContent, el.dataset.packOriginal||'');
      if(cleanPackText(el.textContent)!==saved) el.textContent=saved;
    };
    el.oninput=()=>{ savePackText(el.dataset.packKey, el.textContent, el.dataset.packOriginal||''); };
    el.onblur=persist;
    el.onkeydown=(ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); } };
    el.onpaste=(ev)=>{
      ev.preventDefault();
      const text=(ev.clipboardData||window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, cleanPackText(text));
    };
  });
  document.querySelectorAll('.pack-del').forEach(btn=>{
    btn.onclick=(ev)=>{
      ev.preventDefault();
      ev.stopPropagation();
      const row=btn.closest('.packi');
      const isCustom=row&&row.dataset.packCustom==='1';
      if(isCustom) removeCustomItem(btn.dataset.packCat, btn.dataset.packKey);
      else saveDeleted(btn.dataset.packKey,true);
      const card=btn.closest('.pack-card');
      if(row) row.remove();
      syncPackCounts(btn.dataset.packCat);
      syncPackDeletedTools();
    };
  });
  document.querySelectorAll('.pack-add').forEach(btn=>{
    btn.onclick=()=>{
      const catIndex=btn.dataset.packCat;
      const added=addCustomItem(catIndex,'新增行李项');
      const key=added.key;
      const text=added.item.text;
      const row=renderPackRow(key,catIndex,text,text,true);
      const list=btn.closest('.pack-card').querySelector('.pack-list');
      list.appendChild(row);
      bindPackingChecks();
      const editor=row.querySelector('.pack-text');
      if(editor){
        editor.focus();
        const range=document.createRange();
        range.selectNodeContents(editor);
        const sel=window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      syncPackCounts(catIndex);
    };
  });
  const restore=$('pack-restore');
  if(restore) restore.onclick=restoreDeletedPacking;
  const syncNow=$('pack-sync-now');
  if(syncNow) syncNow.onclick=()=>syncPackCloudNow(true);
  const pushLocal=$('pack-push-local');
  if(pushLocal) pushLocal.onclick=()=>replacePackCloudWithLocal(true);
  syncPackCounts();
  syncPackDeletedTools();
  paintPackSyncStatus();
}

  $('v-sos').innerHTML=h;
}

init();
handlePackCloudbaseHandoff().finally(()=>startPackCloudSync());
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{});
}
</script>
